<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R8簿記演習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 方針: 1問1画面の小さな帳面。インクの紺と朱で、採点だけ色を変える */
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c2433; --muted:#667085; --line:#dcd9d0;
  --accent:#1f3a68; --accent-ink:#ffffff; --ok:#17713f; --ok-bg:#e3f3ea; --ng:#b3261e; --ng-bg:#fbe7e5;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f; --card:#1a2030; --ink:#e8ebf2; --muted:#98a1b3; --line:#2c3447;
  --accent:#8fb0ee; --accent-ink:#0f1624; --ok:#6fd49b; --ok-bg:#16301f; --ng:#ff9a92; --ng-bg:#3a1e1c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161f; --card:#1a2030; --ink:#e8ebf2; --muted:#98a1b3; --line:#2c3447;
  --accent:#8fb0ee; --accent-ink:#0f1624; --ok:#6fd49b; --ok-bg:#16301f; --ng:#ff9a92; --ng-bg:#3a1e1c; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7}
body{padding:0 0 48px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.modes{display:flex;gap:8px;margin-bottom:14px}
.modes button{flex:1;padding:8px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px}
.modes button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.modes button:disabled{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.src{font-size:12px;color:var(--muted);margin-bottom:6px}
.src em{font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px}
.q{margin:0 0 10px;font-weight:500}
.ctx{font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.ctx ul{margin:4px 0 0;padding-left:1.2em}
table.d{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.d th,table.d td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:right}
table.d th:first-child,table.d td:first-child{text-align:left}
table.d th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.tb{font-size:12px}
.tb th,.tb td{padding:2px 4px;white-space:nowrap}
.tb td.l{text-align:left}
.tb.wr td{white-space:normal;text-align:left;vertical-align:top;line-height:1.6}
.tb.wr td:first-child{white-space:nowrap;width:2.5em}
.sm{font-size:13px;color:var(--muted);margin:6px 0 0}
.ctx details>summary{cursor:pointer;color:var(--accent)}
.figs{margin:0 0 12px}
.figs summary{cursor:pointer;color:var(--accent);font-size:14px;padding:4px 0}
.ans{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;font-variant-numeric:tabular-nums;text-align:right;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
select{font:inherit;font-size:15px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.unit{color:var(--muted);font-size:14px;white-space:nowrap}
.side{margin:10px 0 4px;font-weight:700;font-size:14px;color:var(--muted)}
.jr{display:grid;grid-template-columns:1fr 104px;gap:8px;margin-bottom:8px}
.jr input{font-size:16px;padding:10px 8px;text-align:left}
.jr input[data-num]{text-align:right}
.opts{display:grid;gap:8px;margin:8px 0 12px}
.opts button{text-align:left;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit}
.opts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.go{width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:16px}
.go[disabled]{opacity:.5}
.res{margin-top:14px;border-radius:10px;padding:12px;font-size:15px}
.res.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.res.ng{background:var(--ng-bg);border:1px solid var(--ng)}
.res h2{margin:0 0 4px;font-size:16px}
.res.ok h2{color:var(--ok)} .res.ng h2{color:var(--ng)}
.res .corr{font-variant-numeric:tabular-nums;font-weight:700}
.exp{margin-top:8px;font-size:14px;white-space:pre-wrap}
.jsoff{background:var(--ng-bg);border:1px solid var(--ng);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 16px 0}
.wrap .jsoff{margin:0 0 12px}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
footer{margin-top:18px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:12px;padding:4px 0}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.flt button{padding:4px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-size:13px}
.flt button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.lst{list-style:none;margin:0;padding:0}
.lst li+li{border-top:1px solid var(--line)}
.lst button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:11px 2px;background:none;border:0;color:var(--ink);font:inherit;font-size:14px}
.lst .t{flex:1;min-width:0}
.lst .t small{display:block;color:var(--muted);font-size:12px}
.badge{font-size:12px;border-radius:999px;padding:0 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.badge.ng{color:var(--ng);border-color:var(--ng);background:var(--ng-bg)}
.score{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 8px}
.rl{list-style:none;margin:0 0 12px;padding:0;font-size:14px}
.rl li{display:flex;gap:8px;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}
.gt{font-size:17px;margin:0 0 10px}
.item{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.il{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:2px}
.fst{margin:8px 0 4px;font-weight:700;font-size:14px}
table.fs{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;margin-bottom:6px}
table.fs th{color:var(--muted);font-weight:500;font-size:12px;text-align:center;border-bottom:1px solid var(--line);padding:2px 4px}
table.fs td{border-bottom:1px solid var(--line);padding:3px 4px;vertical-align:middle}
table.fs td.n{text-align:right;white-space:nowrap}
table.fs td.l{min-width:7em}
table.fs tr.h td{font-weight:700;background:var(--bg);font-size:13px}
table.fs input{width:100%;min-width:72px;font:inherit;font-size:15px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
table.fs td.n input{text-align:right;font-variant-numeric:tabular-nums}
table.fs .br{display:flex;align-items:center;gap:2px}
table.fs .br input{min-width:120px}
table.fs input.ok{border-color:var(--ok);background:var(--ok-bg)}
table.fs input.ng{border-color:var(--ng);background:var(--ng-bg)}
table.fs small.fix{display:block;color:var(--ng);font-size:12px;text-align:right}
.none{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin:2px 0 4px}
#sum{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.back{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;padding:0 0 8px}
.sec{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:8px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

/* 数字欄のキーボード指定(inputmode)はスマホなどタッチ操作の端末だけに付ける。

function withComma(s){
  s=s.replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
  const m=s.match(/^\s*([-−ー－△▲]?)/),sign=m?m[1]:"";
  const body=s.slice(m?m[0].length:0).replace(/[^\d.]/g,"");
  const dot=body.indexOf(".");
  let ip=dot<0?body:body.slice(0,dot),dp=dot<0?"":"."+body.slice(dot+1).replace(/\./g,"");
  ip=ip.replace(/^0+(?=\d)/,"").replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return sign+ip+dp;
}
document.addEventListener("input",e=>{
  const el=e.target;if(!el.matches||!el.matches('input[data-num]')||e.isComposing)return;
  const v=el.value,pos=el.selectionStart==null?v.length:el.selectionStart;
  const right=v.slice(pos).replace(/[^\d.０-９．]/g,"").length;   /* カーソルより右の数字の数を保つ */
  const nv=withComma(v);if(nv===v)return;
  el.value=nv;
  let p=nv.length,c=0;while(p>0&&c<right){p--;if(/[\d.]/.test(nv[p]))c++}
  try{el.setSelectionRange(p,p)}catch(err){}
});
document.addEventListener("compositionend",e=>{const el=e.target;if(el.matches&&el.matches('input[data-num]'))el.value=withComma(el.value)});

  if(qs.some(q=>st(q.id).lw))return 5;
  if(qs.every(q=>{const s=mem.q[q.id];return !s||s.r+s.w===0}))return 3;
  if(qs.every(q=>st(q.id).s>=2))return .4;
  return 1}

  if(!pool.length)return null;
  const ws=pool.map(([g,qs])=>gweight(qs)),sum=ws.reduce((x,y)=>x+y,0);
  let r=Math.random()*sum;
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i][0]}
  return pool[pool.length-1][0];
}

  if(q.type==="num")return `<div class="ans"><input id="${p}in" type="text" ${NUMATTR} autocomplete="off" aria-label="小問${k+1}の答え" placeholder="答えを入力"><span class="unit">${q.unit}</span></div>`;
  if(q.type==="choice")return `<div class="opts" data-k="${k}">${q.opts.map((o,i)=>`<button type="button" data-i="${i}" aria-pressed="false">${o}</button>`).join("")}</div>`;
  if(q.type==="text")return `<div class="ans"><input id="${p}in" type="text" autocomplete="off" spellcheck="false" aria-label="小問${k+1}の答え" placeholder="語句を入力" style="text-align:left"></div>`;
  const n=Math.max(2,q.dr.length,q.cr.length);
  let h=`<div class="side">借方</div>`;
  for(let i=0;i<n;i++)h+=`<div class="jr">${acctSel(p+"d"+i)}<input id="${p}da${i}" type="text" ${NUMATTR} autocomplete="off" aria-label="借方金額" placeholder="金額"></div>`;
  h+=`<div class="side">貸方</div>`;
  for(let i=0;i<n;i++)h+=`<div class="jr">${acctSel(p+"c"+i)}<input id="${p}ca${i}" type="text" ${NUMATTR} autocomplete="off" aria-label="貸方金額" placeholder="金額"></div>`;
  h+=`<label class="none"><input type="checkbox" id="${p}none"> 仕訳不要</label>`;
  return h;
}
function renderGroup(){
  stats();
  const its=run.items,c=$("card");
  const ctxs=[...new Set(its.map(q=>q.ctx).filter(Boolean))];
  let h=(mode==="list"?`<button class="back" id="back" type="button">← 一覧に戻る</button>`:"")+
    `<div class="src">${esc(its[0].src.split(" ")[0])}<em>${its[0].tag}</em></div><h2 class="gt">演習問題 ${run.g}</h2>${ctxs.join("")}`;
  its.forEach((q,k)=>{h+=`<section class="item"><div class="il">小問${k+1}</div><p class="q">${esc(q.q)}</p>${inputH(q,k)}<div id="out${k}"></div></section>`});
  h+=`<div id="sum"><button class="go" id="go" type="button">まとめて答え合わせ</button></div>`;
  c.innerHTML=h;
  $("go").onclick=check;if($("back"))$("back").onclick=showList;
  c.querySelectorAll(".opts").forEach(box=>{const k=+box.dataset.k;box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(run.done)return;box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");run.chosen[k]=+b.dataset.i})});
}
/* 同じ科目の行は合計して比べる。借方と貸方に同じ科目があっても各側で判定 */
function agg(pairs){const m={},o=[];pairs.forEach(([a,v])=>{if(a in m&&v!==""&&m[a]!==""&&!isNaN(m[a]))m[a]+=v;else if(a in m){m[a]=NaN}else m[a]=v});for(const a in m)o.push(a+":"+m[a]);return o.sort()}
function netOf(d,c){const m={};const add=(s,k)=>{const i=s.lastIndexOf(":"),a=s.slice(0,i),v=+s.slice(i+1);m[a]=(m[a]||0)+k*v};d.forEach(s=>add(s,1));c.forEach(s=>add(s,-1));const o={};for(const a in m){if(isNaN(m[a]))return null;if(m[a]!==0)o[a]=m[a]}return JSON.stringify(Object.keys(o).sort().map(a=>a+":"+o[a]))}
/* 同じ科目を借方・貸方の両方に書いた解答と、相殺した純額の解答を同じとみなす */
function netEq(d,c,ed,ec){const x=netOf(d,c);return x!==null&&x===netOf(ed,ec)}
function readLines(p,al){const o=[];for(let i=0;$(p+i);i++){let a=normA($(p+i).value);if(al&&al[a])a=al[a];const m=norm($(p+"a"+i).value);if(a||m)o.push([a,m===""?"":+m])}return agg(o)}
const DASH=/^[-−ー－―‐]$|^なし$/;
function cellOk(a,v){if(typeof a==="number"){const s=norm(v);return s!==""&&!isNaN(+s)&&+s===a}
  const as=[].concat(a);if(as.includes("−"))return DASH.test(v.trim());const x=normA(v);return x!==""&&as.some(y=>normA(y)===x)}
const fmtA=a=>typeof a==="number"?(a<0?"△"+fmt(-a):fmt(a)):[].concat(a)[0];
function gradeFs(q,k){
  const p="q"+k+"_";let j=0,pts=0,n=0,blank=true;const marks=[];
  q.tables.forEach(tb=>{
    const rows=[];tb.rows.forEach(r=>{if(r.h!==undefined)return;const cs=r.c||r;const bl=[];cs.forEach(c=>{if(c&&typeof c==="object")bl.push({a:c.a,id:p+"c"+(j++)})});if(bl.length)rows.push({set:r.set,bl})});
    rows.forEach(r=>r.bl.forEach(b=>{b.v=$(b.id).value;if(b.v.trim()!=="")blank=false}));
    const sets={};rows.forEach(r=>{if(r.set){(sets[r.set]=sets[r.set]||[]).push(r)}else r.ans=r.bl.map(b=>b.a)});
    /* 順不同の行: 入力された行を、全空欄が一致する正解行に割り当てる */
    Object.values(sets).forEach(rs=>{const pool=rs.map(r=>r.bl.map(b=>b.a)),used=[];
      rs.forEach(r=>{const i=pool.findIndex((a,ix)=>!used.includes(ix)&&a.every((x,bi)=>cellOk(x,r.bl[bi].v)));if(i>=0){used.push(i);r.ans=pool[i]}});
      rs.forEach(r=>{if(!r.ans){const i=pool.findIndex((a,ix)=>!used.includes(ix));used.push(i);r.ans=pool[i]}})});
    rows.forEach(r=>r.bl.forEach((b,bi)=>{const a=r.ans[bi],ok=cellOk(a,b.v);n++;if(ok)pts++;marks.push({id:b.id,ok,a})}));
  });
  return {ok:pts===n,pts,n,blank,marks,corr:pts+" / "+n+" 欄正解"};
}
function grade(q,k){
  if(q.type==="fs")return gradeFs(q,k);
  const p="q"+k+"_";let ok=false,corr="",blank=false;
  if(q.type==="num"){const v=norm($(p+"in").value);blank=v==="";ok=!blank&&+v===q.ans;corr=fmt(q.ans)+q.unit}
  if(q.type==="text"){const v=normA($(p+"in").value);blank=v==="";const as=[].concat(q.ans);ok=!blank&&as.some(a=>normA(a)===v);corr=as[0]}
  if(q.type==="choice"){blank=run.chosen[k]===undefined;ok=run.chosen[k]===q.ans;corr=q.opts[q.ans]}
  if(q.type==="jnl"){
    const d=readLines(p+"d",q.al),c=readLines(p+"c",q.al),nn=$(p+"none").checked;blank=!d.length&&!c.length&&!nn;
    const ed=agg(q.dr.map(x=>[normA(x[0]),x[1]])),ec=agg(q.cr.map(x=>[normA(x[0]),x[1]]));
    ok=q.dr.length===0?(nn&&!d.length&&!c.length):(!nn&&((JSON.stringify(d)===JSON.stringify(ed)&&JSON.stringify(c)===JSON.stringify(ec))||netEq(d,c,ed,ec)));
    const line=a=>a.map(x=>x[0]+" "+fmt(x[1])).join(" / ");
    corr=q.dr.length===0?"仕訳不要":"(借) "+line(q.dr)+"\n(貸) "+line(q.cr);
  }
  return {ok,corr,blank};
}
function check(){
  if(run.done)return;
  const gs=run.items.map(grade);
  if(gs.every(x=>x.blank)){$("sum").insertAdjacentHTML("afterbegin",`<p class="sm" id="warn">答えを1つ以上入力してから答え合わせしてください。</p>`);const w=document.querySelectorAll("#warn");if(w.length>1)w[1].remove();return}
  run.done=true;
  run.pts=0;run.tot=0;
  gs.forEach((r,k)=>{
    const q=run.items[k];run.res[k]=r.ok;r.pts=r.n?r.pts:(r.ok?1:0);r.n=r.n||1;
    if(r.marks)r.marks.forEach(m=>{const e=$(m.id);e.classList.add(m.ok?"ok":"ng");if(!m.ok)$(m.id+"f").innerHTML=`<small class="fix">${esc(String(fmtA(m.a)))}</small>`});
    run.pts+=r.pts;run.tot+=r.n;
    const s=st(q.id);if(r.ok){s.r++;s.s++;s.lw=false}else{s.w++;s.s=0;s.lw=true}
    $("out"+k).innerHTML=`<div class="res ${r.ok?"ok":"ng"}"><h2>${r.ok?"正解":(r.blank?"未解答":"不正解")}</h2>${r.marks?`<div class="corr">${esc(r.corr)}</div>`:`<div>正解: <span class="corr" style="white-space:pre-wrap">${esc(r.corr)}</span></div>`}<div class="exp">${esc(q.exp)}</div></div>${postH(q.post)}`;
  });
  document.querySelectorAll("#card input,#card select").forEach(e=>e.disabled=true);
  mem.days[today()]=(mem.days[today()]||0)+run.items.length;save();stats();last=run.g;
  $("sum").innerHTML=`<div class="score">${run.pts} / ${run.tot}</div>`+(mode==="list"
    ?`<button class="go" id="again" type="button">もう一度解く</button><button class="go sec" id="tolist" type="button">問題番号の一覧へ</button>`
    :`<button class="go" id="nextg" type="button">次の問題番号へ</button><button class="go sec" id="again" type="button">もう一度解く</button>`);
  $("again").onclick=()=>{startRun(run.g);window.scrollTo(0,0)};
  if($("tolist"))$("tolist").onclick=()=>{showList();window.scrollTo(0,0)};
  if($("nextg"))$("nextg").onclick=()=>{nextAuto();window.scrollTo(0,0)};
}
function setMode(m){
  if(m==="wrong"&&$("mWrong").disabled)return;
  mode=m;
  [["all","mAll"],["wrong","mWrong"],["list","mList"]].forEach(([k,id])=>$(id).setAttribute("aria-pressed",String(k===m)));
  if(m==="list")showList();else nextAuto();
}
$("mAll").onclick=()=>setMode("all");
$("mWrong").onclick=()=>setMode("wrong");
$("mList").onclick=()=>setMode("list");
$("reset").onclick=()=>{if($("reset").dataset.s!=="1"){$("reset").dataset.s="1";$("reset").textContent="もう一度押すと全記録を消去";return}
  mem={q:{},days:{}};save();$("reset").dataset.s="";$("reset").textContent="記録をリセット";last=null;setMode("all")};
load();nextAuto();
</script>
