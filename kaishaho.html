<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会社法演習</title><style>:root{--bg:#f6f5f1;--card:#fff;--ink:#1c2433;--muted:#667085;--line:#dcd9d0;--accent:#1f3a68;--ai:#fff;--ok:#17713f;--okbg:#e3f3ea;--ng:#b3261e;--ngbg:#fbe7e5} @media(prefers-color-scheme:dark){:root{--bg:#12161f;--card:#1a2030;--ink:#e8ebf2;--muted:#98a1b3;--line:#2c3447;--accent:#8fb0ee;--ai:#0f1624;--ok:#6fd49b;--okbg:#16301f;--ng:#ff9a92;--ngbg:#3a1e1c;color-scheme:dark}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",sans-serif;line-height:1.7;padding-bottom:48px}.wrap{max-width:620px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}h1{margin:0;font-size:18px}.stats,.modes,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:13px;color:var(--muted)}.chip b{color:var(--ink)}.bar{height:6px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}button{font:inherit}.modes button{flex:1;min-width:100px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.src{font-size:12px;color:var(--muted)}.q{white-space:pre-wrap;margin:10px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts button{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:18px}.fill{display:grid;gap:8px}.fill label{display:grid;grid-template-columns:2.5em 1fr;align-items:center}.fill input{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}.go{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--ai);font-weight:700}.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}.res{margin-top:14px;padding:12px;border-radius:10px}.res.ok{background:var(--okbg);border:1px solid var(--ok)}.res.ng{background:var(--ngbg);border:1px solid var(--ng)}.res h2{font-size:16px;margin:0}.exp{white-space:pre-wrap;font-size:14px;margin-top:6px}.filters button{padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font-size:13px}.list{list-style:none;padding:0;margin:0}.list li+li{border-top:1px solid var(--line)}.list button{width:100%;display:flex;justify-content:space-between;text-align:left;padding:10px 2px;border:0;background:none;color:var(--ink)}.badge{font-size:12px;color:var(--muted)}footer{margin-top:16px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}footer button{border:0;background:none;color:var(--muted);text-decoration:underline}.back{border:0;background:none;color:var(--accent);padding:0}.empty{text-align:center;color:var(--muted);padding:24px}</style></head><body><div class="wrap"><header><h1>会社法演習</h1><span class="chip">今日 <b id="today">0</b>問</span></header><div class="stats"><span class="chip">達成 <b id="done">0</b>/<b id="total">0</b></span><span class="chip">正答率 <b id="rate">-</b></span><span class="chip">要復習 <b id="wrong">0</b></span></div><div class="bar"><i id="prog"></i></div><div class="modes"><button data-mode="all" aria-pressed="true">間違い優先</button><button data-mode="wrong">要復習だけ</button><button data-mode="list">問題番号で選ぶ</button></div><div class="modes" id="qtrow"><button data-qt="all" aria-pressed="true">形式：すべて</button><button data-qt="tf" aria-pressed="false">○×のみ</button><button data-qt="fill" aria-pressed="false">記述（穴埋め）のみ</button></div><main class="card" id="card"></main><footer><span>会社法過去問より</span><button id="reset">記録をリセット</button></footer></div><script>const Q=[{"id": "tf-1", "no": "1-1", "tag": "総則・機関", "type": "tf", "q": "１－１　株式会社では一人会社は認められるが、持ち分会社では一人会社は認められない。【R3 出題】", "ans": "×", "exp": "株式会社、持分会社いずれも一人会社は認められる。"}, {"id": "tf-2", "no": "1-2", "tag": "総則・機関", "type": "tf", "q": "１－２　株主の剰余金配当請求権と残余財産分配請求権は強行法的に保障され、その双方又は一方を株主に与えない旨の定款規定は無効である。【R1・R5 出題】", "ans": "×", "exp": "会 105② 株主の剰余金配当請求権と残余財産分配請求権のいずれか一方は強行法的に保障される。"}, {"id": "tf-3", "no": "1-3", "tag": "総則・機関", "type": "tf", "q": "１－３　一般社団法人の社員には、剰余金配当請求権と残余財産分配請求権のいずれも認められないのに対して、株式会社の株主には、剰余金配当請求権と残余財産分配請求権のいずれか一方は強行法的に保障される。【H30 出題】", "ans": "○", "exp": "会 105②、一般社団法人法 11②"}, {"id": "tf-4", "no": "1-4", "tag": "総則・機関", "type": "tf", "q": "１－４　会社はすべて商人であるが、一般社団法人・一般財団法人は商人になりえない。【H29・R4 出題】", "ans": "×", "exp": "一般社団法人法 9(ポケ六 524 頁) の反対解釈。"}, {"id": "tf-5", "no": "1-5", "tag": "総則・機関", "type": "tf", "q": "１－５　判例によれば、中小企業等協同組合法に基づいて設立された信用協同組合は、商法上の商人に当たらない。", "ans": "○", "exp": "最判昭 48.10.5。信用協同組合は商法上の商人に当たらない。"}, {"id": "tf-6", "no": "1-6", "tag": "総則・機関", "type": "tf", "q": "１－６　持分会社の無限責任社員は、定款に別段の定めがない限り、その地位に基づいて業務執行権を有するのに対して、持分会社の有限責任社員と株式会社の株主は、その地位に基づいて業務執行権を有することはない。【R5.R3 出題】", "ans": "×", "exp": "会 590① 持分会社の有限責任社員は、その地位に基づき業務執行権を有する。"}, {"id": "tf-7", "no": "1-7", "tag": "総則・機関", "type": "tf", "q": "１－７　有限会社法に基づきすでに設立された有限会社は、会社法施行後は、特別な手続を経ることなく株式会社として存続するため、もはや商号中に有限会社という文字を使用することはできない。【H30・R3・R5 出題】", "ans": "×", "exp": "会社整備 2①、会社整備 3　有限会社という文字を使用することはできる。"}, {"id": "tf-8", "no": "1-8", "tag": "総則・機関", "type": "tf", "q": "１－８　合同会社における社員（株主）が負う責任の範囲は間接有限責任であるとされるため、社員（株主）が直接経営に携わることはない。", "ans": "×", "exp": "持分会社は、相互に信頼関係のある少数の者が自ら直接経営に携わることを予定した会社形態である。"}, {"id": "tf-9", "no": "1-9", "tag": "総則・機関", "type": "tf", "q": "１－９　合名会社では新たに有限責任社員を加入させることにより合資会社となることができ、合資会社において有限責任社員がいなくなった場合でも、解散することなく合名会社として存続することができる。【R1・R4 出題】", "ans": "○", "exp": "会 638 条、639 条"}, {"id": "tf-10", "no": "1-10", "tag": "総則・機関", "type": "tf", "q": "1-10　合資会社は有限責任社員がいなくなった場合、解散せず合名会社として存続できる。合資会社において、有限責任社員が退社しても、無限責任社員が 2 人以上いれば合名会社として存続することができるが、社員が 1 人しかいなくなった場合には解散する。【H30・R5 出題】", "ans": "×", "exp": "会 639 ①カイ"}, {"id": "tf-11", "no": "1-11", "tag": "総則・機関", "type": "tf", "q": "1-11　株式会社とは、不特定多数の者から出資を集めて大規模企業を営むことを可能にするための法的機構を備え、社員（株主）がその地位に基づいて直接経営に携わらない会社形態のことである。", "ans": "○", "exp": "不特定多数からの資本結集や、所有と経営の分離という概念からは、○になる。しかし、株式会社が一人株式会社をやや否定的にみていたり、同族会社がままあることを考えると、実質ベースでは×とも答えられる。"}, {"id": "tf-12", "no": "1-12", "tag": "総則・機関", "type": "tf", "q": "1-12　新会社法において、ある株式会社が別の株式会社の親会社となるためには、必ずその株式会社の総株主の議決権の過半数を保有しなければならないとされている。", "ans": "×", "exp": "会施規 3 ：議決権の過半数を保有しなくても、財務・事業方針の決定を支配している場合、親会社となれる。"}, {"id": "tf-13", "no": "1-13", "tag": "総則・機関", "type": "tf", "q": "1-13　すべての株式会社は定款により会計参与を設置できる。", "ans": "○", "exp": "会 326②カイ"}, {"id": "tf-14", "no": "1-14", "tag": "総則・機関", "type": "tf", "q": "1-14　会計参与は、非公開会社に限り、定款の定めにより設置することができる。【R3 出題】", "ans": "×", "exp": "会 326② 株式会社は定款定めによって会計参与を設置することができる。"}, {"id": "tf-15", "no": "1-15", "tag": "総則・機関", "type": "tf", "q": "1-15　公開会社では、取締役の任期は 2 年とされており、短縮も伸張もできない。", "ans": "×", "exp": "会 332① 短縮可・伸長不可(cf.会 336①監査役の任期については、伸長・短縮不可）"}, {"id": "tf-16", "no": "1-16", "tag": "総則・機関", "type": "tf", "q": "1-16　公開会社では、株主資格と取締役資格が強行法的に分離しているため株主の中から取締役を選任はできない。【H30・R4 出題】", "ans": "×", "exp": "会 331②取締役を株主に限定する定款は NG、株主から取締役を選任は OK"}, {"id": "tf-17", "no": "1-17", "tag": "総則・機関", "type": "tf", "q": "1-17　公開会社（指名委員会等設置会社と監査等委員会設置会社を除く。）の取締役の任期は 2 年、監査役の任期は 4 年であり、いずれの任期も、定款又は株主総会決議をもって短縮することも伸長することもできない。【R1 出題】", "ans": "×", "exp": "会 332①取締役は短縮可、伸長不可。"}, {"id": "tf-18", "no": "1-18", "tag": "総則・機関", "type": "tf", "q": "1-18　公開会社と非公開会社を問わず、株主総会は会社法及び定款所定の会社の基本的重要事項について決議する事ができるにすぎない【R1・R3 出題】", "ans": "×", "exp": "会 295①② 一切の事項について決議可。取締役設置会社は、会社法の規定内容及び定款規定内容のみ決議可能。"}, {"id": "tf-19", "no": "1-19", "tag": "総則・機関", "type": "tf", "q": "1-19　公開会社と非公開会社とを問わず、株主総会は会社に関する一切の事項について決議をすることができる。【R4 出題】", "ans": "×", "exp": "会 295①② 取締役会設置会社は、法律に規定する事項及び定款で範囲内に限り、決議できる。"}, {"id": "tf-20", "no": "1-20", "tag": "総則・機関", "type": "tf", "q": "1-20　公開会社では、監査役の任期は 4 年とされており、短縮も伸張もできない。", "ans": "○", "exp": "会 336① 伸長・短縮不可。"}, {"id": "tf-21", "no": "1-21", "tag": "総則・機関", "type": "tf", "q": "1-21　非公開会社（指名委員会等設置会社と監査等委員会設置会社を除く）では、取締役と監査役の任期に制限はない。【H29 出題】", "ans": "×", "exp": "会 332②、336② 10 年まで可能である。"}, {"id": "tf-22", "no": "1-22", "tag": "総則・機関", "type": "tf", "q": "1-22　非公開会社（指名委員会等設置会社と監査等委員会設置会社を除く）では、定款により取締役と監査役の任期を 10 年まで伸長することができる。【R5 出題】", "ans": "○", "exp": "会 332②、336② 10 年まで可能である。"}, {"id": "tf-23", "no": "1-23", "tag": "総則・機関", "type": "tf", "q": "1-23　監査役会設置会社では、監査役会を通じて組織的に監査を行うため、各監査役は単独で監査役としての権限を行使することはできない。【H30・R3・R4 出題】", "ans": "×", "exp": "会 390②柱書、三 監査役会設置会社の業務及び財産の状況の調査の方法等について監査役は単独で可能。"}, {"id": "tf-24", "no": "1-24", "tag": "総則・機関", "type": "tf", "q": "1-24　公開会社と非公開会社とを問わず、定款をもって取締役の資格を株主に限定する旨の定めを置くことはできない。【R1 出題】", "ans": "×", "exp": "会 331②但書 非公開なら OK、公開会社では取締役＝株主と定款で定めることはできない。"}, {"id": "tf-25", "no": "1-25", "tag": "総則・機関", "type": "tf", "q": "1-25　非公開会社において監査役が設置される場合、定款をもって監査役の権限を会計監査に限定することができる。【R1 出題】", "ans": "○", "exp": "会 389①カイ"}, {"id": "tf-26", "no": "1-26", "tag": "総則・機関", "type": "tf", "q": "1-26　非公開会社において監査役が設置される場合、定款をもって監査役の権限を業務監査と会計監査のいずれかに限定することができる。【R3 出題】", "ans": "×", "exp": "会 389① いずれかにではなく会計監査のみに限定することができる。"}, {"id": "tf-27", "no": "1-27", "tag": "総則・機関", "type": "tf", "q": "1-27　非公開会社のうち、監査等委員会設置会社及び指名委員会等設置会社を除く大会社に該当する株式会社は、監査役及び会計監査人を置かなければならない。", "ans": "○", "exp": "会社法 327 条 3 項・4 項・5 項、328 条 2 項。監査等委員会設置会社及び指名委員会等設置会社を除く非公開大会社では、監査役及び会計監査人の設置を要する。"}, {"id": "tf-28", "no": "1-28", "tag": "総則・機関", "type": "tf", "q": "1-28　非公開会社において、定款上取締役を株主に限定することは可能であるが、取締役の任期は定款で伸長することはできない。", "ans": "×", "exp": "会 331②但書、会 332② 取締役の任期は定款で 10 年まで伸長可。"}, {"id": "tf-29", "no": "1-30", "tag": "総則・機関", "type": "tf", "q": "1-30　大会社でない非公開会社では、監査役を置かなくてもよいが、会計監査人を置く場合には監査役も置かなければならない。【H30 出題】", "ans": "○", "exp": "会 326②、会 327③カイ"}, {"id": "tf-30", "no": "1-31", "tag": "総則・機関", "type": "tf", "q": "1-31　非公開会社において、株主総会の権限に制限はない。", "a 会 25①　問題文の日本語がややおかしいが、同①一は発起設立、二が募集設立の説明である。"}, {"id": "tf-69", "no": "2-6", "tag": "設立・株式", "type": "tf", "q": "２－６　合同会社の設立に際する出資については、定款上で債権的に確保されれば足り、設立段階で出資の履行を強制する必要はない。", "ans": "×", "exp": "会 578 合同会社では設立段階で出資全部の履行が要求される。"}, {"id": "tf-70", "no": "2-7", "tag": "設立・株式", "type": "tf", "q": "２－７　株式会社で発起設立を行う場合、創立総会を開かなければならない。", "ans": "×", "exp": "会 57①、会 65①　発起設立は創立総会の招集を要しない、募集設立は創立総会の招集を要する。"}, {"id": "tf-71", "no": "2-8", "tag": "設立・株式", "type": "tf", "q": "２－８　発起設立と募集設立とを問わず、出資の履行が完了した後、創立総会を招集することを要する。【R3 出題】", "ans": "×", "exp": "会 57①、会 88①　発起設立は、創立総会を招集することを要しない。"}, {"id": "tf-72", "no": "3-1", "tag": "株式・株主", "type": "tf", "q": "３－１　数人の相続人が株式を共同相続した場合、権利行使者を指定して株式会社に通知しなければ、株主としての権利を行使することはできないが、会社が同意すれば、相続人全員が株主としての権利を共同行使することができる。【H29・R3 出題】", "ans": "○", "exp": "会 106 カイ"}, {"id": "tf-73", "no": "3-2", "tag": "株式・株主", "type": "tf", "q": "３－２　数人の相続人が株式を共同相続した場合、権利行使者を指定して株式会社に通知しなければ、株主としての権利を行使することはできないため、権利行使者ではない共同相続人には、事情の如何を問わず、会社法上の訴えの原告適格は認められない。【H30・R5 出題】", "ans": "×", "exp": "最判 H3.2.19 例外的に共有者の一部につき原告適格が認められる。また、会社の同意があれば行使可能(会 106)。"}, {"id": "tf-74", "no": "3-3", "tag": "株式・株主", "type": "tf", "q": "３－３　判例によれば、会社が共有者たる共同相続人の 1 人による権利行使を認めることができるかについて、特段の事情があるときは、例外的に共有者の一部につき会社法上の訴えの原告適格が認められるとした。", "ans": "○", "exp": "最判平 2.12.4、平 3.2.19"}, {"id": "tf-75", "no": "3-4", "tag": "株式・株主", "type": "tf", "q": "３－４　剰余金配当決議によって配当金額が確定しても、株主は株式と切り離して剰余金配当請求権を譲渡することはできない。【R1 出題】", "ans": "×", "exp": "剰余金配当決議によって具体的な配当金請求権が発生した後は、その請求権は株式とは独立した金銭債権となり、単独で譲渡できる。事実、配当受領証(配当金領収書)は簿記で現金として扱うし、だれが郵便局等にもっていっても換金できる。"}, {"id": "tf-76", "no": "3-5", "tag": "株式・株主", "type": "tf", "q": "３－５　自益権とは会社の経営に関与する権利であり、共益権とは、会社から経済的利益を受ける権利である。", "ans": "×", "exp": "自益権と共益権に関する記述が逆である。"}, {"id": "tf-77", "no": "3-6", "tag": "株式・株主", "type": "tf", "q": "３－６　判例によれば、株式の共有者が権利行使者を定めるには、共有者全員の同意を要する。【R1 出題】", "ans": "×", "exp": "民法 252、最判 H9.1.28 共有者が持分の価格に従い、その過半数をもって定める。"}, {"id": "tf-78", "no": "3-7", "tag": "株式・株主", "type": "tf", "q": "３－７　所有権における収益権能に相当するものが自益権、使用・処分の権能に相当するものが共益権である。", "ans": "○", "exp": "自益権は、株主が会社からお金をもらったりする権利。共益権は、会社の意思決定や経営に参加する権利。議決権行使とか。"}, {"id": "tf-79", "no": "3-8", "tag": "株式・株主", "type": "tf", "q": "３－８　株主権は所有権が団体法的に変容したものであり、物権でも債権でもない特殊な財産権である。", "ans": "○", "exp": "最判 S45.7.15"}, {"id": "tf-80", "no": "3-9", "tag": "株式・株主", "type": "tf", "q": "３－９　少数株主権は、数人の株主の有する議決権数または持株数の合計がその要件を満たす場合には、その数人の株主が共同して行使することもできる。【R3.H29 出題】", "ans": "○", "exp": "少数株主権は合算可能。株主提案権等。よって、所有株式数が少なくても、株主同士が一致団結すれば、「いよぎん阿鼻叫喚 HD」なる名称変更提案も可能。"}, {"id": "tf-81", "no": "3-10", "tag": "株式・株主", "type": "tf", "q": "３-10　少数株主権の行使としてなされる訴えにおいて、原告株主は訴訟提起時に所定の議決権保有比率又は持株比率を維持しておけばよい。", "ans": "×", "exp": "訴訟提起時から訴訟終了時まで所定の議決権保有比率又は持株比率を維持しなければならない。"}, {"id": "tf-82", "no": "3-11", "tag": "株式・株主", "type": "tf", "q": "３-11　少数株主権の行使としてなされる訴えにおいて、新株発行などにより株主自ら意思によらず持株比率が低下した場合では、特段の事情の事情がない限り、原告適格を失うことはない。", "ans": "×", "exp": "最判 H18.9.28 少数株主権行使妨害のため新株を発行したなどの特段の事情がない限り原告適格を失う。"}, {"id": "tf-83", "no": "3-12", "tag": "株式・株主", "type": "tf", "q": "３-12　判例によれば、株主が少数株主権の行使として会社法上の訴えを提起した場合において、その後に持株比率が低下して少数株主権行使の要件を欠くに至っても、原告適格を失わない。【R4 出題】", "ans": "×", "exp": "最判 H18.9.28 少数株主権行使妨害のため新株を発行したなどの特段の事情がない限り原告適格を失う。"}, {"id": "tf-84", "no": "3-13", "tag": "株式・株主", "type": "tf", "q": "３-13　株主の代表訴訟提起権・総会招集請求権など一定の権利を行使するためには、6 ヶ月前から引き続き株式を保有していることが要求されるが、非公開会社ではこのような株式保有期間の制限は課されない。【H30 出題】", "ans": "○", "exp": "会 847②、会 297②"}, {"id": "tf-85", "no": "3-14", "tag": "株式・株主", "type": "tf", "q": "３-14　株式会社は、定款をもって、一定数の株式を一単元の株式とする旨を定めることができ、この場合、一単元の株式につき一個の議決権が認められ、単元未満株式には議決権をはじめとする一切の共益権が認められない。【R1 出題】", "ans": "×", "exp": "単元未満株式には議決権は認めないが、議決権を前提としない単独株主権たる共益権は認められる。"}, {"id": "tf-86", "no": "3-15", "tag": "株式・株主", "type": "tf", "q": "３-15　単元未満株式であっても、議決権は認められる。", "ans": "×", "exp": "会 189① 単元未満株式には議決権を認めないこととする。"}, {"id": "tf-87", "no": "3-16", "tag": "株式・株主", "type": "tf", "q": "３-16　単元未満株主は、定款の定めがなくても、その有する単元未満株式を買い取るよう会社に請求することができるほか、定款の定めがあれば、その有する単元未満株式の数と併せて一単元の株式数となる数の株式を売り渡すよう会社に請求することができる。【R3 出題】", "ans": "○", "exp": "会 192 主", "type": "tf", "q": "３-54　A 株式会社は、B 株式会社の総株主の議決権の 60%を保有している。B 会社が自己株式及び A 会社の株式を適法に保有している場合、B 会社は、自己株式については相当の時期に処分することを要しないが、A 会社の株式については相当の時期に処分することを要する。【R1 出題】", "ans": "○", "exp": "会 135③カイ"}, {"id": "tf-126", "no": "3-55", "tag": "株式・株主", "type": "tf", "q": "３-55　A 株式会社は、B 株式会社の総株主の議決権の 60%を保有している。B 会社が自己株式及び A 会社の株式を適法に保有している場合、B 会社は、自己株式について B 会社の株主総会において議決権を行使することはできないが、A 会社の株式については A 会社の株主総会において議決権を行使することができる。【R1 出題】", "ans": "×", "exp": "議決数の過半数を所有されている子会社(会２三)は、従前持っていた親会社株式は相当の時期に処分を要し(135③)、株主として判定されず、議決権を有しない(308①)。また、自己株式は議決権を有しない(308②)。"}, {"id": "tf-127", "no": "3-56", "tag": "株式・株主", "type": "tf", "q": "３-56　取締役会設置会社である A 株式会社（以下 A 社という。）は、B 株式会社（以下 B 社という。）の総株主の議決権の 60%を保有している。この場合、B 社は原則として A 社の株式を取得することはできないが、B 社が例外的に適法に A 社株式を保有している場合、A 社は取締役会決議をもってその株式を買い受けることができる。【H29 出題】", "ans": "○", "exp": "子会社は親会社株式を取得できない(会 135①)。親会社が子会社保有の自社株を買い取る際は、取締役会(会 163 による読み替え)の決議による(会 156①)。"}, {"id": "tf-128", "no": "3-57", "tag": "株式・株主", "type": "tf", "q": "３-57　株式譲渡の承認機関は原則的に、取締役会設置会社では取締役会、それ以外では株主総会である。", "ans": "○", "exp": "会 139①カイ"}, {"id": "tf-129", "no": "3-58", "tag": "株式・株主", "type": "tf", "q": "３-58　株式会社は、その発行する株式の取得に承認を要する場合を定款によって限定することが可能である。", "ans": "○", "exp": "会 107②一以下　会 107①一と連動している。"}, {"id": "tf-130", "no": "3-59", "tag": "株式・株主", "type": "tf", "q": "３-59　株式会社がその発行する株式の取得を不承認とした場合に、当該譲渡制限株式を買い取る必要があり、その場合、株主総会の特別決議を要し、財源規制にも服する。", "ans": "○", "exp": "会 140、会 461①一"}, {"id": "tf-131", "no": "3-60", "tag": "株式・株主", "type": "tf", "q": "３-60　株式会社は、譲渡制限株式の相続人に対して相続により取得した株式を会社に売り渡すよう請求できる旨を定款に定めることができるが、株式売渡請求をなすには株主総会の特別決議を要し、その請求は会社が相続があったことを知った日から 1 年以内にしなければならない。【H30・R4 出題】", "ans": "○", "exp": "会 174、会 176①"}, {"id": "tf-132", "no": "3-61", "tag": "株式・株主", "type": "tf", "q": "３-61　株式会社は、譲渡制限株式の相続人に対して相続により取得した株式を会社に売り渡すよう請求できる旨を定款に定めることができるが、株式売渡請求をするには株主総会の特別決議を要し、その決議において売渡人たる相続人は議決権を行使することができない。【R5 出題】", "ans": "○", "exp": "定款に定めがあれば当該株式の売り渡しを請求できる(会 174)が、その都度株主総会の特別決議(会 309②三)を要し、請求の相手方はこの特別決議の議決権を行使できない(会 175②)。"}, {"id": "tf-133", "no": "3-62", "tag": "株式・株主", "type": "tf", "q": "３-62　株式会社が定款を変更して株式譲渡を禁止する定めを設けようとするときは、株主全員の同意を得なければならない。", "ans": "×", "exp": "会 309③一　厳格な多数決が必要"}, {"id": "tf-134", "no": "3-63", "tag": "株式・株主", "type": "tf", "q": "３-63　譲渡による株式の取得につき会社の承認を要する旨の定款規定のある会社で、会社が株主から承認請求のあった株式の譲受けを承認しない場合、会社は分配可能額の有無にかかわらず自らその対象株式を買い取らなければならない。【R5.R3 出題】", "ans": "×", "exp": "制限譲渡株式の株式取得者から請求があった場合(会 138)、承認しない場合は買い取らなければならない(140①)。この際に交付する金銭は、分配可能額を超えてはならない(461①一)。つまり、限度額以上は買えないので、財源規制にひっかかっていたら買い取れない。"}, {"id": "tf-135", "no": "3-64", "tag": "株式・株主", "type": "tf", "q": "３-64　譲渡による株式の取得につき会社の承認を要する旨の定款規定のある取締役会設置会社では、その承認機関は取締役会であり、定款をもって株主総会を承認機関とすることはできない。【R1 出題】", "ans": "×", "exp": "会 139①但書 ただし、定款に別段の定めのある場合はこの限りでない。"}, {"id": "tf-136", "no": "4-1", "tag": "株主総会", "type": "tf", "q": "４-１　判例によれば、従業員株主を他の株主よりも先に入場させて、株主席の前方へ着席させた措置につき適切ではなく、同じ株主総会に出席する株主に対しては、合理的理由のない限り同一の取扱いをすべきとされている。", "ans": "○", "exp": "最判平 8.11.12 ただし本事例では法的利益は侵害されていないとして、損害賠償請求は棄却された。"}, {"id": "tf-137", "no": "4-2", "tag": "株主総会", "type": "tf", "q": "４-２　取締役会設置会社の株主総会では、原則として招集決定の際に取締役会で決定された議題以外の議題について決議することはできない。【H30・R4 出題】", "ans": "○", "exp": "会 309⑤カイ"}, {"id": "tf-138", "no": "4-3", "tag": "株主総会", "type": "tf", "q": "４-３　非公開会社では、株主総会の招集通知の期間を法定期間よりも短縮することはできるが、招集通知を省略して株主総会を開催することはできない。【R3 出題】", "ans": "×", "exp": "会 300、判例 S60.12.20 株主全員の同意があれば、招集手続の省略ができる。"}, {"id": "tf-139", "no": "4-4", "tag": "株主総会", "type": "tf", "q": "４-４　招集通知は、非公開会社では会日の 1 週間前に招集通知を発すればよく、取締役会が設置されない会社では、定款をもって招集通知期間を無制限に短縮することができる。", "ans": "○", "exp": "会 299①カイ"}, {"id": "tf-140", "no": "4-5", "tag": "株主総会", "type": "tf", "q": "４-５　株主全員の同意があっても招集手続を省略することはできない。", "ans": "×", "exp": "最判 S60.12.20 株主全員の同意があれば、招集手続の省略ができる。"}, {"id": "tf-141", "no": "4-6", "tag": "株主総会", "type": "tf", "q": "４-６　A 株式会社（以下 A 社という。）が B 株式会社（以下 B 社という。）の総株主の議決権の 30%の株式を有しており、B 社も A 社の株式を有している場合、B 社は A 社の株主総会において議決権を行使することはできない。【H29 出題】", "ans": "○", "exp": "会 308①括弧書、会施規 67① 総株主の議決権の 25%を基準として相互保有株式の議決権を停止。"}, {"id": "tf-142", "no": "4-7", "tag": "株主総会", "type": "tf", "q": "４-７　A 株式会社（以下 A 社という。）が B 株式会社（以下 B 社という。）の総株主の議決権の過半数の株式を有しており、C 株式会社（以下 C 社という。）の総株主の議決権の 25%の株式を有している。また、B 社と C 社も A 社の株式を保有している。この場合、B 社と C 社は A 社の株主総会で議決権を行使できない。", "ans": "○", "exp": "会 308①括弧書、会施規 67① 総株主の議決権の 25%を基準として相互保有株式の議決権を停止。"}, {"id": "tf-143", "no": "4-8", "tag": "株主総会", "type": "tf", "q": "４-８　単元未満株主は、その有する単元未満株式について、株主総会において議決権を行使することができない。【H30 出題】", "ans": "○", "exp": "会 189①カイ"}, {"id": "tf-144", "no": "4-9", "tag": "株主総会", "type": "tf", "q": "４-９　いかなる場合であっても、議決権を不統一行使することはできない。", "ans": "×", "exp": "会 313① 同一の会社の株式につき複数の株主から株式を信託された場合、議決権を有する株主は受託者であるが、実質上の株主の議案に対する賛否が異なっている場合に実質上の株主の意向に従って議決権を行使するためには、議決権の不統一行使を認める必要がある。"}, {"id": "tf-145", "no": "4-10", "tag": "株主総会", "type": "tf", "q": "４-10　判例によれば、株主総会における議決権行使の代理人を株主に限定する旨の定款の定めは無効である。【H29・R5 出題】", "ans": "×", "exp": "最判 S43.11.1 制限的有効説が判例・多数説である。"}, {"id": "tf-146", "no": "4-11", "tag": "株主総会", "type": "tf", "q": "４-11　判例によれば、株主総会における議決権行使の代理人を株主に限定する旨の定款の定めは有効であるが、特段の事情があれば定款の定めが適用されない場合もある。【R3 出題】", "ans": "○", "exp": "判例 S43.11.1"}, {"id": "tf-147", "no": "4-12", "tag": "株主総会", "type": "tf", "q": "４-12　判例によれば、株主総会における議決権行使の代理人として、地方公共団体の職員又は会社の従業員による代理行使は認められる。", "ans": "○", "exp": "判例 S51.12.24"}, {"id": "tf-148", "no": "4-13", "tag": "株主総会", "type": "tf", "q": "４-13　大会社では、株主には書面及び電磁的方法による議決権行使が保障される。【H30 出題】", "ans": "×", "exp": "会 298②　株主が千人以上である場合は、前項三号の(書面によって議決権行使ができる)ことを定めなければならない。ただし、電磁的記録は前項四号であるため対象外。"}, {"id": "tf-149", "no": "4-14", "tag": "株主総会", "type": "tf", "q": "４-14　議決権を行使できる株主数が 1,000 人以上である株式会社では、株主には原則として書面による議決権行使が保障される。【R1 出題】", "ans": "○", "exp": "会 298②　株主が千人以上である場合は、前項三号の(書面によって議決権行使ができる)ことを定めなければならない。"}, {"id": "tf-150", "no": "4-15", "tag": "株主総会", "type": "tf", "q": "４-15　議決権を行使できる株主数が 1,000 人以上である株式会社では、株主には原則として書面又は電磁的方法による議決権行使が保障される。【R5 出題】", "ans": "×", "exp": "会 298②　株主が千人以上である場合は、前項三号の(書面によって議決権行使ができる)ことを定めなければならない。ただし、電磁的記録は前項四号であるため対象外。"}, {"id": "tf-151", "no": "4-16", "tag": "株主総会", "type": "tf", "q": "４-16　株主総会と取締役会のいずれにおいても、書面又は電磁的記録による決議は認められない。【R3 出題】", "ans": "×", "exp": "会 298①　書面または電磁的方法によって議決権を行使できる旨を定めることができる。"}, {"id": "tf-152", "no": "4-17", "tag": "株主総会", "type": "tf", "q": "４-17　株主総会の普通決議事項については、定款をもって定足数を緩和または排除することができるが、特別決議事項については、定足数を緩和または排除することができない。【H29・R4 出題】", "ans": "×", "exp": "会 309②　特別事項については、緩和は OK だが、排除は NG。"}, {"id": "tf-153", "no": "4-18", "tag": "株主総会", "type": "tf", "q": "４-18　取締役等の役員の選任決議は株主総会の普通決議事項であるから、その定足数を定款をもって緩和または排除することもできる。", "ans": "×", "exp": "会 341 緩和は OK だが、排除は NG。"}, {"id": "tf-154", "no": "4-19", "tag": "株主総会", "type": "tf", "q": "４-19　取締役等の役員の解任は、正当な理由があれば株主総会の普通決議をもってすることができるが、正当な理由がなければ株主総会の特別決議を要する。【H30 出題】", "ans": "×", "exp": "会 339①　いつでも解雇でき正当な理由は不要。また、 累積投票、監査等委員と兼任の場合は特別決議を要する(会 309②七)。"}, {"id": "tf-155", "no": "4-20", "tag": "株主総会", "type": "tf", "q": "４-20　取締役等の役員の損害賠償責任は、株主総会を開催せずとも総株主の同意を得ることをもって免除することができる。", "ans": "○", "exp": "会 424　役員の株式会社に対する責任は、総株主の同意なければ免除することができない。"}, {"id": "tf-156", "no": "4-21", "tag": "株主総会", "type": "tf", "q": "４-21　株式会社の定款を変更するには株主総会の特別決議を要するが、譲渡による株式の取得につき会社の承認を要する旨の規定を新設するための定款変更には株主総会の特殊の決議を要する。【R3 出題】", "ans": "○", "exp": "会 309②十一、会 309③、会 466"}, {"id": "tf-157", "no": "4-22", "tag": "株主総会", "type": "tf", "q": "４-22　公開会社においては役員の職務執行に関して不正の行為または法令・定款に違反する重大な事実があるにもかかわらず株主総会で解任決議が否決されたときは、3 ヶ月前から引き続き総株主の議決権または発行済株式総数の 3%以上を有する株主は、30 日以内に訴えをもってその役員の解任を請求することができる。", "ans": "×", "exp": "会 854①　「3 ヶ月」ではなく、「6 ヶ月」である。"}, {"id": "tf-158", "no": "4-23", "tag": "株主総会", "type": "tf", "q": "４-23　株主総会決議をもって事業の全部譲渡が承認された場合、議決権を有する株主が総会に先立って反対の意思を会社に通知し、総会でも反対した場合、その株主は、その有する株式を公正な価格で買い取るよう会社に請求することができる。【H29 出題】", "ans": "○", "exp": "会 469①一、②一イ"}, {"id": "tf-159", "no": "4-24", "tag": "株主総会", "type": "tf", "q": "４-24　株主総会決議をもって事業の重要な一部の譲渡が承認された場合、議決権を有する株主が総会に先立って反対の意思を会社に通知し、総会でも反対すれば、その株主は、その有する株式を公正な価格で買い取るよう会社に請求することができる。【R4 出題】", "ans": "○", "exp": "会 469①、②イ"}, {"id": "tf-160", "no": "4-25", "tag": "株主総会", "type": "tf", "q": "４-25　議案が否決された場合であっても、決議取消の対象となる。", "ans": "×", "exp": "最判 H28.3.4 議案が否決された場合には決議取消の対象とならない。"}, {"id": "tf-161", "no": "4-26", "tag": "株主総会", "type": "tf", "q": "４-26　株主総会決議の内容が法令または定款に違反する場合、その決議は無効である。【H29・R3 出題】", "ans": "×", "exp": "会 831①二 決議の定款違反は無効原因ではなく、決議取消原因である。"}, {"id": "tf-162", "no": "4-27", "tag": "株主総会", "type": "tf", "q": "４-27　株主総会決議において定款所定の員数を超える取締役を選任した場合、株主は決議の日から 3 カ月以内に決議無効確認の訴えを提起することができる。【R4 出題】", "ans": "×", "exp": "会 831 決議無効確認の訴えではなく、決議取消の訴えである。"}, {"id": "tf-163", "no": "4-28", "tag": "株主総会", "type": "tf", "q": "４-28　判例では、株主総会の招集通知漏れがあった場合における決議取消訴訟の訴えの主張権者は、当該招集通知漏れのあった株主に限られるとされている。", "ans": "×", "exp": "最判 S42.9.28 招集通知漏れのあった株主以外の株主も決議取消の主張が可能。"}, {"id": "tf-164", "no": "4-29", "tag": "株主総会", "type": "tf", "q": "４-29　事業譲渡を承認する株主総会の決議において、事業の譲受人が株主として議決権を行使したために、その譲受人にとって著しく有利な条件の事業譲渡の決議がなされた場合、株主総会決議取消要因となる。【H30 出題】", "ans": "○", "exp": "会 831①三"}, {"id": "tf-165", "no": "4-30", "tag": "株主総会", "type": "tf", "q": "４-30　事業譲渡を承認する株主総会の決議において、事業の譲受人が株主として議決権を行使したために、その譲受人にとって著しく有利な条件の事業譲渡の決議がなされた場合、株主総会決議取消原因となり、裁判所は裁量棄却することはできない。【R3・R5 出題】", "ans": "○", "exp": "会 831①三"}, {"id": "tf-166", "no": "4-31", "tag": "株主総会", "type": "tf", "q": "４-31　株主総会において分配可能額を超える剰余金の配当を決議した場合、その決議は無効であり、無効主張は訴えによる必要はない。【R1 出題】", "ans": "×", "exp": "会 830②　法令違反の場合でも、直ちに無効にはならず、無効確認の訴えを要する。"}, {"id": "tf-167", "no": "4-32", "tag": "株主総会", "type": "tf", "q": "４-32　株主総会において分配可能額を超える剰余金の配当を決議した場合、株主は、決議の日から 3 ヶ月以内に限り、決議無効確認の訴えを提起することができる。【R5 出題】", "ans": "×", "exp": "決議内容の法例違反のため、無効確認の訴え(会 830②)。出訴期間の制限はない(さすがに時効はある)。"}, {"id": "tf-168", "no": "4-33", "tag": "株主総会", "type": "tf", "q": "４-33　株主総会と取締役会のいずれにおいても、決議につき特別利害関係を有する株主又は取締役は議決権を行使することはできない。【R1 出題】", "ans": "×", "exp": "取締役は特別利害関係があると議決権行使不可(会 396)だが、株主総会に同様の一般規定はない(株主総会も利害関係人 NG のものはあるっちゃある)"}, {"id": "tf-169", "no": "4-34", "tag": "株主総会", "type": "tf", "q": "４-34　株主総会決議の招集手続が法令に違反することを理由として株主総会決議取消の訴えが提起された場合、裁判所は、その違反する事実が重大であっても、決議に影響を及ぼさないものであると認めるときは、請求を棄却することができる。【R1 出題】", "ans": "×", "exp": "会 831② 重大であれば NG"}, {"id": "tf-170", "no": "4-35", "tag": "株主総会", "type": "tf", "q": "４-35　決議の取消を主張できる期間は、決議の日から 3 ヶ月以内である。", "ans": "○", "exp": "会 831 ①カイ"}, {"id": "tf-171", "no": "4-36", "tag": "株主総会", "type": "tf", "q": "４-36　株主総会の決議方法が著しく不公正であることを理由として株主総会決議取消の訴えが提起された場合、裁判所は、その違反する事実が重大でなく、かつ決議に影響を及ぼさないものであると認めるときは、請求を棄却することができる。【H29 出題】", "ans": "×", "exp": "会 831② 裁量棄却の要件：① 取消原因が招集手続又は決議方法の法令又は定款違反であること。② 違反事実重大でなく、かつ決議に影響を及ぼさないものと認められること。"}, {"id": "tf-172", "no": "4-37", "tag": "株主総会", "type": "tf", "q": "４-37　会社の組織に関する訴えに係る請求を認容する確定判決の効力は、第三者に対しても効力を有する。", "ans": "○", "exp": "会 838 対世効が認められる。"}, {"id": "tf-173", "no": "4-38", "tag": "株主総会", "type": "tf", "q": "４-38　決議の無効について、無効主張にも期間制限がある。", "ans": "×", "exp": "会 830②無効主張に期間制限はない。"}, {"id": "tf-174", "no": "4-39", "tag": "株主総会", "type": "tf", "q": "４-39　株主総会決議において株主に対する招集通知漏れが著しい場合、判例によれば、決議不存在原因となり、株主は訴えによらず決議不存在を主張することができる。【H30 出題】", "ans": "○", "exp": "最判 S33.10.3 決議取消原因としてしまうと通知もれがあった株主がそれに気づくまでに提訴期間を徒過してしまう。訴えなしに主張できる決議不存在原因とするべきとされている。"}, {"id": "tf-175", "no": "4-40", "tag": "株主総会", "type": "tf", "q": "４-40　判例では、取締役会決議を経ずに代表取締役が株主総会を招集した場合は、特段の事情がない限り決議取消原因となるとされている。", "ans": "○", "exp": "東京高判 S30.7.19、取締役会設置会社で株主総会の招集関連は取締役会決議事項である(会 298④)。この手続きを欠いた場合は、取消事由(831①一)。"}, {"id": "tf-176", "no": "4-41", "tag": "株主総会", "type": "tf", "q": "４-41　判例では、代表権のない取締役が総会を招集した場合は、取消原因となるとされている。", "ans": "×", "exp": "最判 S45.8.20 取消原因ではなく決議不存在となる。"}, {"id": "tf-177", "no": "4-42（1）", "tag": "株主総会", "type": "tf", "q": "４-42　判例によれば、取締役選任を目的とする株主総会が不存在であり、その取締役によって構成される取締役会の招集決定に基づき、その取締役会で選任された代表取締役を選任した場合は、その決議は不存在となる。", "ans": "○", "exp": "最判平 2.4.17 なお、代表権のない取締役が招集した株主総会の決議は不存在となる（最判昭 45.8.20)。"}, {"id": "tf-178", "no": "4-42（2）", "tag": "株主総会", "type": "tf", "q": "４-42　判例によれば、定足数不足の場合は、取消原因となるとされている。", "ans": "○", "exp": "最判 S5.10.10、会 831①一"}, {"id": "tf-179", "no": "4-43", "tag": "株主総会", "type": "tf", "q": "４-43　判例によれば、株主総会の定足数が不足した場合は株主総会決議の取消原因となり、株主総会の招集通知漏れが著しい場合も同様とする。", "ans": "×", "exp": "著しい招集通知漏れは決議不存在となる。大判昭 5.10.10（定足数不足）、最判昭 33.10.3（著しい招集通知漏れ）"}, {"id": "tf-180", "no": "4-44", "tag": "株主総会", "type": "tf", "q": "４-44　株式会社は、定款の定めに基づき、株主総会の一定の決議事項について議決権を認めない種類株式を発行することはできるが、株主総会における議決権を一切認めない種類株式を発行することはできない。【R1・R5 出題】", "ans": "×", "exp": "会 108①三 条文からは読めないが、実務では完全無議決権株式が普通に存在するらしい。"}, {"id": "tf-181", "no": "4-45", "tag": "株主総会", "type": "tf", "q": "４-45　取締役の選任は株主総会の普通決議事項であるが、その解任は特別決議事項である。【R1 出題】", "ans": "×", "exp": "現法では原則、取締役の解任は普通決議事項。累積投票により選任された取締役の解任のみ特別決議事項。"}, {"id": "tf-182", "no": "4-46", "tag": "株主総会", "type": "tf", "q": "４-46　取締役の解任は、正当な理由があれば株主総会の普通決議をもってすることができるが、正当な理由がなければ株主総会の特別決議を要する。【R4 出題】", "ans": "×", "exp": "通常の役員の選任解任は会 341(普通決議事項)、会 342③(累積投票による取締役)は会 309②七(特別決議事項)。つまり、通常の選任は議決権の過半数で可否を決するが、累積投票では得票数で選任するため、解任条件を厳しくしようという趣旨。"}, {"id": "tf-183", "no": "5-1", "tag": "取締役・責任", "type": "tf", "q": "５-１　法人は、持分会社の業務執行社員、株式会社の発起人にはなることができるが、取締役になることはできない。", "ans": "○", "exp": "会 331①一 取締役は自然人に限られる。"}, {"id": "tf-184", "no": "5-2", "tag": "取締役・責任", "type": "tf", "q": "５-２　取締役設置会社における取締役の員数は 3 人以上であり、取締役会を設置しない会社は 1 人でもよい。", "ans": "○", "exp": "会 331⑤、326①"}, {"id": "tf-185", "no": "5-3", "tag": "取締役・責任", "type": "tf", "q": "５-３　取締役の任期は、公開会社では原則として 2 年であり、定款及び株主総会決議をもって短縮可能であるが、伸長することはできない。また、非公開会社では定款により 10 年まで伸長可能である。", "ans": "○", "exp": "会 332①、332②"}, {"id": "tf-186", "no": "5-4", "tag": "取締役・責任", "type": "tf", "q": "５-４　指名委員会等設置会社の取締役・監査等委員会設置会社の監査等委員ではない取締役の任期は 3 年である。", "ans": "×", "exp": "会 332③⑥ 任期は 1 年"}, {"id": "tf-187", "no": "5-5", "tag": "取締役・責任", "type": "tf", "q": "５-５　代表取締役の氏名は登記事項であるが、取締役の氏名は登記事項ではない。【R3 出題】", "ans": "×", "exp": "会 911③十三、十四 取締役の氏名は登記事項に該当する。"}, {"id": "tf-188", "no": "5-6", "tag": "取締役・責任", "type": "tf", "q": "５-６　取締役の退任により欠員が生じ、会社法又は定款所定の員数を欠くに至った場合、退任事由のいかんを問わず、その退任取締役は新たに選任された取締役が就任するまで取締役として留任する。【R1 出題】", "ans": "×", "exp": "会 351① 退任事由が、任期の満了又は辞任により退任した場合のみ。"}, {"id": "tf-189", "no": "5-7", "tag": "取締役・責任", "type": "tf", "q": "５-７　取締役（累積投票によって選任された取締役・監査等委員会設置会社の監査等委員たる取締役は除く。）は正当な理由がなくても株主総会の普通決議をもって解任することができるが、正当な理由なく解任された場合、その取締役は会社に対して損害賠償を請求することがでる。【R3 出題】", "ans": "○", "exp": "会 339①②　累積投票による取締役の場合は、会 342①→会 309②七　こちらも株主総会での決議。必要議決数が規定されている。"}, {"id": "tf-190", "no": "5-8", "tag": "取締役・責任", "type": "tf", "q": "５-８　累積投票によって選任された取締役の解任・監査等委員会設置会社の監査等委員たる取締役の解任は、株主総会の普通決議が必要である。", "ans": "×", "exp": "会 309②七 特別決議が必要である。"}, {"id": "tf-191", "no": "5-9", "tag": "取締役・責任", "type": "tf", "q": "５-９　取締役会とは、取締役全員によって構成され、会社の業務執行を決定し、取締役の職務執行を監督する合議制の機関である。", "ans": "○", "exp": "会 362①②"}, {"id": "tf-192", "no": "5-10", "tag": "取締役・責任", "type": "tf", "q": "５-10　判例によれば、重要な財産の処分に該当するかどうかは、当該財産の価額、その会社の総財産に占める割合、当該財産の保有目的、処分行為の態様及び会社における従来の取扱等の事情を総合的に考慮して判断すべきであるとする。", "ans": "○", "exp": "最判平 6.1.20"}, {"id": "tf-193", "no": "5-11", "tag": "取締役・責任", "type": "tf", "q": "５-11　取締役会設置会社において、重要な業務執行のうち、重要な財産の処分・譲受、多額の借財については、取締役の数が 6 人以上であって、取締役の 1 人以上が社外取締役である場合、予め選定した 3 人以上の特別取締役の決議をもって決定できる旨を定めることができる。【H30 出題】", "ans": "○", "exp": "会 373①、会 362④　問題文のとおり"}, {"id": "tf-194", "no": "5-12", "tag": "取締役・責任", "type": "tf", "q": "５-12　取締役会設置会社において、重要な財産の処分・譲受、多額の借財、支配人その他の重要な使用人の選任・解任、社債の募集などの重要な業務執行については、取締役の数が 6 人以上であって、取締役の 1 人以上が社外取締役である場合、予め選定した 3 人以上の特別取締役の決議をもって決定できる旨を定めることができる。【R4 出題】", "ans": "×", "exp": "会 362④一及び二は特別取締役に委任できる(会 373①)が、同条④三～七は委任できない。"}, {"id": "tf-195", "no": "5-13", "tag": "取締役・責任", "type": "tf", "q": "５-13　取締役会設置会社では、内部統制システムの整備の基本方針は取締役会の専決事項であり、大会社については内部統制システムの整備に関する事項の決定が義務づけられている。【H29・R3 出題】", "ans": "○", "exp": "会 362⑤　カイ"}, {"id": "tf-196", "no": "5-14", "tag": "取締役・責任", "type": "tf", "q": "５-14　会社債権者は、いつでも裁判所の許可を得れば議事録の閲覧、謄写を請求することができる。", "ans": "×", "exp": "会 371④ 役員又は執行役の責任追及のため必要があるとき。"}, {"id": "tf-197", "no": "5-15", "tag": "取締役・責任", "type": "tf", "q": "５-15　株主総会と取締役会のいずれにおいても、株主又は取締役は代理人によって議決権を行使することができる。【H30・R4 出題】", "ans": "×", "exp": "会 310①の反対解釈。取締役は経営手腕という個性を期待されているため、代理不可。"}, {"id": "tf-198", "no": "5-16", "tag": "取締役・責任", "type": "tf", "q": "５-16　取締役会の議決権行使については、書面決議（持ち回り決議）が容認されている。", "ans": "○", "exp": "会 370 カイ"}, {"id": "tf-199", "no": "5-17", "tag": "取締役・責任", "type": "tf", "q": "５-17　取締役会設置会社である A 株式会社（以下 A 社という。）は、事業として甲県内においてトラックによる陸上貨物運送を行っている。A 社の取締役である B が事業として甲県内においてトラックによる陸上貨物運送を行っている C 株式会社の代表取締役となって当該運送に係る取引をしようとする場合には、B は、A 社の取締役会において、当該取引につき重要な事実を開示し、その承認を受けなければならない。【H29 出題】", "ans": "○", "exp": "会 356①一"}, {"id": "tf-200", "no": "5-18", "tag": "取締役・責任", "type": "tf", "q": "５-18　判例によれば、取締役会において代表取締役を解職する旨の決議をする場合に、解職される代表取締役は特別の利害関係を有する取締役に該当しないとしている。", "ans": "×", "exp": "最判昭 44.3.28 特別利害関係人に該当する。（※なお、その議決の効力は有効であるとする（最判昭 54.2.23、平 28.1.22））"}, {"id": "tf-201", "no": "5-19", "tag": "取締役・責任", "type": "tf", "q": "５-19　取締役会が設置されない会社の取締役が自己又は第三者のために会社の事業の部類に属する取引を行うには、株主総会において、その取引に関する重要な事実を開示した上でその承認を受けなければならず、その取引をした取締役は、取引後遅滞なく、その取引に関する重要な事実を株主総会に報告しなければならない。【R1 出題】", "ans": "×", "exp": "承認が必要(会 356①)だが、事後報告は「取締役会設置会社」のみ必要(会 365②)。"}, {"id": "tf-202", "no": "5-20", "tag": "取締役・責任", "type": "tf", "q": "５-20　取締役会設置会社の取締役が会社との間で自己又は第三者のために会社と利益の相反する取引をするには、取締役会の承認を要するが、会社が取締役の債務を保証する場合は、会社と第三者との間の取引であるため、取締役会の承認を要しない。【R1 出題】", "ans": "×", "exp": "会 356①三 株式会社が取締役の債務を保証する場合は、取締役会の承認を要する。"}, {"id": "tf-203", "no": "5-21", "tag": "取締役・責任", "type": "tf", "q": "５-21　判例によれば、特別利害関係人が議決権を行使した場合の決議の効力は、無効であるとされている。", "ans": "×", "exp": "最判 S54.2.23、最判 H28.1.22 決議は有効とされている。"}, {"id": "tf-204", "no": "5-22", "tag": "取締役・責任", "type": "tf", "q": "５-22　判例によれば、一部の取締役に対する招集通知漏れがあった場合、原則として取締役会決議は無効であるが、当該取締役が名目的取締役であった場合のように、その取締役が出席してもなお決議に影響がないと認められる特段の事情がある場合には、招集通知漏れは決議の効力に影響を及ぼさない。【R3 出題】", "ans": "○", "exp": "判例 S44.12.2"}, {"id": "tf-205", "no": "5-23", "tag": "取締役・責任", "type": "tf", "q": "５-23　判例によれば、取締役会設置会社である非公開会社について、取締役会決議によるほか株主総会決議によっても代表取締役を定めることができる旨の定款の定めは有効である。【H30・R4 出題】", "ans": "○", "exp": "最判 H29.2.21。株主総会で代表取締役を定めても、定款で明文化しているなら OK。取締役会の選任・クビの人事権限はなくならないので問題ないとした(362②三)。"}, {"id": "tf-206", "no": "5-24", "tag": "取締役・責任", "type": "tf", "q": "５-24　判例によれば、取締役会設置会社において取締役会決議を経ずに代表取締役が株主総会を召集した場合、その株主総会の決議は不存在となる。【R5 出題】", "ans": "×", "exp": "東京高判 S30.7.19、取締役会設置会社で株主総会の招集関連は取締役会決議事項である(会 298④)。この手続きを欠いた場合は、取消事由(831①一)。ちなみに、無権限者招集の場合は原則不存在になる(このときの招集権者でない者とは、既に解任された取締役とかの部外者レベルまで求められる)が(最判 H2.4.17)、全員出席したら瑕疵は治癒される(判例 S30.7.19)。"}, {"id": "tf-207", "no": "5-25", "tag": "取締役・責任", "type": "tf", "q": "５-25　監査役設置会社が訴訟によって取締役の責任を追及する場合には、監査役が会社を代表する。【R1 出題】", "ans": "○", "exp": "会 386①"}, {"id": "tf-208", "no": "5-26", "tag": "取締役・責任", "type": "tf", "q": "５-26　株式会社は、定款の定めがあれば、業務執行に携わらない取締役との間で、任務解怠に基づく責任については、取締役の職務執行につき悪意又は重過失がなければ、一定額を限度として損害賠償責任を負う旨を約することができる。【R1 出題】", "ans": "○", "exp": "会社法 427 条 1 項、425 条 1 項。責任限定契約は善意かつ重大な過失がない場合に限る。"}, {"id": "tf-209", "no": "5-27", "tag": "取締役・責任", "type": "tf", "q": "５-27　A 株式会社において、代表取締役副社長 B は代表取締役を退任し、その旨の登記も完了したが、なお取締役副社長の地位にあった。B が副社長と称して A 会社を代表して C との間で取引をした場合、B が代表取締役でないことにつき C が善意かつ無重過失であれば、A 会社はその取引について責任を負う。【R1 出題】", "ans": "○", "exp": "会 354"}, {"id": "tf-210", "no": "5-28", "tag": "取締役・責任", "type": "tf", "q": "５-28　判例によれば、取締役会設置会社である非公開会社について取締役会決議によるほか株主総会決議によっても代表取締役を定めることができる旨の定款の定めの効力は、代表取締役選定・解職に関する取締役会の制限が否定されるものではなく、取締役会の監督権限の実効性を失わせるとはいえないとして、有効とされている。", "ans": "○", "exp": "最判 H29.2.21　株式会社(取締役会設置会社を除く)は、定款の定めに基づき株主総会の決議によって、代表取締役を定められる(会 349③)ところ、取締役会設置会社であっても非公開会社であれば、当該定款は有効であるとの判決がでた。なんでもありである。"}, {"id": "tf-211", "no": "5-29", "tag": "取締役・責任", "type": "tf", "q": "５-29　A 株式会社では、代表取締役でない取締役 B が勝手に副社長と名乗っていることを知りながらこれを漫然と放置していた。B が副社長と称して A 株式会社を代表して C との間で取引をした場合、B が代表取締役でないことにつき C が善意かつ無重過失であれば、A 株式会社はその取引について責任を負う。【H29・R3 出題】", "ans": "○", "exp": "判例 S45.12.15 及び会 354 と民 109"}, {"id": "tf-212", "no": "5-30", "tag": "取締役・責任", "type": "tf", "q": "５-30　判例によれば、代表取締役の専断的行為については、民法 93 条但書を類推適用し、その取引は原則として有効であり、取引の相手方が決議を経ていないことについて悪意または有過失の場合に限って無効であるとされている。", "ans": "○", "exp": "最判 S40.9.22 民法 93 条類推適用説"}, {"id": "tf-213", "no": "5-31", "tag": "取締役・責任", "type": "tf", "q": "５-31　判例によれば、代表取締役が会社法 362 条 4 項に違反して独断で行った取引行為の効力につき、原則として会社のみが取引の無効を主張しうるとする。", "ans": "○", "exp": "最決平 21.4.17 当該会社の取締役会が無効を主張する旨の決議をしているなどの特段の事情がない限り、会社以外の者が無効を主張することは許されない。※原則として民法 93 条（心裡留保）の類推適用により当該取引行為を有効（相手方が決議を経ていないことを知り、または知ることができたときでない限り）とするが、無効の主張も可能（最判昭 40.9.22)。"}, {"id": "tf-214", "no": "5-32", "tag": "取締役・責任", "type": "tf", "q": "５-32　A 株式会社（以下 A 社という。）では、代表取締役でない使用人 B に対して副社長という名称の使用を許諾していた。B が副社長と称して A 社を代表して C との間で取引をした場合、判例によれば、B が代表取締役でないことにつき C が善意かつ無重過失であれば、A 社はその取引について責任を負う。【H30 出題】", "ans": "○", "exp": "最判 S35.10.14"}, {"id": "tf-215", "no": "5-33", "tag": "取締役・責任", "type": "tf", "q": "５-33　判例によれば、取締役の忠実義務は、取締役が会社の受任者として負うべき善管注意義務を敷衍し、かつ一層明確にしたものにすぎず、善管注意義務とは別個の高度の義務を規定したものではない。【H30 出題】", "ans": "○", "exp": "最判 S45.6.24"}, {"id": "tf-216", "no": "5-34", "tag": "取締役・責任", "type": "tf", "q": "５-34　判例によれば、取締役は、取締役会に上程された事項に限り、代表取締役の職務執行につき監視する義務を負う。【R1 出題】", "ans": "×", "exp": "最判 S55.3.18 監視義務の対象は取締役会の権限に属する一切の行為に及ぶ。会 355 の忠実義務が近い。"}, {"id": "tf-217", "no": "5-35", "tag": "取締役・責任", "type": "tf", "q": "５-35　判例によれば、取締役の監視義務は取締役会の上程事項に限られるため、取締役会に上程されなかった事項について取締役が他の取締役の職務執行に対する監視を怠り、それによって会社に損害が生じたとしても、監視を怠った取締役は会社に対して損害賠償責任を負わない。【R3.H29 出題】", "ans": "×", "exp": "会 357、362②二、最判 S48.5.22 取締役の監視義務は上程事項に限られない。"}, {"id": "tf-218", "no": "5-36", "tag": "取締役・責任", "type": "tf", "q": "５-36　取締役会設置会社が取締役 A の債務を保証する場合、その保証に関する重要な事実を開示した上で取締役会の承認を受けなければならず、その承認決議において A は議決権を行使することができない。", "ans": "○", "exp": "会 356①三"}, {"id": "tf-219", "no": "5-37", "tag": "取締役・責任", "type": "tf", "q": "５-37　判例によれば、取締役会が設置されない会社の取締役が株主総会の承認を受けずに自己又は第三者のために会社の事業の部類に属する取引を行った場合、株主総会の承認を受けていないことにつき取引の相手方が悪意であれば、その取引は無効である。【R4 出題】", "ans": "×", "exp": "承認を得ない競業取引：有効"}, {"id": "tf-220", "no": "5-38", "tag": "取締役・責任", "type": "tf", "q": "５-38　判例によれば、取締役会の承認を欠く利益相反取引は、当事者間では無効であるが、善意の第三者に対しては無効を主張することはできない。", "ans": "○", "exp": "最判昭 43.12.25、46.10.13 相対的無効説。なお、会社の利益保護を図る趣旨のため、無効の主張は会社からしか主張できない（最判昭 48.12.11）"}, {"id": "tf-221", "no": "5-39", "tag": "取締役・責任", "type": "tf", "q": "５-39　取締役が必要な承認を受けずに自己又は第三者のために会社の事業の部類に属する取引を行った場合、その取締役の会社に対する損害賠償責任について、その取締役又は第三者が得た利益の額をもって会社の損害額とみなされる【H30・R3・R5 出題】", "ans": "×", "exp": "会 423②　「みなす」ではなく「推定」である。"}, {"id": "tf-222", "no": "5-40", "tag": "取締役・責任", "type": "tf", "q": "５-40　株主総会の承認に基づいて競業取引を行なった場合であっても、株主総会への事後報告は必要である。", "ans": "×", "exp": "会 365②　「株主総会の承認を得た」より、取締役であると推測する(会 356①)。よって、会 365①及び②の反対解釈より、事後報告は不要である。悪問。"}, {"id": "tf-223", "no": "5-41", "tag": "取締役・責任", "type": "tf", "q": "５-41　判例では利益相反取引にあたるか否かを個別具体的・実質的に判断する傾向。最高裁判所の判例によれば、株式会社（取締役会設置会社）に対し取締役が無利息・無担保で金銭を貸し付ける行為は、取締役会による承認を必要としない。【H29・R3 出題】", "ans": "○", "exp": "最判 S38.12.6　利益相反行為は取締役会(会 365①による読み替え)の承認を要する(会 356①)。"}, {"id": "tf-224", "no": "5-42", "tag": "取締役・責任", "type": "tf", "q": "５-42　判例では、取締役が会社に対して無利息・無担保で金銭を貸し付ける行為は利益相反行為にあたらないとされている。", "ans": "○", "exp": "最判 S38.12.6"}, {"id": "tf-225", "no": "5-43", "tag": "取締役・責任", "type": "tf", "q": "５-43　判例では、会社・取締役間の手形行為は、手形行為により原因関係とは別個の法律関係が形成され、手形行為者は通常の債務よりも厳格な債務を負担する以上、そこには利益相反関係を生ずるから、承認が必要であるとされている。", "ans": "○", "exp": "最判 S46.10.13　会 356①カイ"}, {"id": "tf-226", "no": "5-44", "tag": "取締役・責任", "type": "tf", "q": "５-44　A は、取締役会設置会社である B 株式会社の代表取締役であると同時に、取締役会が設置されない C 株式会社の代表取締役でもある。A が B 株式会社と C 株式会社を代表して取引をする場合、B 株式会社では取締役会の承認を要する。【H30 出題】", "ans": "○", "exp": "会社法 356 条 1 項 2 号、365 条 1 項・2 項。双方代理型の利益相反取引として B 社取締役会の事前承認を要し、取引後は重要事実の報告も要する。"}, {"id": "tf-227", "no": "5-45", "tag": "取締役・責任", "type": "tf", "q": "５-４５　取締役が自己のために会社と利益相反取引を行ったため、会社に損害が生じた場合、その取締役は、任務解怠につき帰責性がなくても、会社に対して損害賠償責任を負う。【H30・R4 出題】", "ans": "○", "exp": "会 428① 責め帰すことができない事由によるものであることをもって免れることができない。"}, {"id": "tf-228", "no": "5-46", "tag": "取締役・責任", "type": "tf", "q": "５-46　取締役が自己または第三者のために会社と取引を行ったことによって会社に損害が生じた場合、その取締役は会社に対して無過失の責任を負う。【H29 出題】", "ans": "×", "exp": "会 428①、会 429①"}, {"id": "tf-229", "no": "5-47", "tag": "取締役・責任", "type": "tf", "q": "５-47　判例によれば、一人株主である取締役の利益相反取引につき、実質的には会社の利害と一人株主の利害は一致するため、利益相反取引関係を生じないとする。", "ans": "○", "exp": "取締役会の承認は不要(最判昭 45.8.20 )。なお、株主全員の同意がある場合にも、利益相反取引についての取締役会の承認は不要である（最判昭 49.9.26)。"}, {"id": "tf-230", "no": "5-48", "tag": "取締役・責任", "type": "tf", "q": "５-48　判例によれば、定款または株主総会決議によって報酬の金額が決定されなければ、具体的な報酬請求権は発生しないとされている。", "ans": "○", "exp": "最判 H15.2.21"}, {"id": "tf-231", "no": "5-49", "tag": "取締役・責任", "type": "tf", "q": "５-49　取締役に対してストックオプションとして新株予約権を付与するには、取締役の報酬規制に服する。【H30 出題】", "ans": "○", "exp": "会 361①四　新株予約権を報酬として付与する場合(ストックオプション)は、定款または株主総会の決議による。"}, {"id": "tf-232", "no": "5-50", "tag": "取締役・責任", "type": "tf", "q": "５-50　取締役に対してストックオプションとして新株予約権を付与するには、取締役の報酬として株主総会決議を要する。【R4 出題】", "ans": "○", "exp": "会 361①四　新株予約権を報酬として付与する場合(ストックオプション)は、定款または株主総会の決議による。"}, {"id": "tf-233", "no": "5-51", "tag": "取締役・責任", "type": "tf", "q": "５-51　判例によれば、株主総会決議により、取締役全員の報酬総額の最高限度額を定め、各取締役に対する配分の決定を取締役会に委任することができ、その委任を受けた取締役会は、その決議によって各取締役の報酬額の決定を代表取締役に再委任することができる。【R3 出題】", "ans": "○", "exp": "判例 S60.3.26(株主総会で取締役全員につき一括してその総額または最高限度額を定め、具体的な配分は取締役会に委ねてもよい）及び判例 S31.10.5(各取締役の具体的報酬額の決定を社長等に再一任することもできる）"}, {"id": "tf-234", "no": "5-52", "tag": "取締役・責任", "type": "tf", "q": "５-52　判例によれば、取締役会の報酬については、株主総会の決議により、取締役全員の総額を定めて、各取締役に対する具体的な配分の決定を取締役会に委任することができ、その委任を受けた各取締役会は、その決議により、各取締役の報酬額の決定を代表取締役に再委任することができる。【R5 出題】", "ans": "○", "exp": "原則、株主総会または定款で定める(会 361①)。ただし、総額を定めて、取締役会に委任ができる(最判昭和 60.3.26)。また、取締役会はさらに代表取締役へ再委任できる(最判昭和 58.2.22)。これはお手盛りに該当しない。"}, {"id": "tf-235", "no": "5-53", "tag": "取締役・責任", "type": "tf", "q": "５-５３　判例によれば、取締役の報酬について、定款または株主総会決議によって報酬の金額が決定されなければ、具体的な報酬請求権は発生しないとする。", "ans": "○", "exp": "最判平 15.2.21　会 361①カイ"}, {"id": "tf-236", "no": "5-54", "tag": "取締役・責任", "type": "tf", "q": "５-５４　判例によれば、株主総会決議を経ずに取締役の報酬が支払われても、事後的に株主総会決議を経れば、瑕疵は治癒され、その支払いは有効である。【R1 出題】", "ans": "○", "exp": "最判 H17.2.15"}, {"id": "tf-237", "no": "5-55", "tag": "取締役・責任", "type": "tf", "q": "５-５５　使用人として受ける給与の体系が明確に確立しており、使用人として受ける給与がそれによって支給されている場合、使用人兼務取締役につき、別に使用人としての給与を受けることを予定しつつ、取締役として受ける報酬額のみを株主総会で決議することとしても、脱法行為にはならないとされている。", "ans": "○", "exp": "最判 S60.3.26"}, {"id": "tf-238", "no": "5-56", "tag": "取締役・責任", "type": "tf", "q": "５-５６　判例によれば、取締役の報酬の範囲につき、退職慰労金も報酬の後払いとしての性質を有するため、取締役の報酬規制に服する。", "ans": "○", "exp": "最判昭 39.12.11(会 361①)カイ"}, {"id": "tf-239", "no": "5-57", "tag": "取締役・責任", "type": "tf", "q": "５-５７　判例によれば、取締役の退職慰労金につき、その決定を無条件で取締役会に一任することは許されないが、明示的または黙示的にその支給に関する基準を示し、その基準に従って支給金額を定めるべきこととして、取締役会にその決定を委ねることは許される。【H29 出題】", "ans": "○", "exp": "最判 S48.11.26"}, {"id": "tf-240", "no": "5-58", "tag": "取締役・責任", "type": "tf", "q": "５-58　判例によれば、取締役会の退職報労金につき、取締役会がさらに取締役会長または社長に一任することはできない。", "ans": "×", "exp": "最判 S58.2.22 一任することができる。報酬制限の対象外(会 361)。"}, {"id": "tf-241", "no": "5-59", "tag": "取締役・責任", "type": "tf", "q": "５-59　判例によれば、純粋持株会社（親会社）は、子会社の支配・管理自体をその業務とするため、子会社に対する不適切な指揮・監督の懈怠により子会社が破綻するなどして親会社も損害を被れば、親会社の取締役は親会社に対する責任を免れないとされている。", "ans": "○", "exp": "最判 H5.9.9"}, {"id": "tf-242", "no": "5-60", "tag": "取締役・責任", "type": "tf", "q": "５-60　公開会社において 6 ヶ月前から引き続き株式を有する株主は、会社に対して取締役の責任を追及する訴えの提起を請求することができるが、その請求の日から 60 日以内に会社が不提訴を決定し、請求した株主に対してその理由を書面に通知した場合、その株主は自ら会社のために訴えを提起することはできない。【H29・R3 出題】", "ans": "×", "exp": "会 847①③　書面の有無にかかわらず、株式会社が訴えを提起しないときは、株主は株式会社に代わって訴えを提起することができる。"}, {"id": "tf-243", "no": "5-61", "tag": "取締役・責任", "type": "tf", "q": "５-61　完全親会社をもたない完全親会社（最終完全親会社）の総株主の議決権または発行済株式総数の 1%以上を有する株主は、重要な完全子会社（株式の帳簿価格が親会社の総資産額の 20%を超える子会社）の取締役等の責任（特定責任）を追求する訴えの提起を請求することができる。", "ans": "○", "exp": "総株主の議決権の百分の一以上を有する株主は、特定責任に係る責任追及等の訴えを提起できる(会 847 の三①)。特定責任とは、完全子会社株の価額が完全親会社株の五分の一を超える場合における当該発起人の責任である(同条④)。"}, {"id": "tf-244", "no": "5-62", "tag": "取締役・責任", "type": "tf", "q": "５-62　株主が取締役の会社に対する損害賠償責任を追及する株主代表訴訟において、ほかの株主又は会社は原則としてその訴訟に参加することができるが、会社が被告取締役に補助参加することはできない。【H30 出題】", "ans": "×", "exp": "会 849③ 最決 H13.1.30 補助参加肯定"}, {"id": "tf-245", "no": "5-63", "tag": "取締役・責任", "type": "tf", "q": "５-63　取締役の責任を追及する株主代表訴訟において、会社が被告取締役に補助参加するには、監査役設置会社にあっては各監査役の同意を要する。【R4 出題】", "ans": "○", "exp": "会 849③一　「株式会社(略)が、当該株式会社(略)の取締役(略)を補助するため」訴訟に参加するには、次の各号の同意が必要で、以下条文のとおり。"}, {"id": "tf-246", "no": "5-64", "tag": "取締役・責任", "type": "tf", "q": "５-64　株主が取締役の会社に対する損害賠償責任を追及する代表訴訟を提起する場合、その請求額に応じて納付すべき訴訟手数料は異なる。【R4 出題】", "ans": "×", "exp": "民事訴訟費用等に関する法律 4 条 2 項により、訴訟物の価額は 160 万円とみなされ、申立手数料は 13,000 円となる。"}, {"id": "tf-247", "no": "5-65", "tag": "取締役・責任", "type": "tf", "q": "５-65　判例では、株主代表訴訟によって追及できる取締役の責任は、取締役の地位に基づく会社法上の責任に限られる。【R1 出題】", "ans": "×", "exp": "最判 H21.3.10 など"}, {"id": "tf-248", "no": "5-66", "tag": "取締役・責任", "type": "tf", "q": "５-66　代表取締役の任務解怠に基づく会社に対する損害賠償責任を株主総会の特別決議に基づき軽減する場合、又は定款の定めに基づき取締役会決議をもって軽減する場合、最低責任限度額は報酬の 4 年分であり、これを下回る減免はできない。【H30 出題】", "ans": "×", "exp": "会 425①代表取締役：報酬の 6 年分、業務執行取締役：4 年分、業務執行に携わらない取締役：2 年分"}, {"id": "tf-249", "no": "5-67", "tag": "取締役・責任", "type": "tf", "q": "５-67　取締役会設置会社において、代表取締役の任務解怠に基づく会社に対する損害賠償責任を株主総会の特別決議に基づき軽減する場合、又は定款の定めに基づき取締役会決議をもって軽減する場合、最低責任限度額は報酬の 4 年分であり、これを下回る減免はできない。【R5 出題】", "ans": "×", "exp": "会 425①一イ　株主総会において免除できる、代表取締役の責任下限は、報酬等の「六」年分である。"}, {"id": "tf-250", "no": "5-68", "tag": "取締役・責任", "type": "tf", "q": "５-68　取締役が重過失による任務懈怠に基づき会社に対して損害賠償責任を負う場合、一定の要件の下で、株主総会の特別決議をもって一定の限度額までその責任を軽減することができる。【R4 出題】", "ans": "×", "exp": "会 425① 善意でかつ重大な過失がないときは、軽減することができる。"}, {"id": "tf-251", "no": "5-69", "tag": "取締役・責任", "type": "tf", "q": "５-69　取締役の任務懈怠に基づく会社に対する損害賠償責任を免除するには、総株主の同意を要するが、取締役の任務懈怠に基づく会社に対する損害賠償責任について会社が裁判上または裁判外の和解をするには、総株主の同意を要しない。【H29・R3 出題】", "ans": "○", "exp": "役員の任務懈怠あった場合(会 423①)、賠償責任の免除に総株主の同意が必要(424)だが。責任追及訴訟を和解する場合はこれを要しない(850④)。"}, {"id": "tf-252", "no": "5-70", "tag": "取締役・責任", "type": "tf", "q": "５-70　判例によれば、会社法第 429 条第 1 項に規定する取締役の第三者に対する損害賠償責任は、第三者保護のための特別の法定責任であり、取締役の悪意又は重過失による任務懈怠と第三者の損害との間に相当因果関係がある限り、直接損害と間接損害とを問わず賠償の対象となり、直接損害については不法行為責任との競合も認められる。【R3 出題】", "ans": "○", "exp": "最判 S44.11.26 は、429 条を一般不法行為責任とは異なる特別の法的責任と位置付け、間接損害も対象とした。また、S44.11.26 では、直接損害分は民 709 と双方が問題になるとした。"}, {"id": "tf-253", "no": "5-71", "tag": "取締役・責任", "type": "tf", "q": "5-71　取締役が悪意または重大な過失となる放漫経営をし、当該放漫経営により倒産した会社に対する債権を回収することができなくなる損害を被った会社債権者は、当該取締役の責任を追及することができる。【H29 出題】", "ans": "○", "exp": "東京高判 H17.1.18。放漫経営による損害は間接損害であり、当該役員は、429①の特別の法定責任による損害賠償責任の対象となる。"}, {"id": "tf-254", "no": "5-72", "tag": "取締役・責任", "type": "tf", "q": "５-72　判例によれば、名目的な取締役であっても、代表取締役の業務執行全般につき監視義務を負い、これを悪意又は重過失により怠った場合、その任務懈怠と第三者の損害との間に相当因果関係がある限り、第三者に対する損害賠償責任を免れない。【H30・R4 出題】", "ans": "○", "exp": "最判 S55.3.18"}, {"id": "tf-255", "no": "5-73", "tag": "取締役・責任", "type": "tf", "q": "５-73　取締役が虚偽の登記をしたことにより第三者が損害を被った場合、その取締役は、悪意又は重過失があった場合に限り、第三者に対する損害賠償責任を負う。【R1 出題】", "ans": "×", "exp": "会 429②一ハ　軽過失も含む(注意を怠らなかったことを証明した時＝過失があった時点で OUT)"}, {"id": "tf-256", "no": "5-74", "tag": "取締役・責任", "type": "tf", "q": "５-74　判例によれば、第三者に対する責任を負うべき取締役の範囲について、表見取締役は、取締役として適法な選任決議を経ていないが、就任登記に明示または黙示に承諾していた場合には、故意または過失により不実登記の出現に加功していたものとして、責任を負うとされる。", "ans": "○", "exp": "最判昭 47.6.15 なお、取締役退任後登記の残存については、明示に承諾を与えていた場合に、不実登記の残存に加功していたものとして責任を負う（最判昭 62.4.16)。"}, {"id": "tf-257", "no": "6-1", "tag": "計算・組織再編", "type": "tf", "q": "６－１　6 ヶ月前から引き続き総株主の議決権の議決権の 5%を有する株主 A は、株主提案権を行使して、取締役 B がその職務執行に関して不正の行為を行ったとしてその解任議案を株主総会に上程したが、否決された。この場合、A は、30 日以内に訴えをもって B の解任を請求することができる。【R5 出題】", "ans": "○", "exp": "内部統制システムの整備は取締役に委任できない(会 362④六)、大会社においては、取締役会が専決する(同条⑤)。"}, {"id": "tf-258", "no": "6-2", "tag": "計算・組織再編", "type": "tf", "q": "６－２　内部統制システムの整備に関する事項は、大会社では取締役会の専決事項であるが、大会社でなければ、取締役会はその決定を取締役に委任することができる。【R5 出題】", "ans": "×", "exp": "内部統制システムの整備は取締役に委任できない(会 362④六)、大会社においては、取締役会が専決する(同条⑤)。"}, {"id": "tf-259", "no": "6-3", "tag": "計算・組織再編", "type": "tf", "q": "６－３　株主総会は、株主の全員の同意があっても、招集手続を省略して開催することはできないが、取締役会は、取締役・監査役の全員の同意があれば、招集手続を省略して開催することができる。【R5 出題】", "ans": "×", "exp": "株主総会は株主全員の同意で省略可(会 300)。取締役会も同じく(368)。"}, {"id": "tf-260", "no": "6-4", "tag": "計算・組織再編", "type": "tf", "q": "６－４　判例によれば、代表取締役の解職を目的とする取締役会決議において、解職の対象となっている代表取締役は議決権を行使することはできない。【R5 出題】", "ans": "○", "exp": "判例は最高裁昭和 44 年３月 28 日判決だが、明文化規定が既にある(会 369②)。"}, {"id": "tf-261", "no": "6-5", "tag": "計算・組織再編", "type": "tf", "q": "６－５　A 株式会社では、代表取締役でない B に対して副社長という名称の使用を許諾していたが、B は使用人にすぎなかった。B が副社長と称して A 会社を代表して C との間で取引をした場合、判例によれば B が代表取締役でないことにつき C が善意かつ無重過失であれば、A 会社はその取引について責任を負う。【R5 出題】", "ans": "○", "exp": "会 13、(会９、民 109②(権限外の表見代理))"}, {"id": "tf-262", "no": "6-6", "tag": "計算・組織再編", "type": "tf", "q": "６－６　判例によれば、取締役会設置会社と取締役との利益が相反する取引につき、株主全員がそれに同意している場合には、取締役会の承認を要しない。【R5 出題】", "ans": "×", "exp": "最高裁昭和 49 年９月 26 日判決は、株主全員の同意があったとしても、取締役会は監視する義務を負うため、利益相反取引においては承認を要する(会 356①)。また、取締役会設置会社は会 365 条の読み替え規定を適用する。"}, {"id": "tf-263", "no": "6-7", "tag": "計算・組織再編", "type": "tf", "q": "６－７　甲株式会社は取締役 A が所有する土地を購入することとし、それを取締役会に付議したところ、取締役 B は反対したが、代表取締役 C・取締役 D・取締役 E が賛成したため、承認された。そこで、C が甲会社を代表して A との間で当該土地の売買契約を締結したが、対価が相当ではなかったため、甲会社は損害を被った。この場合、A・C・D・E は、任務懈怠がなかったことを立証すれば、会社に対する損害賠償責任を免れる。【R5 出題】", "ans": "×", "exp": "賛成した取締役は、任務を怠ったと推定する(会 423③三)、任務を怠った場合は、損害賠償責任を負う(同条①)。損害賠償責任は総株主の同意がないと免除されない(424)。"}, {"id": "tf-264", "no": "6-8", "tag": "計算・組織再編", "type": "tf", "q": "６－８　判例によれば、取締役の監視義務は取締役会の上程事項に限られるため、取締役会に上程されなかった事項について取締役が他の取締役の職務執行に対する監督を怠り、それによって会社に損害が生じたとしても、監督を怠った取締役は会社に対して損害賠償責任を負わない。【R5 出題】", "ans": "×", "exp": "最高裁昭和 48 年５月 22 日判決は、上程事項だけでなく、代表取締役の業務一般に監視職責を負うとした。"}, {"id": "tf-265", "no": "6-9", "tag": "計算・組織再編", "type": "tf", "q": "６－９　公開会社において 6 ヶ月前から引き続き株式を有する株主は、会社に対して取締役の責任を追及する訴えの提起を請求することができるが、その株主が自らの会社のために取締役の責任を追及する訴えを提起するには、会社に回復できない損害が生ずるおそれがある場合を除き、請求の日から 60 日間待たなければならない。【R5 出題】", "ans": "○", "exp": "会 847①③　役員等(会 423①)の責任追及の訴えの提起を請求することができる。請求の日から 60 日以内に株式会社が提起しない場合は、株主は訴えの提起をすることができる。"}, {"id": "tf-266", "no": "6-10", "tag": "計算・組織再編", "type": "tf", "q": "６－10　判例によれば、取締役を退任したにもかかわらず、登記の残存に明示又は黙示に承諾を得ていた場合には、取締役としての第三者に対する損害賠償責任を負うことがある。【R5 出題】", "ans": "○", "exp": "最高裁昭和 47 年６月 15 日判決。表見代理と法理は一緒で、善意の第三者に対して会社と連帯して責任を負う(9)。"}, {"id": "tf-267", "no": "7-1", "tag": "総合演習", "type": "tf", "q": "７－１　会社法上の会社は、株式会社、合名会社、合弁会社、合同会社の４種類である。", "ans": "×", "exp": "会２　合弁会社とは、複数企業が一定の目的を以て設立する。ジョイントベンチャー、連結子会社とも。"}, {"id": "tf-268", "no": "7-2", "tag": "総合演習", "type": "tf", "q": "７－２　株式会社の株主は、定款の別段の定めがない限り、株式を譲渡することが自由であり、これにより投下資本を回収することができるのに対して、持分会社の社員は、他人に持分を譲渡することはできず、投下資本の回収は退社による持分の払戻に限られる。", "ans": "×", "exp": "会 585①　持分会社の場合、社員全員の承諾があれば可能"}, {"id": "tf-269", "no": "7-3", "tag": "総合演習", "type": "tf", "q": "７－３　株式会社と合同会社ではいわゆる決算公告が義務付けられている。", "ans": "×", "exp": "会 440　株式会社には決算公告義務があるが、合同会社にはない。"}, {"id": "tf-270", "no": "7-4", "tag": "総合演習", "type": "tf", "q": "７－４　会計参与は、非公開会社に限り、定款の定めにより設置することができる。", "ans": "×", "exp": "会 326② そんなことはない。カイ"}, {"id": "tf-271", "no": "7-5", "tag": "総合演習", "type": "tf", "q": "７－５　公開会社と非公開会社とを問わず、株主総会は会社に関する一切の事項について決議することができる。", "ans": "×", "exp": "一切の決議ができる(295①)。ただし、取締役会設置会社は定款に定めた事項に限る(295②)。取締役会設置会社は、非公開会社でも成立しうる。公開会社では、取締役会の設置義務があるため、必然的に取締役会設置会社になる。"}, {"id": "tf-272", "no": "7-6", "tag": "総合演習", "type": "tf", "q": "７－６　非公開会社（指名委員会等設置会社と監査等委員会設置会社を除く）では、取締役と監査役の任期に制限はない。", "ans": "×", "exp": "取締役は 10 年(会 332②)、監査役も 10 年(会 336①)まで伸長可。それ以上は不可。"}, {"id": "tf-273", "no": "7-7", "tag": "総合演習", "type": "tf", "q": "７－７　監査役会設置会社では、監査役会を通じて組織的に監査を行うため、各監査役は単独で監査役としての権限を行使することはできない。", "ans": "×", "exp": "会 390②　監査役会は方針や監査報告の作成等を行うが、各監査役の権限行使を妨げない。"}, {"id": "tf-274", "no": "7-8", "tag": "総合演習", "type": "tf", "q": "７－８　指名委員会等設置会社では、業務執行取締役や使用人兼務取締役は認められない。", "ans": "×", "exp": "使用人兼務はできない(会 331④)が、執行役は兼務できる(会 402①)。"}, {"id": "tf-275", "no": "7-9", "tag": "総合演習", "type": "tf", "q": "７－９　監査等委員会設置会社では、監査等委員たる取締役は他の取締役と区別して株主総会決議によって選任される。", "ans": "○", "exp": "会 329②カイ"}, {"id": "tf-276", "no": "7-10", "tag": "総合演習", "type": "tf", "q": "７－１０　株式会社の資本金額は、原則として設立又は新株発行に際して株主が実際に出資した財産の総額であるが、300 万円以上であることを要する。", "ans": "×", "exp": "１円からでも設立可"}, {"id": "tf-277", "no": "7-11", "tag": "総合演習", "type": "tf", "q": "７－１１　合名会社の社員が会社債権者から会社債務につき弁済責任を追及された場合、会社が会社債権者に対して弁済を拒絶しうる抗弁事由を有していたとしても、社員は弁済を拒絶することはできない。", "ans": "×", "exp": "会 581②　持分会社＝合名会社"}, {"id": "tf-278", "no": "7-12", "tag": "総合演習", "type": "tf", "q": "７－１２　発起設立は、発起人が設立時発行株式の全部を引き受けて株式会社を設立する方法であるのに対して、募集設立は、発起人が設立時発行株式を引き受けず、設立時発行株式の全部につき引受人を募集して株式会社を設立する方法である。", "ans": "×", "exp": "会 25②　各発起人は一株以上引き受けなければならない。"}, {"id": "tf-279", "no": "7-13", "tag": "総合演習", "type": "tf", "q": "７－１３　数人の相続人が株式を共同相続した場合、共同相続人は、権利行使者を指定して株式会社に通知しなければ、株主としての権利を行使することはできないが、判例によれば、権利行使者の指定には共同相続人全員の同意を要する。", "ans": "×", "exp": "通知しなければならない(会 106)が、共有物の管理行為は持分価格の過半数で足りる(民 252①)(最高裁平成９年１月 28 日判決)。"}, {"id": "tf-280", "no": "7-14", "tag": "総合演習", "type": "tf", "q": "７－１４　少数株主権は、数人の株主の有する議決権数又は持株数の合計がその要件をみたす場合には、その数人の株主が共同して行使することもできる。", "ans": "○", "exp": "株主提案権(会 303)や、株主総会招集請求権(会 297)等は、一定要件を満たす株主の議決権行使が要件になっているが、この「株主」は一人である必要はない。会 106 の「株式」は、「株式群」とも認識可能。"}, {"id": "tf-281", "no": "7-16", "tag": "総合演習", "type": "tf", "q": "７－１６　株式会社は会社法の認める範囲内で種類株式を発行することができるが、定款にその株式の内容に関する法定事項及び発行可能総数を定めておかなければならない。", "ans": "○", "exp": "会 108②　カイ"}, {"id": "tf-282", "no": "7-17", "tag": "総合演習", "type": "tf", "q": "７－１７　取締役が会社の計算において株主の権利の行使に関して財産上の利益を供与した場合、それに関与した他の取締役は、会社に対して、供与した利益額について無過失の支払責任を負う。", "ans": "×", "exp": "権利の行使に関し利益を供与した場合は無過失責任(会 120③)だが、関与した取締役は注意を怠らなかったことを証明すれば責任を免れる(会 120④)。"}, {"id": "tf-283", "no": "7-18", "tag": "総合演習", "type": "tf", "q": "７－１８　株券発行会社であるか否かを問わず、株式譲渡を会社その他の第三者に対抗するには、株主名簿の名義書換を要する。", "ans": "×", "exp": "会社への対抗要件は名義書換(会 130①)だが、株券発行会社はその他の第三者に名義書換だけでは対抗できない(会 130②読み替え)。株券の占有を要する(会 128①、131①)"}, {"id": "tf-284", "no": "7-19", "tag": "総合演習", "type": "tf", "q": "７－１９　取締役会設置会社では、定款で定めれば、取締役会決議をもって、市場取引により自己株式を買い受けることができるが、募集株式の発行等の手続によらずに市場取引によりその保有する自己株式を売却することはできない。", "ans": "○", "exp": "前半は会 165②、後半は会 199①。"}, {"id": "tf-285", "no": "7-20", "tag": "総合演習", "type": "tf", "q": "７－２０　株式会社が適法に取得した自己株式については、貸借対照表上の資産の部に計上することができる。", "ans": "×", "exp": "もちろん自己株式は純資産"}, {"id": "tf-286", "no": "7-21", "tag": "総合演習", "type": "tf", "q": "７－２１　A 株式会社は、B 株式会社の総株主の議決権の 70%を保有し、B 会社は C 株式会社の総株主の議決権の 60%を保有している。この場合、C 会社は、原則として A 会社の株式及び B 会社の株式を取得することはできない。", "ans": "○", "exp": "子会社は親会社株式を取得できない(会１３５①)し、孫会社も同様である。"}, {"id": "tf-287", "no": "7-22", "tag": "総合演習", "type": "tf", "q": "７－２２　株式会社は、譲渡制限株式の相続人に対して相続により取得した株式を会社に売り渡すよう請求できる旨を定款に定めることができるが、株式売渡請求をするには株主総会の特別決議を要し、その決議において売渡人たる相続人は議決権を行使することができない。", "ans": "○", "exp": "会 174、会 175②"}, {"id": "tf-288", "no": "7-23", "tag": "総合演習", "type": "tf", "q": "７－２３　A 株式会社が B 株式会社の総株主の議決権の 30%の株式を保有しており、B 会社も A 会社の株式を保有している場合、B 会社は A 会社の株主総会において議決権を行使することはできない。", "ans": "○", "exp": "２５%(四分の一以上)有する株主は、議決権を有しない(会３０８①反対解釈)"}, {"id": "tf-289", "no": "7-24", "tag": "総合演習", "type": "tf", "q": "７－２４　判例によれば、株主総会における議決権行使の代理人を株主に限定する旨の定款の定めは有効であるが、特段の事情があればその定めが適用されない場合もある。", "ans": "○", "exp": "議決権行使は代理人でも可能(会３１０①)だが、総会屋が横行したため、判例は例外を認めた(最高裁昭和４３年１１月１日第二小法廷)。"}, {"id": "tf-290", "no": "7-25", "tag": "総合演習", "type": "tf", "q": "７－２５　株式会社の定款を変更するには、株主総会の特別決議を要するが、株式譲渡制限規定を新設するための定款変更には、より決議要件の厳格な株主総会の特殊の決議を要する。", "ans": "○", "exp": "定款の変更（会４６６）は、特別決議(309②十一)だが、株式譲渡制限＝非公開会社化なので、より厳しい特殊決議を要する(３０９③一)。"}, {"id": "tf-291", "no": "7-26", "tag": "総合演習", "type": "tf", "q": "７－２６　6 ヵ月前から引き続き総株主の議決権の 5%を有する株主 A は、株主提案権を行使して、取締役 B がその職務執行に関して不正の行為を行ったとしてその解任議案を株主総会に上程したが、否決された。この場合、A は、30 日以内に訴えをもって B の解任を請求することができる。", "ans": "○", "exp": "不正や法令定款違反をした役員を解任する議案が否決された場合、３０日いないに解任を請求できる(会８５４①)。請求できる株主は、総株主の議決権又は発行済み株式の３%（百分の三)を六箇月以上保有している株主である。"}, {"id": "tf-292", "no": "7-27", "tag": "総合演習", "type": "tf", "q": "７－２７　判例によれば、一部の株主に対する招集通知漏れを理由として株主総会決議取消の訴えを提起できる株主は、招集通知を受けなかった株主に限られる。", "ans": "×", "exp": "会８３１①カイ"}, {"id": "tf-293", "no": "7-28", "tag": "総合演習", "type": "tf", "q": "７－２８　事業譲渡を承認する株主総会の決議において、事業の譲受人が株主として議決権を行使したために、その譲受人にとって著しく有利な条件の事業譲渡の決議がなされた場合、株主総会決議取消原因となり、裁判所は裁量棄却することはできない。", "ans": "○", "exp": "裁量棄却は会８３１①一のみにあり(会８３１②)、同上三号のため裁量棄却することはできない。"}, {"id": "tf-294", "no": "7-29", "tag": "総合演習", "type": "tf", "q": "７－２９　株主総会決議の内容が法令に違反する場合、株主は訴えによらずに決議の無効を主張することができるが、決議無効確認の訴えを提起し、無効確認判決が確定した場合、訴訟当事者のみならず第三者もまたその決議の効力を争うことはできなくなる。", "ans": "×", "exp": "前半は OK(会 830②)。後半は対世効はある(838)が、第三者が争うかどうかはその第三者次第。"}, {"id": "tf-295", "no": "7-30", "tag": "総合演習", "type": "tf", "q": "７－３０　大会社では内部統制システムの整備に関する事項を決定しなければならないが、取締役会はその決定を代表取締役に委任することができる。", "ans": "×", "exp": "会社 362④六は内部統制システムの整備について規定しており、同条５項は大会社においては取締役会に整備義務を課している。代表取締役には委任できない。"}, {"id": "tf-296", "no": "7-31", "tag": "総合演習", "type": "tf", "q": "７－３１　株主総会では、書面又は電磁的記録による決議も認められるが、取締役会では、書面又は電磁的記録による決議は認められない。", "ans": "×", "exp": "取締役会もできる(会 370)。株主総会は 319 条で規定。"}, {"id": "tf-297", "no": "7-32", "tag": "総合演習", "type": "tf", "q": "７－３２　判例によれば、代表取締役が取締役会決議を経ずに重要な業務執行に属する取引を行った場合、相手方が取締役会決議を経ていないことを知り又は知ることができたときは、その取引は無効である。", "ans": "○", "exp": "原則有効だが、相手方が決議の欠缺につき悪意又は有過失であれば無効(最高裁昭和 40 年９月 22 日)。"}, {"id": "tf-298", "no": "7-33", "tag": "総合演習", "type": "tf", "q": "７－３３　取締役が必要な承認を受けずに自己又は第三者のために会社の事業の部類に属する取引を行った場合、その取締役の会社に対する損害賠償責任について、その取締役又は第三者が得た利益の額をもって会社の損害額とみなされる。", "ans": "○", "exp": "競業取引(会３５６①)による損害賠償責任(４２３①)は、取締役又は第三者が得た利益の額(同条②)である。"}, {"id": "tf-299", "no": "7-34", "tag": "総合演習", "type": "tf", "q": "７－３４　甲株式会社は取締役 A が所有する土地を購入することとし、それを取締役会に付議したところ、B は反対したが、C・D・E が賛成したため、承認された。そこで、C が甲会社を代表して A との間で当該土地の売買契約を締結したが、対価が相当ではなかったため、甲会社は損害を被った。この場合、A・C・D・E は、任務懈怠がなかったことを立証しない限り、会社に対する損害賠償責任を免れない。", "ans": "×", "exp": "会社法 423 条 3 項 3 号により賛成取締役 C・D・E の任務懈怠は推定されるが、自己取引をした取締役 A の責任は会社法 428 条 1 項により無過失責任であり、任務懈怠がなかったとの立証では免れない。"}, {"id": "tf-300", "no": "7-35", "tag": "総合演習", "type": "tf", "q": "７－３５　取締役に対して業績連動型の報酬を支払う場合、報酬額の具体的な算定方法を定款又は株主総会決議をもって定めることを要する。", "ans": "○", "exp": "会 361①二カイ二"}, {"id": "tf-301", "no": "7-36", "tag": "総合演習", "type": "tf", "q": "７－３６　判例によれば、取締役の監視義務は取締役会の上程事項に限られるため、取締役会に上程されなかった事項について取締役が他の取締役の職務執行に対する監督を怠り、それによって会社に損害が生じたとしても、監督を怠った取締役は会社に対して損害賠償責任を負わない。", "ans": "×", "exp": "取締役は株式会社と委任関係にあり(会 330)、善管注意義務(民 644)を負う。また、職務執行自体の監視義務もある(会３６２②二)。これを怠れば、損害賠償責任を負う(会 423①)。"}, {"id": "tf-302", "no": "7-37", "tag": "総合演習", "type": "tf", "q": "７－３７　判例によれば、取締役が会社との取引によって負担した債務も、株主代表訴訟によって追及することができる。", "ans": "○", "exp": "株主が追求できる取締役の責任(会 847①)は、取締役が負担した取引債務についての責任も含まれる(最高裁平成 21 年３月 10 日)。"}, {"id": "tf-303", "no": "7-38", "tag": "総合演習", "type": "tf", "q": "７－３８　取締役の軽過失による任務懈怠に基づく会社に対する損害賠償責任を株主総会の特別決議に基づき軽減する場合、その議案を株主総会に提出するには、監査役設置会社にあっては各監査役の同意を得なければならない。", "ans": "○", "exp": "役員の軽過失(善意でかつ重大な過失がない)の賠償責任(会４２５①)の免除は、監査役設置会社では監査役の同意を得なければならない(同条③一)。"}, {"id": "tf-304", "no": "7-39", "tag": "総合演習", "type": "tf", "q": "７－３９　取締役が計算書類に記載すべき重要な事項について虚偽の記載をしたため、それを信じた第三者が損害を被った場合、取締役に悪意又は重過失があった場合に限り、第三者に対して損害賠償責任を負う。", "ans": "×", "exp": "悪意又は有過失の場合は、損害賠償責任を負う(会 429①)。注意を怠らなかったことを証明できなかった場合も損害賠償責任を負う(同条②)。"}, {"id": "fill-1", "no": "１－１", "tag": "穴埋め", "type": "fill", "q": "１－１　企業の社会的責任に対する声が高まる中、ステークホルダー[①] の
