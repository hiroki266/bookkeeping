不存在で原因と出訴期間が異なる点である。"},{"id":"t270","type":"tf","q":"判例によれば、株主総会の定足数が不足した場合は株主総会決議の取消原因となり、株主総会の招集通知漏れが著しい場合も同様とする。","answer":"×","year":"","basis":"会社法830条１項、判例","explanation":"結論：×。誤りは「判例によれば、株主総会の定足数が不足した場合は株主総会決議の取消原因となり、株主総会の招集通知漏れが著しい場合も同様とする」という結論部分である。正しくは、判例によれば、株主総会の定足数が不足した場合は株主総会決議の取消原因となり、株主総会の招集通知漏れが著しい場合も同様としない。会社法830条１項、判例を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t271","type":"tf","q":"取締役の選任は株主総会の普通決議事項であるが、その解任は特別決議事項である。","answer":"×","year":"令和1年","basis":"会社法339条１項、341条","explanation":"結論：×。誤りは「取締役の選任は株主総会の普通決議事項であるが、その解任は特別決議事項である」という結論部分である。正しくは、取締役の選任は株主総会の普通決議事項であるが、その解任は特別決議事項ではない。会社法339条１項、341条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t272","type":"tf","q":"法人は、持分会社の業務執行社員、株式会社の発起人にはなることができるが、取締役になることはできない。","answer":"○","year":"","basis":"会社法331条１項１号","explanation":"結論：〇。会社法331条１項１号により、設問の内容でよい。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t273","type":"tf","q":"取締役設置会社における取締役の員数は３人以上であり、取締役会を設置しない会社は１人でもよい。","answer":"○","year":"","basis":"会社法331条５項","explanation":"結論：〇。会社法331条５項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t274","type":"tf","q":"取締役の任期は、公開会社では原則として２年であり、定款及び株主総会決議をもって短縮可能であるが、伸長することはできない。また、非公開会社では定款により 10 年まで伸長可能である。","answer":"○","year":"","basis":"会社法332条、336条","explanation":"結論：〇。会社法332条、336条により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t275","type":"tf","q":"指名委員会等設置会社の取締役・監査等委員会設置会社の監査等委員ではない取締役の任期は３年である。","answer":"×","year":"","basis":"会社法332条、336条","explanation":"結論：×。誤りは「指名委員会等設置会社の取締役・監査等委員会設置会社の監査等委員ではない取締役の任期は３年である」という結論部分である。正しくは、指名委員会等設置会社の取締役・監査等委員会設置会社の監査等委員ではない取締役の任期は３年ではない。会社法332条、336条を確認する。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t276","type":"tf","q":"代表取締役の氏名は登記事項であるが、取締役の氏名は登記事項ではない。","answer":"×","year":"令和3年","basis":"会社法911条３項13号・14号","explanation":"結論：×。誤りは「代表取締役の氏名は登記事項であるが、取締役の氏名は登記事項ではない」という結論部分である。正しくは、代表取締役の氏名は登記事項ではないが、取締役の氏名は登記事項ではない。会社法911条３項13号・14号を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t277","type":"tf","q":"取締役の退任により欠員が生じ、会社法又は定款所定の員数を欠くに至った場合、退任事由のいかんを問わず、その退任取締役は新たに選任された取締役が就任するまで取締役として留任する。","answer":"×","year":"令和1年","basis":"会社法346条１項（辞任・任期満了に限る）","explanation":"結論：×。誤りは「取締役の退任により欠員が生じ、会社法又は定款所定の員数を欠くに至った場合、退任事由のいかんを問わず、その退任取締役は新たに選任された取締役が就任するまで取締役として留任する」という結論部分である。正しくは、取締役の退任により欠員が生じ、会社法又は定款所定の員数を欠くに至った場合、退任事由のいかんを問わず、その退任取締役は新たに選任された取締役が就任するまで取締役として留任しない。会社法346条１項（辞任・任期満了に限る）を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t278","type":"tf","q":"取締役(累積投票によって選任された取締役・監査等委員会設置会社の監査等委員たる取締役は除く。)は正当な理由がなくても株主総会の普通決議をもって解任することができるが、正当な理由なく解任された場合、その取締役は会社に対して損害賠償を請求することがでる。","answer":"○","year":"令和3年","basis":"会社法339条１項、341条","explanation":"結論：〇。会社法339条１項、341条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t279","type":"tf","q":"累積投票によって選任された取締役の解任・監査等委員会設置会社の監査等委員たる取締役の解任は、株主総会の普通決議が必要である。","answer":"×","year":"","basis":"会社法339条１項、341条","explanation":"結論：×。誤りは「累積投票によって選任された取締役の解任・監査等委員会設置会社の監査等委員たる取締役の解任は、株主総会の普通決議が必要である」という結論部分である。正しくは、累積投票によって選任された取締役の解任・監査等委員会設置会社の監査等委員たる取締役の解任は、株主総会の普通決議が常に必要であるわけではない。会社法339条１項、341条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t280","type":"tf","q":"取締役会とは、取締役全員によって構成され、会社の業務執行を決定し、取締役の職務執行を監督する合議制の機関である。","answer":"○","year":"","basis":"会社法362条２項","explanation":"結論：〇。会社法362条２項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t281","type":"tf","q":"判例によれば、重要な財産の処分に該当するかどうかは、当該財産の価額、その会社の総財産に占める割合、当該財産の保有目的、処分行為の態様及び会社における従来の取扱等の事情を総合的に考慮して判断すべきであるとする。","answer":"○","year":"","basis":"会社法362条４項、373条１項","explanation":"結論：〇。会社法362条４項、373条１項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t282","type":"tf","q":"取締役会設置会社では、内部統制システムの整備の基本方針は取締役会の専決事項であり、大会社については内部統制システムの整備に関する事項の決定が義務づけられている。","answer":"○","year":"平成29年、令和3年","basis":"会社法362条４項６号・５項","explanation":"結論：〇。会社法362条４項６号・５項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t283","type":"tf","q":"会社債権者は、いつでも裁判所の許可を得れば議事録の閲覧.謄写を請求することができる。","answer":"×","year":"","basis":"会社法371条３項","explanation":"結論：×。誤りは「会社債権者は、いつでも裁判所の許可を得れば議事録の閲覧.謄写を請求することができる」という結論部分である。正しくは、会社債権者は、いつでも裁判所の許可を得れば議事録の閲覧.謄写を請求することができない又は要件を満たす場合に限られる。会社法371条３項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t284","type":"tf","q":"取締役会の議決権行使については、書面決議(持ち回り決議)が容認されている。","answer":"○","year":"","basis":"会社法369条、370条","explanation":"結論：〇。会社法369条、370条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t285","type":"tf","q":"取締役会設置会社である A 株式会社(以下 A 社という。)は、事業として甲県内においてトラックによる陸上貨物運送を行っている。A 社の取締役である B が事業として甲県内においてトラックによる陸上貨物運送を行っている C 株式会社の代表取締役となって当該運送に係る取引をしようとする場合には、B は、A 社の取締役会において、当該取引につき重要な事実を開示し、その承認を受けなければならない。","answer":"○","year":"平成29年","basis":"会社法362条、369条","explanation":"結論：〇。会社法362条、369条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t286","type":"tf","q":"判例によれば、取締役会において代表取締役を解職する旨の決議をする場合に、解職される代表取締役は特別の利害関係を有する取締役に該当しないとしている。","answer":"×","year":"","basis":"会社法369条２項、判例","explanation":"結論：×。誤りは「判例によれば、取締役会において代表取締役を解職する旨の決議をする場合に、解職される代表取締役は特別の利害関係を有する取締役に該当しないとしている」という結論部分である。正しくは、判例によれば、取締役会において代表取締役を解職する旨の決議をする場合に、解職される代表取締役は特別の利害関係を有しない取締役に該当しないとしている。会社法369条２項、判例を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t287","type":"tf","q":"取締役会が設置されない会社の取締役が自己又は第三者のために会社の事業の部類に属する取引を行うには、株主総会において、その取引に関する重要な事実を開示した上でその承認を受けなければならず、その取引をした取締役は、取引後遅滞なく、その取引に関する重要な事実を株主総会に報告しなければならない。","answer":"×","year":"令和1年","basis":"会社法356条１項１号、365条１項、423条２項","explanation":"結論：×。誤りは「取締役会が設置されない会社の取締役が自己又は第三者のために会社の事業の部類に属する取引を行うには、株主総会において、その取引に関する重要な事実を開示した上でその承認を受けなければならず、その...」という結論部分である。正しくは、取締役会が設置されない会社の取締役が自己又は第三者のために会社の事業の部類に属する取引を行うには、株主総会において、その取引に関する重要な事実を開示した上でその承認を受けなければならず、その取引をした取締役は、取引後遅滞なく、その取引に関する重要な事実を株主総会に報告しなければなる場合がある。会社法356条１項１号、365条１項、423条２項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t288","type":"tf","q":"取締役会設置会社の取締役が会社との間で自己又は第三者のために会社と利益の相反する取引をするには、取締役会の承認を要するが、会社が取締役の債務を保証する場合は、会社と第三者との間の取引であるため、取締役会の承認を要しない。","answer":"×","year":"令和1年","basis":"会社法356条１項２号・３号、365条１項","explanation":"結論：×。誤りは「取締役会設置会社の取締役が会社との間で自己又は第三者のために会社と利益の相反する取引をするには、取締役会の承認を要するが、会社が取締役の債務を保証する場合は、会社と第三者との間の取引であるた...」という結論部分である。正しくは、取締役会設置会社の取締役が会社との間で自己又は第三者のために会社と利益の相反する取引をするには、取締役会の承認を要するが、会社が取締役の債務を保証する場合は、会社と第三者との間の取引であるため、取締役会の承認を要する。会社法356条１項２号・３号、365条１項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t289","type":"tf","q":"判例によれば、特別利害関係人が議決権を行使した場合の決議の効力は、無効であるとされている。","answer":"×","year":"","basis":"会社法369条２項、831条１項３号","explanation":"結論：×。誤りは「判例によれば、特別利害関係人が議決権を行使した場合の決議の効力は、無効であるとされている」という結論部分である。正しくは、判例によれば、特別利害関係人が議決権を行使した場合の決議の効力は、当然に無効となるわけではないとされている。会社法369条２項、831条１項３号を確認する。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t290","type":"tf","q":"判例によれば、一部の取締役に対する招集通知漏れがあった場合、原則として取締役会決議は無効であるが、当該取締役が名目的取締役であった場合のように、その取締役が出席してもなお決議に影響がないと認められる特段の事情がある場合には、招集通知漏れは決議の効力に影響を及ぼさない。","answer":"○","year":"令和3年","basis":"会社法295条、309条、831条","explanation":"結論：〇。会社法295条、309条、831条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t291","type":"tf","q":"判例によれば、取締役会設置会社において取締役会決議を経ずに代表取締役が株主総会を招集した場合、その株主総会の決議は不存在となる。","answer":"×","year":"令和5年","basis":"会社法295条、309条、831条","explanation":"結論：×。誤りは「判例によれば、取締役会設置会社において取締役会決議を経ずに代表取締役が株主総会を招集した場合、その株主総会の決議は不存在となる」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法295条、309条、831条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t292","type":"tf","q":"株式会社は、定款の定めがあれば、業務執行に携わらない取締役との間で、任務懈怠に基づく責任については、取締役の職務執行につき悪意又は重過失がなければ、一定額を限度として損害賠償責任を負う旨を約することができる。","answer":"○","year":"令和1年","basis":"会社法331条・332条・423条","explanation":"結論：〇。会社法331条・332条・423条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t293","type":"tf","q":"A 株式会社において、代表取締役副社長 B は代表取締役を退任し、その旨の登記も完了したが、なお取締役副社長の地位にあった。B が副社長と称して A 会社を代表して C との間で取引をした場合、B が代表取締役でないことにつき C が善意かつ無重過失であれば、A 会社はその取引について責任を負う。","answer":"○","year":"令和1年","basis":"会社法354条、判例","explanation":"結論：〇。会社法354条、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t294","type":"tf","q":"A 株式会社では、代表取締役でない取締役 B が勝手に副社長と名乗っていることを知りながらこれを漫然と放置していた。B が副社長と称して A 株式会社を代表して C との間で取引をした場合、B が代表取締役でないことにつき C が善意かつ無重過失であれば、A 株式会社はその取引について責任を負う。","answer":"○","year":"平成29年、令和3年","basis":"会社法354条、判例","explanation":"結論：〇。会社法354条、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t295","type":"tf","q":"判例によれば、代表取締役の専断的行為については、民法 93 条但書を類推適用し、その取引は原則として有効であり、取引の相手方が決議を経ていないことについて悪意または有過失の場合に限って無効であるとされている。","answer":"○","year":"","basis":"会社法362条４項、判例","explanation":"結論：〇。会社法362条４項、判例により、設問の内容でよい。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t296","type":"tf","q":"判例によれば、代表取締役が会社法 362 条４項に違反して独断で行った取引行為の効力につき、原則として会社のみが取引の無効を主張しうるとする。","answer":"○","year":"","basis":"会社法331条・332条・423条","explanation":"結論：〇。会社法331条・332条・423条により、設問の内容でよい。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t297","type":"tf","q":"A 株式会社(以下 A 社という。)では、代表取締役でない使用人 B に対して副社長という名称の使用を許諾していた。B が副社長と称して A 社を代表して C との間で取引をした場合、判例によれば、B が代表取締役でないことにつき C が善意かつ無重過失であれば、A 社はその取引について責任を負う。","answer":"○","year":"平成30年","basis":"会社法354条、判例","explanation":"結論：〇。会社法354条、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t298","type":"tf","q":"判例によれば、取締役の忠実義務は、取締役が会社の受任者として負うべき善管注意義務を敷衍し、かつ一層明確にしたものにすぎず、善管注意義務とは別個の高度の義務を規定したものではない。","answer":"○","year":"平成30年","basis":"会社法355条、民法644条、判例","explanation":"結論：〇。会社法355条、民法644条、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t299","type":"tf","q":"判例によれば、取締役は、取締役会に上程された事項に限り、代表取締役の職務執行につき監視する義務を負う。","answer":"×","year":"令和1年","basis":"会社法362条、369条","explanation":"結論：×。誤りは「判例によれば、取締役は、取締役会に上程された事項に限り、代表取締役の職務執行につき監視する義務を負う」という結論部分である。正しくは、判例によれば、取締役は、取締役会に上程された事項に限り、代表取締役の職務執行につき監視する義務を当然には負わない。会社法362条、369条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t300","type":"tf","q":"判例によれば、取締役会の承認を欠く利益相反取引は、当事者間では無効であるが、善意の第三者に対しては無効を主張することはできない。","answer":"○","year":"","basis":"会社法356条１項２号・３号、365条１項","explanation":"結論：〇。会社法356条１項２号・３号、365条１項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t301","type":"tf","q":"取締役が必要な承認を受けずに自己又は第三者のために会社の事業の部類に属する取引を行った場合、その取締役の会社に対する損害賠償責任について、その取締役又は第三者が得た利益の額をもって会社の損害額とみなされる","answer":"×","year":"平成30年、令和3年、令和5年","basis":"会社法356条１項１号、365条１項、423条２項","explanation":"結論：×。誤りは「取締役が必要な承認を受けずに自己又は第三者のために会社の事業の部類に属する取引を行った場合、その取締役の会社に対する損害賠償責任について、その取締役又は第三者が得た利益の額をもって会社の損害...」という結論部分である。正しくは、取締役が必要な承認を受けずに自己又は第三者のために会社の事業の部類に属する取引を行った場合、その取締役の会社に対しない損害賠償責任について、その取締役又は第三者が得た利益の額をもって会社の損害額とみなされる。会社法356条１項１号、365条１項、423条２項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t302","type":"tf","q":"株主総会の承認に基づいて競業取引を行なった場合であっても、株主総会への事後報告は必要である。","answer":"×","year":"","basis":"会社法365条２項（取締役会設置会社のみ）","explanation":"結論：×。誤りは「株主総会の承認に基づいて競業取引を行なった場合であっても、株主総会への事後報告は必要である」という結論部分である。正しくは、株主総会の承認に基づいて競業取引を行なった場合であっても、株主総会への事後報告は常に必要であるわけではない。会社法365条２項（取締役会設置会社のみ）を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t303","type":"tf","q":"判例では利益相反取引にあたるか否かを個別具体的・実質的に判断する傾向。最高裁判所の判例によれば、株式会社(取締役会設置会社)に対し取締役が無利息・無担保で金銭を貸し付ける行為は、取締役会による承認を必要としない。","answer":"○","year":"平成29年、令和3年","basis":"会社法356条１項２号・３号、365条１項","explanation":"結論：〇。会社法356条１項２号・３号、365条１項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t304","type":"tf","q":"判例では、取締役が会社に対して無利息・無担保で金銭を貸し付ける行為は利益相反行為にあたらないとされている。","answer":"○","year":"","basis":"会社法356条１項２号、判例","explanation":"結論：〇。会社法356条１項２号、判例により、設問の内容でよい。判断の肝は、競業取引と利益相反取引で承認・責任の規律が異なる点である。"},{"id":"t305","type":"tf","q":"判例では、会社・取締役間の手形行為は、手形行為により原因関係とは別個の法律関係が形成され、手形行為者は通常の債務よりも厳格な債務を負担する以上、そこには利益相反関係を生ずるから、承認が必要であるとされている。","answer":"○","year":"","basis":"会社法356条１項２号、判例","explanation":"結論：〇。会社法356条１項２号、判例により、設問の内容でよい。判断の肝は、競業取引と利益相反取引で承認・責任の規律が異なる点である。"},{"id":"t306","type":"tf","q":"A は、取締役会設置会社である B 株式会社の代表取締役であると同時に、取締役会が設置されない C株式会社の代表取締役でもある。A が B 株式会社と C 株式会社を代表して取引をする場合、B 株式会社では取締役会の承認を要する。","answer":"○","year":"平成30年","basis":"会社法362条、369条","explanation":"結論：〇。会社法362条、369条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t307","type":"tf","q":"無過失の責任を負うのは、自己のために取引をした場合取締役が自己または第三者のために会社と取引を行ったことによって会社に損害が生じた場合、その取締役は会社に対して無過失の責任を負う。","answer":"×","year":"平成29年","basis":"会社法428条１項","explanation":"結論：×。誤りは「無過失の責任を負うのは、自己のために取引をした場合取締役が自己または第三者のために会社と取引を行ったことによって会社に損害が生じた場合、その取締役は会社に対して無過失の責任を負う」という結論部分である。正しくは、無過失の責任を負うのは、自己のために取引をした場合取締役が自己または第三者のために会社と取引を行ったことによって会社に損害が生じた場合、その取締役は会社に対して無過失の責任を当然には負わない。会社法428条１項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t308","type":"tf","q":"判例によれば、一人株主である取締役の利益相反取引につき、実質的には会社の利害と一人株主の利害は一致するため、利益相反取引関係を生じないとする。","answer":"○","year":"","basis":"会社法356条１項２号・３号、365条１項","explanation":"結論：〇。会社法356条１項２号・３号、365条１項により、設問の内容でよい。判断の肝は、競業取引と利益相反取引で承認・責任の規律が異なる点である。"},{"id":"t309","type":"tf","q":"判例によれば、定款または株主総会決議によって報酬の金額が決定されなければ、具体的な報酬請求権は発生しないとされている。","answer":"○","year":"","basis":"会社法361条１項、判例","explanation":"結論：〇。会社法361条１項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t310","type":"tf","q":"判例によれば、株主総会決議により、取締役全員の報酬総額の最高限度額を定め、各取締役に対する配分の決定を取締役会に委任することができ、その委任を受けた取締役会は、その決議によって各取締役の報酬額の決定を代表取締役に再委任することができる。","answer":"○","year":"令和3年","basis":"会社法361条１項、判例","explanation":"結論：〇。会社法361条１項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t311","type":"tf","q":"判例によれば、取締役会の報酬については、株主総会の決議により、取締役全員の総額を定めて、各取締役に対する具体的な配分の決定を取締役会に委任することができ、その委任を受けた各取締役会は、その決議により、各取締役の報酬額の決定を代表取締役に再委任することができる。","answer":"○","year":"令和5年","basis":"会社法361条１項、判例","explanation":"結論：〇。会社法361条１項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t312","type":"tf","q":"判例によれば、取締役の報酬について、定款または株主総会決議によって報酬の金額が決定されなければ、具体的な報酬請求権は発生しないとする。","answer":"○","year":"","basis":"会社法361条１項、判例","explanation":"結論：〇。会社法361条１項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t313","type":"tf","q":"判例によれば、株主総会決議を経ずに取締役の報酬が支払われても、事後的に株主総会決議を経れば、その支払いは有効である。","answer":"○","year":"令和1年","basis":"会社法295条、309条、831条","explanation":"結論：〇。会社法295条、309条、831条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t314","type":"tf","q":"使用人として受ける給与の体系が明確に確立しており、使用人として受ける給与がそれによって支給されている場合、使用人兼務取締役につき、別に使用人としての給与を受けることを予定しつつ、取締役として受ける報酬額のみを株主総会で決議することとしても、脱法行為にはならないとされている。","answer":"○","year":"","basis":"会社法361条１項、判例","explanation":"結論：〇。会社法361条１項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t315","type":"tf","q":"判例によれば、取締役の報酬の範囲につき、退職慰労金も報酬の後払いとしての性質を有するため、取締役の報酬規制に服する。","answer":"○","year":"","basis":"会社法361条１項、判例","explanation":"結論：〇。会社法361条１項、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t316","type":"tf","q":"判例によれば、取締役の退職慰労金につき、その決定を無条件で取締役会に一任することは許されないが、明示的または黙示的にその支給に関する基準を示し、その基準に従って支給金額を定めるべきこととして、取締役会にその決定を委ねることは許される。","answer":"○","year":"平成29年","basis":"会社法361条１項、判例","explanation":"結論：〇。会社法361条１項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t317","type":"tf","q":"判例によれば、取締役会の退職報労金につき、取締役会がさらに取締役会長または社長に一任することはできない。","answer":"×","year":"","basis":"会社法361条１項、判例","explanation":"結論：×。誤りは「判例によれば、取締役会の退職報労金につき、取締役会がさらに取締役会長または社長に一任することはできない」という結論部分である。正しくは、判例によれば、取締役会の退職報労金につき、取締役会がさらに取締役会長または社長に一任することはできる場合がある。会社法361条１項、判例を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t318","type":"tf","q":"判例によれば、純粋持株会社(親会社)は、子会社の支配・管理自体をその業務とするため、子会社に対する不適切な指揮・監督の懈怠により子会社が破綻するなどして親会社も損害を被れば、親会社の取締役は親会社に対する責任を免れないとされている。","answer":"○","year":"","basis":"会社法362条２項２号、423条１項、判例","explanation":"結論：〇。会社法362条２項２号、423条１項、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t319","type":"tf","q":"公開会社において６ヶ月前から引き続き株式を有する株主は、会社に対して取締役の責任を追及する訴えの提起を請求することができるが、その請求の日から 60 日以内に会社が不提訴を決定し、請求した株主に対してその理由を書面に通知した場合、その株主は自ら会社のために訴えを提起することはできない。","answer":"×","year":"平成29年、令和3年","basis":"会社法331条・332条・423条","explanation":"結論：×。誤りは「公開会社において６ヶ月前から引き続き株式を有する株主は、会社に対して取締役の責任を追及する訴えの提起を請求することができるが、その請求の日から 60 日以内に会社が不提訴を決定し、請求した株...」という結論部分である。正しくは、公開会社において６ヶ月前から引き続き株式を有する株主は、会社に対して取締役の責任を追及する訴えの提起を請求することができるが、その請求の日から 60 日以内に会社が不提訴を決定し、請求した株主に対してその理由を書面に通知した場合、その株主は自ら会社のために訴えを提起することはできる場合がある。会社法331条・332条・423条を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t320","type":"tf","q":"完全親会社をもたない完全親会社(最終完全親会社)の総株主の議決権または発行済株式総数の 1%以上を有する株主は、重要な完全子会社(株式の帳簿価格が親会社の総資産額の 20%を超える子会社)の取締役等の責任(特定責任)を追求する訴えの提起を請求することができる。","answer":"○","year":"","basis":"会社法847条の３","explanation":"結論：〇。会社法847条の３により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t321","type":"tf","q":"株主が取締役の会社に対する損害賠償責任を追及する株主代表訴訟において、ほかの株主又は会社は原則としてその訴訟に参加することができるが、会社が被告取締役に補助参加することはできない。","answer":"×","year":"平成30年","basis":"会社法849条１項・３項","explanation":"結論：×。誤りは「株主が取締役の会社に対する損害賠償責任を追及する株主代表訴訟において、ほかの株主又は会社は原則としてその訴訟に参加することができるが、会社が被告取締役に補助参加することはできない」という結論部分である。正しくは、株主が取締役の会社に対する損害賠償責任を追及する株主代表訴訟において、ほかの株主又は会社は原則としてその訴訟に参加することができるが、会社が被告取締役に補助参加することはできる場合がある。会社法849条１項・３項を確認する。判断の肝は、提訴請求、待機期間、持株要件の例外である。"},{"id":"t322","type":"tf","q":"判例では、株主代表訴訟によって追及できる取締役の責任は、取締役の地位に基づく会社法上の責任に限られる。","answer":"×","year":"令和1年","basis":"会社法847条１項、判例","explanation":"結論：×。誤りは「判例では、株主代表訴訟によって追及できる取締役の責任は、取締役の地位に基づく会社法上の責任に限られる」という結論部分である。正しくは、判例では、株主代表訴訟によって追及できない又は要件を満たす場合に限られる取締役の責任は、取締役の地位に基づく会社法上の責任に限られる。会社法847条１項、判例を確認する。判断の肝は、提訴請求、待機期間、持株要件の例外である。"},{"id":"t323","type":"tf","q":"代表取締役の任務懈怠に基づく会社に対する損害賠償責任を株主総会の特別決議に基づき軽減する場合、又は定款の定めに基づき取締役会決議をもって軽減する場合、最低責任限度額は報酬の４年分であり、これを下回る減免はできない。","answer":"×","year":"平成30年","basis":"会社法425条１項１号","explanation":"結論：×。誤りは「代表取締役の任務懈怠に基づく会社に対する損害賠償責任を株主総会の特別決議に基づき軽減する場合、又は定款の定めに基づき取締役会決議をもって軽減する場合、最低責任限度額は報酬の４年分であり、これ...」という結論部分である。正しくは、代表取締役の任務懈怠に基づく会社に対する損害賠償責任を株主総会の特別決議に基づき軽減する場合、又は定款の定めに基づき取締役会決議をもって軽減する場合、最低責任限度額は報酬の４年分であり、これを下回る減免はできる場合がある。会社法425条１項１号を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t324","type":"tf","q":"取締役会設置会社において、代表取締役の任務懈怠に基づく会社に対する損害賠償責任を株主総会の特別決議に基づき軽減する場合、又は定款の定めに基づき取締役会決議取締役会決議をもって軽減する場合、最低責任限度額は報酬の４年分であり、これを下回る減免はできない。","answer":"×","year":"令和5年","basis":"会社法425条１項１号","explanation":"結論：×。誤りは「取締役会設置会社において、代表取締役の任務懈怠に基づく会社に対する損害賠償責任を株主総会の特別決議に基づき軽減する場合、又は定款の定めに基づき取締役会決議取締役会決議をもって軽減する場合、最...」という結論部分である。正しくは、取締役会設置会社において、代表取締役の任務懈怠に基づく会社に対する損害賠償責任を株主総会の特別決議に基づき軽減する場合、又は定款の定めに基づき取締役会決議取締役会決議をもって軽減する場合、最低責任限度額は報酬の４年分であり、これを下回る減免はできる場合がある。会社法425条１項１号を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t325","type":"tf","q":"取締役の任務懈怠に基づく会社に対する損害賠償責任を免除するには、総株主の同意を要するが、取締役の任務懈怠に基づく会社に対する損害賠償責任について会社が裁判上または裁判外の和解をするには、総株主の同意を要しない。","answer":"×","year":"平成29年、令和3年","basis":"会社法424条、850条","explanation":"結論：×。誤りは「取締役の任務懈怠に基づく会社に対する損害賠償責任を免除するには、総株主の同意を要するが、取締役の任務懈怠に基づく会社に対する損害賠償責任について会社が裁判上または裁判外の和解をするには、総株...」という結論部分である。正しくは、取締役の任務懈怠に基づく会社に対する損害賠償責任を免除するには、総株主の同意を要するが、取締役の任務懈怠に基づく会社に対する損害賠償責任について会社が裁判上または裁判外の和解をするには、総株主の同意を要する。会社法424条、850条を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t326","type":"tf","q":"判例によれば、会社法第 429 条第１項に規定する取締役の第三者に対する損害賠償責任は、第三者保護のための特別の法定責任であり、取締役の悪意又は重過失による任務懈怠と第三者の損害との間に相当因果関係がある限り、直接損害と間接損害とを問わず賠償の対象となり、直接損害については不法行為責任との競合も認められる。","answer":"○","year":"令和3年","basis":"会社法429条１項、判例","explanation":"結論：〇。会社法429条１項、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t327","type":"tf","q":"取締役が悪意または重大な過失となる放漫経営をし、当該放漫経営により倒産した会社に対する債権を回収することができなくなる損害を被った会社債権者は、当該取締役の責任を追及することができる。","answer":"○","year":"平成29年","basis":"会社法429条１項、判例","explanation":"結論：〇。会社法429条１項、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t328","type":"tf","q":"取締役が虚偽の登記をしたことにより第三者が損害を被った場合、その取締役は、悪意又は重過失があった場合に限り、第三者に対する損害賠償責任を負う。","answer":"×","year":"令和1年","basis":"会社法429条２項１号","explanation":"結論：×。誤りは「取締役が虚偽の登記をしたことにより第三者が損害を被った場合、その取締役は、悪意又は重過失があった場合に限り、第三者に対する損害賠償責任を負う」という結論部分である。正しくは、取締役が虚偽の登記をしたことにより第三者が損害を被った場合、その取締役は、悪意又は重過失があった場合に限り、第三者に対する損害賠償責任を当然には負わない。会社法429条２項１号を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t329","type":"tf","q":"判例によれば、第三者に対する責任を負うべき取締役の範囲について、表見取締役は、取締役として適法な選任決議を経ていないが、就任登記に明示または黙示に承諾していた場合には、故意または過失により不実登記の出現に加功していたものとして、責任を負うとされる。","answer":"○","year":"","basis":"会社法908条２項、429条１項、判例","explanation":"結論：〇。会社法908条２項、429条１項、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t330","type":"tf","q":"ヶ月前から引き続き総株主の議決権の議決権の 5%を有する株主 A は、株主提案権を行使して、取締役 B がその職務執行に関して不正の行為を行ったとしてその解任議案を株主総会に上陸したが、否決された。この場合、A は、30 日以内に訴えをもって B の解任を請求することができる。","answer":"○","year":"令和5年","basis":"会社法854条１項","explanation":"結論：〇。会社法854条１項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t331","type":"tf","q":"株主総会は、株主の全員の同意があっても、招集手続を省略して開催することはできないが、取締役会は、取締役・監査役の全員の同意があれば、招集手続を省略して開催することができる。","answer":"×","year":"令和5年","basis":"会社法299条１項、300条","explanation":"結論：×。誤りは「株主総会は、株主の全員の同意があっても、招集手続を省略して開催することはできないが、取締役会は、取締役・監査役の全員の同意があれば、招集手続を省略して開催することができる」という結論部分である。正しくは、株主総会は、株主の全員の同意があっても、招集手続を省略して開催することはできる場合があるが、取締役会は、取締役・監査役の全員の同意があれば、招集手続を省略して開催することができる。会社法299条１項、300条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t332","type":"tf","q":"判例によれば、代表取締役の解職を目的とする取締役会決議において、解職の対象となっている代表取締役は議決権を行使することはできない。","answer":"○","year":"令和5年","basis":"会社法295条、309条、831条","explanation":"結論：〇。会社法295条、309条、831条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t333","type":"tf","q":"A 株式会社では、代表取締役でない B に対して副社長という名称の使用を許諾していたが、B は使用人にすぎなかった。B が副社長と称して A 会社を代表して C との間で取引をした場合、判例によれば B が代表取締役でないことにつき C が善意かつ無重過失であれば、A 会社はその取引について責任を負う。","answer":"○","year":"令和5年","basis":"会社法354条、判例","explanation":"結論：〇。会社法354条、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t334","type":"tf","q":"甲株式会社は取締役 A が所有する土地を購入することとし、それを取締役会に付議したところ、取締役 B は反対したが、代表取締役 C・取締役 D・取締役 E が賛成したため、承認された。そこで、C が甲会社を代表して A との間で当該土地の売買契約を締結したが、対価が相当ではなかったため、甲会社は損害を被った。この場合、A・C・D・E は、任務懈怠がなかったことを立証すれば、会社に対する損害賠償責任を免れる。","answer":"×","year":"令和5年","basis":"会社法423条３項、428条１項","explanation":"結論：×。誤りは「甲株式会社は取締役 A が所有する土地を購入することとし、それを取締役会に付議したところ、取締役 B は反対したが、代表取締役 C・取締役 D・取締役 E が賛成したため、承認された。そこで...」という結論部分である。正しくは、甲株式会社は取締役 A が所有する土地を購入することとし、それを取締役会に付議したところ、取締役 B は反対したが、代表取締役 C・取締役 D・取締役 E が賛成したため、承認された。そこで、C が甲会社を代表して A との間で当該土地の売買契約を締結したが、対価が相当ではなかったため、甲会社は損害を被った。この場合、A・C・D・E は、任務懈怠がなかったことを立証すれば、会社に対しない損害賠償責任を免れる。会社法423条３項、428条１項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t335","type":"tf","q":"公開会社において６ヶ月前から引き続き株式を有する株主は、会社に対して取締役の責任を追及する訴えの提起を請求することができるが、その株主が自らの会社のために取締役の責任を追及する訴えを提起するには、会社に回復できない損害が生ずるおそれがある場合を除き、請求の日から 60 日間待たなければならない。","answer":"○","year":"令和5年","basis":"会社法847条１項～５項","explanation":"結論：〇。会社法847条１項～５項により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t336","type":"tf","q":"判例によれば、取締役を退任したにもかかわらず、登記の残存に明示又は黙示に承諾を得ていた場合には、取締役としての第三者に対する損害賠償責任を負うことがある。","answer":"×","year":"令和5年","basis":"会社法908条２項類推、判例","explanation":"結論：×。誤りは「判例によれば、取締役を退任したにもかかわらず、登記の残存に明示又は黙示に承諾を得ていた場合には、取締役としての第三者に対する損害賠償責任を負うことがある」という結論部分である。正しくは、判例によれば、取締役を退任したにもかかわらず、登記の残存に明示又は黙示に承諾を得ていた場合には、取締役としての第三者に対する損害賠償責任を当然には負わないことがある。会社法908条２項類推、判例を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"}];
const $=id=>document.getElementById(id), state=JSON.parse(localStorage.getItem('companyLawQuizState')||'{}'); let current=null, orderIndex=0, judged=false, selected='';
function save(){localStorage.setItem('companyLawQuizState',JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s??'').trim().replace(/[ 　\s]+/g,'')}
const years=[...new Set(QUESTIONS.flatMap(q=>q.year.split(/[、,，]/).map(x=>x.trim()).filter(Boolean)))].sort();years.forEach(y=>$('year').insertAdjacentHTML('beforeend',`<option>${esc(y)}</option>`));
function basePool(){let p=QUESTIONS.filter(q=>$('type').value==='all'||q.type===$('type').value);if($('year').value!=='all')p=p.filter(q=>q.year.includes($('year').value));let m=$('mode').value;if(m==='wrong')p=p.filter(q=>state[q.id]?.wrong>0);if(m==='unanswered')p=p.filter(q=>!state[q.id]?.attempts);return p}
function updateStats(){const p=basePool(),rec=p.map(q=>state[q.id]||{}),done=rec.filter(x=>x.attempts).length,cor=rec.reduce((a,x)=>a+(x.correct||0),0),att=rec.reduce((a,x)=>a+(x.attempts||0),0);$('pool').textContent=p.length;$('done').textContent=done;$('correct').textContent=cor;$('rate').textContent=att?Math.round(cor/att*100)+'%':'0%'}
function choose(){const p=basePool();if(!p.length){current=null;$('question').innerHTML='<div class="empty">条件に一致する問題がありません。</div>';$('answer').innerHTML='';$('kind').textContent='';$('yr').textContent='';$('qno').textContent='';return}if($('mode').value==='sequential'){current=p[orderIndex%p.length];orderIndex++}else{let cand=p.filter(q=>q.id!==current?.id);if(!cand.length)cand=p;current=cand[Math.floor(Math.random()*cand.length)]}render()}
function render(){judged=false;selected='';$('result').className='result';$('result').innerHTML='';$('question').textContent=current.q;$('kind').textContent=current.type==='fill'?'第一問・穴埋め':'第二問・○×';$('yr').textContent=current.year||'年度不明';const p=basePool();$('qno').textContent=`対象 ${p.indexOf(current)+1} / ${p.length}`;$('judge').textContent='答え合わせ';if(current.type==='tf'){$('answer').innerHTML='<div class="tf"><button type="button" data-v="○">○</button><button type="button" data-v="×">×</button></div>';document.querySelectorAll('.tf button').forEach(b=>b.onclick=()=>{selected=b.dataset.v;document.querySelectorAll('.tf button').forEach(x=>x.classList.toggle('selected',x===b))})}else{$('answer').innerHTML='<div class="fill">'+current.answers.map((_,i)=>`<div class="input-row"><label for="a${i}">解答${i+1}</label><input class="answer-input" id="a${i}" autocomplete="off" spellcheck="false"></div>`).join('')+'</div>';setTimeout(()=>document.querySelector('.answer-input')?.focus(),0)}updateStats()}
function judge(){if(!current)return;if(judged){choose();return}let ok=false,user='';if(current.type==='tf'){if(!selected){$('result').className='result show ng';$('result').innerHTML='<strong>○または×を選択してください。</strong>';return}user=selected;ok=selected===current.answer}else{const vals=current.answers.map((_,i)=>$('a'+i).value);if(vals.some(x=>!norm(x))){$('result').className='result show ng';$('result').innerHTML='<strong>すべての解答欄を入力してください。</strong>';return}user=vals;ok=vals.every((v,i)=>norm(v)===norm(current.answers[i]))}const r=state[current.id]||(state[current.id]={attempts:0,correct:0,wrong:0});r.attempts++;ok?r.correct++:r.wrong++;r.last=Date.now();save();judged=true;const ans=current.type==='tf'?current.answer:current.answers.join(' ／ ');$('result').className='result show '+(ok?'ok':'ng');$('result').innerHTML=`<h3>${ok?'正解です':'不正解です'}</h3><div class="answerline">正解：${esc(ans)}</div>${current.basis?`<div class="basis">根拠：${esc(current.basis)}</div>`:''}${current.explanation?`<div class="explain">${esc(current.explanation)}</div>`:''}`;$('judge').textContent='次の問題';updateStats()}
$('judge').onclick=judge;$('next').onclick=choose;['type','year','mode'].forEach(id=>$(id).onchange=()=>{orderIndex=0;choose()});$('reset').onclick=()=>{if(confirm('回答履歴と正答率をすべてリセットしますか？')){Object.keys(state).forEach(k=>delete state[k]);save();updateStats();choose()}};document.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();judge()}if(current?.type==='tf'&&!judged&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){selected=e.key==='ArrowLeft'?'○':'×';document.querySelectorAll('.tf button').forEach(x=>x.classList.toggle('selected',x.dataset.v===selected))}});choose();
</script></body></html>
