<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会社法対策 一問一答</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#637083;--line:#dce3ed;--navy:#17365d;--blue:#2563eb;--green:#15803d;--red:#c62828;--amber:#b45309;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef3fa,#f8fafc 45%,#edf5ff);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",sans-serif;min-height:100vh}.app{max-width:940px;margin:auto;padding:18px}.top{background:var(--navy);color:#fff;border-radius:18px;padding:20px 24px;box-shadow:0 12px 32px #17365d2d}.top h1{font-size:clamp(22px,4vw,34px);margin:0 0 5px}.top p{margin:0;color:#dbeafe}.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin:14px 0}.toolbar select,.toolbar button,.answer-input{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:11px 12px;font:inherit}.toolbar button{cursor:pointer;font-weight:700}.toolbar button:hover{border-color:#93b4e8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}.stat strong{display:block;font-size:20px;color:var(--navy)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #17203314;padding:clamp(18px,4vw,30px)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tag{background:var(--soft);color:#1d4e89;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700}.qno{margin-left:auto;color:var(--muted);font-weight:700}.question{white-space:pre-wrap;font-size:clamp(17px,2.5vw,22px);line-height:1.85;font-weight:650;margin:0 0 22px}.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tf button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:18px;font-size:25px;font-weight:800;cursor:pointer}.tf button:hover,.tf button.selected{border-color:var(--blue);background:#eff6ff}.fill{display:grid;gap:10px}.input-row{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:8px}.input-row label{font-weight:700;color:var(--muted)}.answer-input:focus{outline:3px solid #bfdbfe;border-color:var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:11px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e8eef7;color:var(--navy)}.result{margin-top:18px;padding:16px;border-radius:13px;display:none;line-height:1.75}.result.show{display:block}.result.ok{background:#ecfdf3;border:1px solid #86efac}.result.ng{background:#fff1f2;border:1px solid #fda4af}.result h3{margin:0 0 8px}.answerline{font-weight:800}.explain{margin-top:12px;padding-top:12px;border-top:1px dashed #aab4c2}.basis{color:#334155;font-weight:700}.empty{text-align:center;color:var(--muted);padding:30px}.footer{color:var(--muted);font-size:12px;text-align:center;margin:14px}@media(max-width:680px){.toolbar{grid-template-columns:1fr 1fr}.toolbar button{grid-column:span 2}.stats{grid-template-columns:1fr 1fr}.qno{margin-left:0;width:100%}.app{padding:10px}.tf button{padding:14px}.input-row{grid-template-columns:1fr}.actions .btn{flex:1}}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#172033;--ink:#edf2f7;--muted:#aab6c8;--line:#334155;--soft:#243b5f}.app{color:var(--ink)}body{background:#0f172a}.toolbar select,.toolbar button,.answer-input,.stat,.tf button{background:#172033;color:var(--ink)}.secondary{background:#334155;color:white}.tf button:hover,.tf button.selected{background:#1e3a5f}.result.ok{background:#123522}.result.ng{background:#3b1720}.basis{color:#d6deea}}
</style></head><body><main class="app"><header class="top"><h1>会社法対策 一問一答</h1><p>穴埋め問題・○×問題をブラウザー上で自動採点</p></header><section class="toolbar" aria-label="出題設定"><select id="type"><option value="all">すべての問題</option><option value="fill">第一問（穴埋め）</option><option value="tf">第二問（○×）</option></select><select id="year"><option value="all">すべての年度</option></select><select id="mode"><option value="random">ランダム</option><option value="sequential">順番</option><option value="wrong">誤答のみ</option><option value="unanswered">未回答のみ</option></select><button type="button" id="reset">学習記録をリセット</button></section><section class="stats"><div class="stat"><strong id="pool">0</strong>対象問題</div><div class="stat"><strong id="done">0</strong>回答済み</div><div class="stat"><strong id="correct">0</strong>正解</div><div class="stat"><strong id="rate">0%</strong>正答率</div></section><article class="card" id="card"><div class="meta"><span class="tag" id="kind"></span><span class="tag" id="yr"></span><span class="qno" id="qno"></span></div><p class="question" id="question"></p><div id="answer"></div><div class="actions"><button type="button" class="btn primary" id="judge">答え合わせ</button><button type="button" class="btn secondary" id="next">次の問題</button></div><div class="result" id="result" aria-live="polite"></div></article><p class="footer">Enter: 答え合わせ／次へ　○×問題は ←・→ キーでも選択できます。学習記録はこのブラウザーに保存されます。</p></main><script>
const QUESTIONS=[{"id":"f1","type":"fill","q":"平成17年改正前商法では、会社は、①を目的とする②であって、商法・有限会社法の規定に従って設立されたものと定義された。ここでいう①とは、会社が対外的活動によって利益を獲得する目的を有するだけでは足りず、その利益を社員に分配することを要すると解するのが通説であったが、新会社法の下でも、株主の③配当請求権と④請求権の少なくともいずれか一方は強行法的に保障されている。一方、新会社法の下では、全ての種類の会社について⑤会社が認められたため、会社を②と位置づけることは困難となった。","answers":["営利","社団法人","剰余金","残余財産分配","一人"],"year":"令和4年、令和7年","basis":"","explanation":""},{"id":"f2","type":"fill","q":"公開会社（指名委員会等設置会社と監査等委員会設置会社を除く。以下同じ。）と指名委員会等設置会社は、いずれも①の設置が強制される。①が業務執行を決定するが、会社を代表して業務執行を行うのは、公開会社では②であるのに対して、指名委員会等設置会社では③である。公開会社では、④の設置が強制されるのに対して、指名委員会等設置会社には④を設置することはできず、その代わりに⑤が設置される。⑤は、３人以上の取締役によって組織され、その過半数は⑥でなければならない。公開会社では、⑦に限り⑧の設置が強制されるが、指名委員会等設置会社では、⑦であると否とにかかわらず、⑧の設置が強制される。","answers":["取締役会","代表取締役","執行役","監査役","監査委員会","社外取締役","大会社","会計監査人"],"year":"令和4年、令和7年","basis":"","explanation":""},{"id":"f3","type":"fill","q":"非公開会社では、取締役は１人でもよく、取締役は①でなければならない旨の定款の定めを置くこともできる。また、非公開会社において②を設置しない場合、③の権限に制限はなく、③は株式会社の組織・運営等一切の事項について決議することのできる万能機関である。非公開会社において②を設置する場合、原則として④の設置が強制されるが、⑤の設置をもって④の設置に代えることができる。また、定款をもって④の権限を⑥に限ることもできる。⑤は取締役と共同して貸借対照表・損益計算書等の⑦を作成する。","answers":["株主","取締役会","株主総会","監査役","会計参与","会計監査","計算書類"],"year":"令和5年","basis":"","explanation":""},{"id":"f4","type":"fill","q":"新会社法の下では、株式会社の①の額は、原則として設立又は新株発行に際して株主となる者が実際に出資した財産の総額であるが、その②分の１以内は①として計上しなくてもよい。①の額は、③と貸借対照表によって公示される。①の額が④円以上の会社では、その規模に応じて利害関係人の保護を強化するため、より厳格な法規制が設けられている。","answers":["資本金","２","登記","５億"],"year":"令和5年","basis":"","explanation":""},{"id":"f5","type":"fill","q":"指名委員会等設置会社は、アメリカ法の機関構成における①モデルに基づき、②の内部組織として、指名委員会・監査委員会・③委員会が設けられるほか、④が②から委任を受けた事項の決定と業務の執行を担当する。各委員会は、⑤で選定された３人以上の取締役によって構成されるが、その過半数は⑥でなければならない。","answers":["モニタリング・ボード","取締役会","報酬","執行役","取締役会","社外取締役"],"year":"令和6年","basis":"","explanation":""},{"id":"f6","type":"fill","q":"株式会社では、貸借対照表・損益計算書などの①の作成が義務づけられ、②・監査役・③を通じてその正確性が担保される。②は定款の定めにより設置でき、取締役と共同して①を作成する。公開会社では監査役の設置を要し、さらに大会社では監査役会と③の設置を要する。②には④・監査法人・⑤又は税理士法人がなることができるのに対し、③は④又は監査法人でなければならない。","answers":["計算書類","会計参与","会計監査人","公認会計士","税理士"],"year":"令和6年","basis":"","explanation":""},{"id":"f7","type":"fill","q":"企業の社会的責任に対する声が高まる中、ステークホルダー①の利益保護が問題となっている。しかし、会社法は私法であるから、社会法的な理念である従業員や消費者の利益保護を盛り込むことは適切でないことから、会社法上保護対象となる①は、会社、社員、取引の相手方、②などと考えられる。前述のとおり、ここでいう「社員」とは従業員の意ではなく、③を意味する。","answers":["利害関係人","会社債権者","出資者"],"year":"","basis":"","explanation":""},{"id":"f8","type":"fill","q":"従来、会社法は商法の一分野に過ぎなかったが、新会社法では、商法が①と②という概念を定めてその適用範囲を画するのに対して、会社の②性を特に問題としておらず、商法からの③性は強くなった。しかし、商法の実質的意義としては、④に特有の生活関係を規律する④法と考えられており、会社も④の一形態である以上、会社法は実質的意義の商法に属するといえる。","answers":["商行為","商人","独自","企業"],"year":"","basis":"","explanation":""},{"id":"f9","type":"fill","q":"会社法は部分的な改正が頻繁に行われたため、会社に関する諸制度との全体的な①性を図る必要があり、②の変化に対応するため、各種制度の見直しをする必要があることから平成17年に抜本的に改正された。しかし、改正手法の多様化により、法制審議会会社法部会の意向と無関係に、③が独自の見解に基づき独断専行したところが少なくないとして問題視されている。","answers":["整合","社会経済情勢","立案担当者"],"year":"","basis":"","explanation":""},{"id":"f10","type":"fill","q":"会社は、会社をめぐる①を単純化するために法人格が認められており、会社の行為に関する②の明確化をするために、③を規定している。③が権限の範囲内でなした行為は会社の行為と評価され、その効果は会社に帰属する。","answers":["法律関係","責任の所在","機関"],"year":"","basis":"","explanation":""},{"id":"f11","type":"fill","q":"旧商法上では、商事会社は①の商人、民事会社は②商人とされていたが、新会社法上は会社の商人性が明らかでない。しかし、会社法６条１項において、会社の名称は、商人が用いる名称でもある③とする、と規定されていたり、商法11条１項において、「商人（会社及び…を除く）」と規定されていたりしており、会社の商人性を前提とした規定は存在する。","answers":["固有","擬制","商号"],"year":"","basis":"","explanation":""},{"id":"f12","type":"fill","q":"新会社法上の会社の種類は、会社法２条１号において、株式会社・①会社・②会社・合同会社と規定されている。旧商法上で存在した③会社は株式会社に吸収される形で廃止となった。","answers":["合名","合資","有限"],"year":"","basis":"","explanation":""},{"id":"f13","type":"fill","q":"新会社法では、第一次的に株式会社と①会社に分類され、社員の責任の態様に応じて、直接無限責任社員で構成される②会社、直接無限責任社員と直接有限責任社員で構成される③会社、④責任である合同会社に分類される。","answers":["持分","合名","合資","間接有限"],"year":"","basis":"","explanation":""},{"id":"f14","type":"fill","q":"新会社法では、相互間の会社形態の変更を弾力化・①したため、②会社において有限責任社員がいなくなった場合でも、解散することなく、③会社として存続することができる。また、度重なる改正によって株式会社の組織の多様化を追認し、④による自治を大幅に認め、株式会社の⑤の多様化を積極的に推進する。このような変化を、株式会社の組織は⑥方式から⑦方式へと表現することもある。","answers":["流動化","合資","合名","定款","機関設計","定食","カフェテリア"],"year":"","basis":"","explanation":""},{"id":"f15","type":"fill","q":"まず、株式の譲渡制限によって①会社と②会社に分類される。②会社は全部の株式につき譲渡が制限される会社であり、従来の③会社に相当する会社として、株主の個性に配慮した法規制が設けられるとともに、④をめぐる法規制が緩和されている。また、資本金額が⑤以上または負債総額⑥以上の会社のことを大会社という。⑦の保護を強化するため、より厳格な法規制が設けられている。","answers":["公開","非公開","有限","機関","5億円","200億円","利害関係人"],"year":"","basis":"","explanation":""},{"id":"f16","type":"fill","q":"平成17年改正前商法における株式会社は、①制度と②の原則を二大原則としていたが、新会社法における株式会社は、①制度と③を二大原則としており、②の原則は③から派生するものと位置づけられる。","answers":["株式","株主間接有限責任","所有と経営の分離"],"year":"令和1年","basis":"","explanation":""},{"id":"f17","type":"fill","q":"株式会社（指名委員会等設置会社と監査等委員会設置会社を除く。）では、①・損益計算書などの②の作成が義務づけられ、③・④・⑤を通じてその正確性が担保される。③は、定款の定めにより設置することができ、取締役と共同して②を作成する。③は、⑥・監査法人・⑦又は⑦法人でなければならない。公開会社では、④の設置を要し、さらに大会社では、⑧と⑤の設置を要する。⑧の構成員の半数以上は⑨でなければならない。⑤は、⑥又は監査法人でなければならない。","answers":["貸借対照表","計算書類","会計参与","監査役","会計監査人","公認会計士","税理士","監査役会","社外監査役"],"year":"令和1年","basis":"","explanation":""},{"id":"f18","type":"fill","q":"指名委員会等設置会社では、株主総会に提出する取締役の選任・解任議案の決定を行う①委員会、取締役・執行役の職務執行の監査等を行う②委員会及び取締役・執行役の報酬の決定を行う③委員会を設置する。各委員会は、④で選定された⑤人以上の取締役によって組織され、その⑥を社外取締役によって構成する必要がある。これに対して、監査等委員会設置会社は、⑦会社と指名委員会等設置会社の中間に位置する機関設計であり、取締役会の中に取締役⑧人以上で組織され、その⑨が社外取締役である監査等委員会を設置する。","answers":["指名","監査","報酬","取締役会","３","過半数","監査役設置","３","過半数"],"year":"","basis":"","explanation":""},{"id":"f19","type":"fill","q":"株式会社において、旧商法上では、零細な株式会社の濫設を防止するため、最低資本金を①万円と定めていた。また、資本②の側面として、出資全部の履行に関する厳格な規制があり、出資は③出資のみとされていた。そして、資本④の側面として、持分払戻の原則的禁止と利益配当の制限が規定されていた。この二つの側面をまとめて、資本②・④の原則という。ほかにも、いったん定められた資本は自由に減少してはならないという、⑤の原則があった。これに対して、新会社法では、⑥を廃止し、理論上資本金０円でも株式会社を設立できるとされる。また、資本②・④の原則も廃止されたとされるが、剰余金分配規制の実効性を担保するものとして、⑦に関する法規制は維持されており、⑥の廃止についても、純資産額⑧万円を基準とした剰余金分配制限があり、⑥の代替的機能を果たしているとされる。","answers":["1,000","充実","財産","維持","資本不変","最低資本金制度","資本金減少","300"],"year":"","basis":"","explanation":""},{"id":"f20","type":"fill","q":"株式会社においては、貸借対照表・①など株式会社の財産及び損益の状況を示す②の作成が義務づけられており、会計参与・監査役・③を通してその正確性が担保される。④は、株式会社の営業時間内であれば、②等の閲覧を請求することができる。さらに、大会社では貸借対照表と①又はその要旨について、いわゆる⑤が義務づけられている。","answers":["損益計算書","計算書類","会計監査人","会社債権者","決算公告"],"year":"","basis":"","explanation":""},{"id":"f21","type":"fill","q":"会社の組織に関する行為や株主総会決議をめぐる①の利益保護・②の確保を目的として、会社の組織に関する行為や株主総会決議を取り消すためには、会社法上特別な訴えによらなければならない。会社法上の訴えの特殊性とは、（１）提訴期間・提訴権者が限定され、（２）無効判決については③が否定されており、請求認容判決は④を持つとされている。","answers":["利害関係人","法的安定性","遡及効","対世効"],"year":"","basis":"","explanation":""},{"id":"f22","type":"fill","q":"新会社法は、アメリカ法上のＬＬＣをモデルとして、①会社という新しい会社形態を導入したが、法人格を有する①会社には税法上の②は認められなかったため、特別法により、イギリス法上のＬＬＰをモデルとして、③が創設された。","answers":["合同","パススルー","有限責任事業組合"],"year":"平成29年","basis":"","explanation":""},{"id":"f23","type":"fill","q":"会社概念の要素としての①性に基づき、株式会社の株主には、②配当請求権と③分配請求権の少なくともいずれか一方は強行法的に保障される。他方で株主は会社債権者に対して④責任を負うにすぎないため、会社債権者を保護するため、株主への会社財産の払戻しとなる②の分配が制限される。株主の投下資本回収方法として⑤の自由が保障されるのも、株主に対する持分の払戻しが認められないからである。","answers":["営利","剰余金","残余財産","間接有限","株式譲渡"],"year":"令和3年","basis":"","explanation":""},{"id":"t1","type":"tf","q":"会社は全て商人であるが、一般社団法人・一般財団法人は商人にはなりえない。","answer":"×","year":"令和4年、令和6年","basis":"会社法５条、商法４条１項","explanation":"結論：×。誤りは「会社は全て商人であるが、一般社団法人・一般財団法人は商人にはなりえない」という結論部分である。正しくは、会社は全て商人ではないが、一般社団法人・一般財団法人は商人にはなりえない。会社法５条、商法４条１項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t2","type":"tf","q":"株主の剰余金配当請求権と残余財産分配請求権は強行法的に保障され、その双方又は一方を株主に与えない旨の定款規定は無効である。","answer":"×","year":"令和5年","basis":"会社法105条２項","explanation":"結論：×。誤りは「株主の剰余金配当請求権と残余財産分配請求権は強行法的に保障され、その双方又は一方を株主に与えない旨の定款規定は無効である」という結論部分である。正しくは、株主の剰余金配当請求権と残余財産分配請求権は強行法的に保障され、その双方又は一方を株主に与えない旨の定款規定は当然に無効となるわけではない。会社法105条２項を確認する。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t3","type":"tf","q":"有限会社法に基づき既に設立された有限会社は、会社法施行後は特別な手続を経ることなく株式会社として存続するため、もはや商号中に有限会社という文字を使用することはできない。","answer":"×","year":"令和5年","basis":"会社法整備法２条・３条","explanation":"結論：×。誤りは「有限会社法に基づき既に設立された有限会社は、会社法施行後は特別な手続を経ることなく株式会社として存続するため、もはや商号中に有限会社という文字を使用することはできない」という結論部分である。正しくは、有限会社法に基づき既に設立された有限会社は、会社法施行後は特別な手続を経ることなく株式会社として存続するため、もはや商号中に有限会社という文字を使用することはできる場合がある。会社法整備法２条・３条を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t4","type":"tf","q":"単元未満株主には議決権はないが、自益権及び議決権を前提としない単独株主権たる共益権は原則として認められる。","answer":"○","year":"令和5年","basis":"会社法189条１項・２項","explanation":"結論：〇。会社法189条１項・２項により、設問の内容でよい。判断の肝は、議決権はないが、他の権利が一律に否定されるわけではない点である。"},{"id":"t5","type":"tf","q":"事業譲受人が議決権を行使し著しく有利な条件の事業譲渡決議が成立した場合、取消原因となり裁量棄却できない。","answer":"○","year":"令和5年","basis":"会社法831条１項３号・２項","explanation":"結論：〇。会社法831条１項３号・２項により、設問の内容でよい。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t6","type":"tf","q":"株式会社では一人会社は認められるが、持分会社では一人会社は認められない。","answer":"×","year":"令和6年","basis":"会社法576条１項４号、641条４号","explanation":"結論：×。誤りは「株式会社では一人会社は認められるが、持分会社では一人会社は認められない」という結論部分である。正しくは、株式会社では一人会社は認められるが、持分会社では一人会社は認められる場合がある。会社法576条１項４号、641条４号を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t7","type":"tf","q":"監査役会決議で監査方針等を定めても、各監査役は必要に応じ独自調査できる。","answer":"○","year":"令和6年","basis":"会社法390条２項ただし書・３項","explanation":"結論：〇。会社法390条２項ただし書・３項により、設問の内容でよい。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t8","type":"tf","q":"単元未満株主は買取請求ができ、定款があれば売渡請求もできる。","answer":"○","year":"令和6年","basis":"会社法192条・194条","explanation":"結論：〇。会社法192条・194条により、設問の内容でよい。判断の肝は、議決権はないが、他の権利が一律に否定されるわけではない点である。"},{"id":"t9","type":"tf","q":"複数議決権の不統一行使は一切できない。","answer":"×","year":"令和6年","basis":"会社法313条","explanation":"結論：×。誤りは「複数議決権の不統一行使は一切できない」という結論部分である。正しくは、複数議決権の不統一行使は一定の場合にはできる。会社法313条を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t10","type":"tf","q":"取締役・監査役の解任はいずれも特別決議事項。","answer":"×","year":"令和6年","basis":"会社法339条１項、341条","explanation":"結論：×。誤りは「取締役・監査役の解任はいずれも特別決議事項」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法339条１項、341条を確認する。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t11","type":"tf","q":"決議方法違反が重大でも決議に影響しないとき裁量棄却できる。","answer":"○","year":"令和6年","basis":"会社法831条１項・２項","explanation":"結論：〇。会社法831条１項・２項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t12","type":"tf","q":"決議内容が法令又は定款に違反する場合は無効。","answer":"×","year":"令和6年","basis":"会社法830条２項、831条１項２号","explanation":"結論：×。誤りは「決議内容が法令又は定款に違反する場合は無効」という結論部分である。正しくは、決議内容が法令又は定款に違反しない場合は無効。会社法830条２項、831条１項２号を確認する。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t13","type":"tf","q":"辞任・任期満了で法定員数を欠く退任取締役は後任就任まで権利義務を有する。","answer":"○","year":"令和6年","basis":"会社法346条１項","explanation":"結論：〇。会社法346条１項により、設問の内容でよい。判断の肝は、短縮と伸長の可否が会社類型・機関ごとに異なる点である。"},{"id":"t14","type":"tf","q":"特別取締役制度により重要使用人選解任や社債募集も決定できる。","answer":"×","year":"令和6年","basis":"会社法373条１項・２項","explanation":"結論：×。誤りは「特別取締役制度により重要使用人選解任や社債募集も決定できる」という結論部分である。正しくは、特別取締役制度により重要使用人選解任や社債募集も決定できない又は要件を満たす場合に限られる。会社法373条１項・２項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t15","type":"tf","q":"特別利害関係株主の議決権行使で著しく不当な決議となった場合、裁量棄却できない。","answer":"○","year":"令和7年","basis":"会社法831条１項３号・２項","explanation":"結論：〇。会社法831条１項３号・２項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t16","type":"tf","q":"無決議の重要業務執行取引は、相手方が知り又は知り得たとき無効である。","answer":"○","year":"令和7年","basis":"会社法362条４項、判例","explanation":"結論：〇。会社法362条４項、判例により、設問の内容でよい。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t17","type":"tf","q":"合名会社では新たに有限責任社員を加入させることにより合資会社となることができ、合資会社において有限責任社員がいなくなった場合でも、解散することなく合名会社として存続することができる。","answer":"○","year":"令和4年","basis":"会社法638条・639条","explanation":"結論：〇。会社法638条・639条により、設問の内容でよい。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t18","type":"tf","q":"合資会社において、有限責任社員全員が退社しても、無限責任社員が2人以上いれば合名会社として存続することができるが、社員が1人しかいなくなった場合には解散する。","answer":"×","year":"令和5年","basis":"会社法576条１項４号、641条４号","explanation":"結論：×。誤りは「合資会社において、有限責任社員全員が退社しても、無限責任社員が2人以上いれば合名会社として存続することができるが、社員が1人しかいなくなった場合には解散する」という結論部分である。正しくは、合資会社において、有限責任社員全員が退社しても、無限責任社員が2人以上いれば合名会社として存続することができない又は要件を満たす場合に限られるが、社員が1人しかいなくなった場合には解散する。会社法576条１項４号、641条４号を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t19","type":"tf","q":"無限責任社員は財産・労務・信用出資ができ、有限責任社員は財産出資に限られる。","answer":"○","year":"令和6年","basis":"会社法576条１項・３項・４項","explanation":"結論：〇。会社法576条１項・３項・４項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t20","type":"tf","q":"株式会社における株主の出資は財産出資に限られるのに対して、持分会社では、無限責任社員と有限責任社員とを問わず、その出資には財産出資のほか労務出資・信用出資も認められる。","answer":"×","year":"令和4年","basis":"会社法576条１項・３項・４項","explanation":"結論：×。誤りは「株式会社における株主の出資は財産出資に限られるのに対して、持分会社では、無限責任社員と有限責任社員とを問わず、その出資には財産出資のほか労務出資・信用出資も認められる」という結論部分である。正しくは、株式会社における株主の出資は財産出資に限られるのに対して、持分会社では、無限責任社員と有限責任社員とを問わず、その出資には財産出資のほか労務出資・信用出資も認められない又は要件を満たす場合に限られる。会社法576条１項・３項・４項を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t21","type":"tf","q":"持分会社において、定款をもって業務執行社員を定めた場合、業務を執行しない社員には会社の業務及び財産の状況に関する調査権が認められる。","answer":"○","year":"令和4年","basis":"会社法592条２項","explanation":"結論：〇。会社法592条２項により、設問の内容でよい。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t22","type":"tf","q":"合名会社と合資会社の設立においては、社員となろうとする者全員で定款を作成するが、株式会社と合同会社の設立においては、発起人が定款を作成する。","answer":"×","year":"令和4年","basis":"会社法638条・639条","explanation":"結論：×。誤りは「合名会社と合資会社の設立においては、社員となろうとする者全員で定款を作成するが、株式会社と合同会社の設立においては、発起人が定款を作成する」という結論部分である。正しくは、合名会社と合資会社の設立においては、社員となろうとする者全員で定款を作成するが、株式会社と合同会社の設立においては、発起人が定款を作成しない。会社法638条・639条を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t23","type":"tf","q":"持分会社の無限責任社員は、定款に別段の定めがない限り業務執行権を有するのに対して、有限責任社員と株式会社の株主は、その地位に基づいて業務執行権を有しない。","answer":"×","year":"令和5年","basis":"会社法590条１項","explanation":"結論：×。誤りは「持分会社の無限責任社員は、定款に別段の定めがない限り業務執行権を有するのに対して、有限責任社員と株式会社の株主は、その地位に基づいて業務執行権を有しない」という結論部分である。正しくは、持分会社の無限責任社員は、定款に別段の定めがない限り業務執行権を有しないのに対して、有限責任社員と株式会社の株主は、その地位に基づいて業務執行権を有しない。会社法590条１項を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t24","type":"tf","q":"株式会社の株主は原則として株式を自由に譲渡できるのに対し、持分会社の社員は他人に持分を譲渡できず、投下資本の回収は退社による持分払戻しに限られる。","answer":"×","year":"令和5年、令和7年","basis":"会社法585条１項・２項、611条","explanation":"結論：×。誤りは「株式会社の株主は原則として株式を自由に譲渡できるのに対し、持分会社の社員は他人に持分を譲渡できず、投下資本の回収は退社による持分払戻しに限られる」という結論部分である。正しくは、株式会社の株主は原則として株式を自由に譲渡できない又は要件を満たす場合に限られるのに対し、持分会社の社員は他人に持分を譲渡できず、投下資本の回収は退社による持分払戻しに限られる。会社法585条１項・２項、611条を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t25","type":"tf","q":"合同会社は法人格を有するため税制上のパススルーは認められないのに対し、有限責任事業組合は法人格を有しないためパススルーが認められる。","answer":"○","year":"令和5年","basis":"会社法575条１項、有限責任事業組合契約法、法人税法","explanation":"結論：〇。会社法575条１項、有限責任事業組合契約法、法人税法により、設問の内容でよい。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t26","type":"tf","q":"株式会社と持分会社を問わず、会社設立には準則主義が採用され、定款作成に始まり設立登記で完了する。","answer":"○","year":"令和5年","basis":"会社法49条・579条","explanation":"結論：〇。会社法49条・579条により、設問の内容でよい。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t27","type":"tf","q":"持分会社社員は任意退社できる場合があるが、他社員を意思に反して退社させることはできない。","answer":"×","year":"令和6年","basis":"会社法606条・607条、859条","explanation":"結論：×。誤りは「持分会社社員は任意退社できる場合があるが、他社員を意思に反して退社させることはできない」という結論部分である。正しくは、持分会社社員は任意退社できる場合があるが、他社員を意思に反して退社させることはできる場合がある。会社法606条・607条、859条を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t28","type":"tf","q":"合同会社の定款は発起人が作成する。","answer":"×","year":"令和6年","basis":"会社法575条１項","explanation":"結論：×。誤りは「合同会社の定款は発起人が作成する」という結論部分である。正しくは、合同会社の定款は発起人が作成しない。会社法575条１項を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t29","type":"tf","q":"会社法上の会社は、株式会社、合名会社、合弁会社、合同会社の4種類である。","answer":"×","year":"令和7年","basis":"会社法２条１号","explanation":"結論：×。誤りは「会社法上の会社は、株式会社、合名会社、合弁会社、合同会社の4種類である」という結論部分である。正しくは、会社法上の会社は、株式会社、合名会社、合弁会社、合同会社の4種類ではない。会社法２条１号を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t30","type":"tf","q":"株式会社と合同会社では決算公告が義務づけられる。","answer":"×","year":"令和7年","basis":"会社法440条１項・４項（持分会社には適用なし）","explanation":"結論：×。誤りは「株式会社と合同会社では決算公告が義務づけられる」という結論部分である。正しくは、株式会社と合同会社では決算公告が常に義務づけられるわけではない。会社法440条１項・４項（持分会社には適用なし）を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t31","type":"tf","q":"合名会社社員は会社が有する抗弁をもって弁済を拒絶できない。","answer":"×","year":"令和7年","basis":"会社法580条２項","explanation":"結論：×。誤りは「合名会社社員は会社が有する抗弁をもって弁済を拒絶できない」という結論部分である。正しくは、合名会社社員は会社が有する抗弁をもって弁済を拒絶できる場合がある。会社法580条２項を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t32","type":"tf","q":"公開会社と非公開会社とを問わず、株主総会は会社に関する一切の事項について決議をすることができる。","answer":"×","year":"令和4年","basis":"会社法295条１項・２項","explanation":"結論：×。誤りは「公開会社と非公開会社とを問わず、株主総会は会社に関する一切の事項について決議をすることができる」という結論部分である。正しくは、公開会社と非公開会社とを問わず、株主総会は会社に関する一切の事項について決議をすることができない又は要件を満たす場合に限られる。会社法295条１項・２項を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t33","type":"tf","q":"公開・非公開を問わず株主総会は会社法及び定款所定の基本的重要事項のみを決議できる。","answer":"×","year":"令和6年","basis":"会社法295条１項・２項","explanation":"結論：×。誤りは「公開・非公開を問わず株主総会は会社法及び定款所定の基本的重要事項のみを決議できる」という結論部分である。正しくは、公開・非公開を問わず株主総会は会社法及び定款所定の基本的重要事項のみを決議できない又は要件を満たす場合に限られる。会社法295条１項・２項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t34","type":"tf","q":"公開・非公開を問わず株主総会は会社に関する一切の事項を決議できる。","answer":"×","year":"令和7年","basis":"会社法295条１項・２項","explanation":"結論：×。誤りは「公開・非公開を問わず株主総会は会社に関する一切の事項を決議できる」という結論部分である。正しくは、公開・非公開を問わず株主総会は会社に関する一切の事項を決議できない又は要件を満たす場合に限られる。会社法295条１項・２項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t35","type":"tf","q":"公開会社では、株主資格と取締役資格が強行法的に分離しているため、株主の中から取締役を選任することはできない。","answer":"×","year":"令和4年","basis":"会社法331条２項","explanation":"結論：×。誤りは「公開会社では、株主資格と取締役資格が強行法的に分離しているため、株主の中から取締役を選任することはできない」という結論部分である。正しくは、公開会社では、株主資格と取締役資格が強行法的に分離しているため、株主の中から取締役を選任することはできる場合がある。会社法331条２項を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t36","type":"tf","q":"公開会社では株主から取締役を選任できない。","answer":"×","year":"令和6年","basis":"会社法331条２項","explanation":"結論：×。誤りは「公開会社では株主から取締役を選任できない」という結論部分である。正しくは、公開会社では株主から取締役を選任できる場合がある。会社法331条２項を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t37","type":"tf","q":"監査役会設置会社では、監査役会を通じて組織的に監査を行うため、各監査役は単独で監査役としての権限を行使することはできない。","answer":"×","year":"令和4年","basis":"会社法390条２項ただし書・３項","explanation":"結論：×。誤りは「監査役会設置会社では、監査役会を通じて組織的に監査を行うため、各監査役は単独で監査役としての権限を行使することはできない」という結論部分である。正しくは、監査役会設置会社では、監査役会を通じて組織的に監査を行うため、各監査役は単独で監査役としての権限を行使することはできる場合がある。会社法390条２項ただし書・３項を確認する。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t38","type":"tf","q":"監査役会設置会社では各監査役は単独で権限を行使できない。","answer":"×","year":"令和7年","basis":"会社法390条２項ただし書・３項","explanation":"結論：×。誤りは「監査役会設置会社では各監査役は単独で権限を行使できない」という結論部分である。正しくは、監査役会設置会社では各監査役は単独で権限を行使できる場合がある。会社法390条２項ただし書・３項を確認する。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t39","type":"tf","q":"株主に対する剰余金の配当には原則として株主総会の決議を要するが、指名委員会等設置会社では、定款で定めれば、取締役会決議をもって剰余金の配当をなし得る。","answer":"○","year":"令和4年","basis":"会社法459条１項４号","explanation":"結論：〇。会社法459条１項４号により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t40","type":"tf","q":"監査等委員会設置会社では、 :"会社法445条１項・２項、911条３項５号","explanation":"結論：〇。会社法445条１項・２項、911条３項５号により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t58","type":"tf","q":"資本金額は定款記載を要し、登記と貸借対照表で公示される。","answer":"×","year":"令和6年","basis":"会社法27条、445条１項、911条３項５号","explanation":"結論：×。誤りは「資本金額は定款記載を要し、登記と貸借対照表で公示される」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法27条、445条１項、911条３項５号を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t59","type":"tf","q":"譲渡不承認の場合、会社は分配可能額の有無にかかわらず対象株式を自ら買い取らなければならない。","answer":"×","year":"令和5年","basis":"会社法140条１項・２項、461条１項１号","explanation":"結論：×。誤りは「譲渡不承認の場合、会社は分配可能額の有無にかかわらず対象株式を自ら買い取らなければならない」という結論部分である。正しくは、譲渡不承認の場合、会社は分配可能額の有無にかかわらず対象株式を自ら買い取らなければなる場合がある。会社法140条１項・２項、461条１項１号を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t60","type":"tf","q":"分配可能額を超える剰余金配当決議について、株主は3か月以内に限り決議無効確認の訴えを提起できる。","answer":"×","year":"令和5年","basis":"会社法461条１項８号、462条（831条の訴えによらない）","explanation":"結論：×。誤りは「分配可能額を超える剰余金配当決議について、株主は3か月以内に限り決議無効確認の訴えを提起できる」という結論部分である。正しくは、分配可能額を超える剰余金配当決議について、株主は3か月以内に限り決議無効確認の訴えを提起できない又は要件を満たす場合に限られる。会社法461条１項８号、462条（831条の訴えによらない）を確認する。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t61","type":"tf","q":"株式会社では剰余金配当が制限されるが、持分会社では利益配当は制限されない。","answer":"×","year":"令和6年","basis":"会社法461条、621条・628条","explanation":"結論：×。誤りは「株式会社では剰余金配当が制限されるが、持分会社では利益配当は制限されない」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法461条、621条・628条を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t62","type":"tf","q":"資本金は原則として出資財産総額であるが300万円以上を要する。","answer":"×","year":"令和7年","basis":"会社法445条１項・２項、911条３項５号","explanation":"結論：×。誤りは「資本金は原則として出資財産総額であるが300万円以上を要する」という結論部分である。正しくは、資本金は原則として出資財産総額であるが300万円以上を常に要するわけではない。会社法445条１項・２項、911条３項５号を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t63","type":"tf","q":"募集設立では発起人は設立時発行株式を引き受けず、全部を募集する。","answer":"×","year":"令和7年","basis":"会社法25条１項２号、57条１項","explanation":"結論：×。誤りは「募集設立では発起人は設立時発行株式を引き受けず、全部を募集する」という結論部分である。正しくは、募集設立では発起人は設立時発行株式を引き受けず、全部を募集しない。会社法25条１項２号、57条１項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t64","type":"tf","q":"単元株式数の減少又は単元株制度の廃止を目的とする定款の変更には、株主総会の特別決議を要しない。","answer":"○","year":"令和4年","basis":"会社法195条１項","explanation":"結論：〇。会社法195条１項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t65","type":"tf","q":"株式会社は会社法の認める範囲内で種類株式を発行することができるが、定款にその株式の内容に関する法定事項及び発行可能総数を定めておかなければならない。","answer":"○","year":"令和4年","basis":"会社法108条１項・２項","explanation":"結論：〇。会社法108条１項・２項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t66","type":"tf","q":"株式会社が特定の株主に対して無償で財産上の利益を供与したときは、株主の権利の行使に関して財産上の利益を供与したものとみなされる。","answer":"○","year":"令和4年","basis":"会社法120条１項・２項・３項","explanation":"結論：〇。会社法120条１項・２項・３項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t67","type":"tf","q":"株式会社が定款を変更して株式譲渡を禁止する定めを設けようとするときは、株主全員の同意を得なければならない。","answer":"×","year":"令和4年","basis":"会社法107条１項１号、309条３項１号","explanation":"結論：×。誤りは「株式会社が定款を変更して株式譲渡を禁止する定めを設けようとするときは、株主全員の同意を得なければならない」という結論部分である。正しくは、株式会社が定款を変更して株式譲渡を禁止する定めを設けようとするときは、株主全員の同意を得なければなる場合がある。会社法107条１項１号、309条３項１号を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t68","type":"tf","q":"株券発行会社であるか否かを問わず、株式譲渡を会社その他の第三者に対抗するには、株主名簿の名義書換えを要する。","answer":"×","year":"令和4年","basis":"会社法130条１項・２項","explanation":"結論：×。誤りは「株券発行会社であるか否かを問わず、株式譲渡を会社その他の第三者に対抗するには、株主名簿の名義書換えを要する」という結論部分である。正しくは、株券発行会社であるか否かを問わず、株式譲渡を会社その他の第三者に対抗するには、株主名簿の名義書換えを常に要するわけではない。会社法130条１項・２項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t69","type":"tf","q":"株券発行会社を含め、第三者対抗にも名義書換えを要する。","answer":"×","year":"令和7年","basis":"会社法130条１項・２項、133条","explanation":"結論：×。誤りは「株券発行会社を含め、第三者対抗にも名義書換えを要する」という結論部分である。正しくは、株券発行会社を含め、第三者対抗にも名義書換えを常に要するわけではない。会社法130条１項・２項、133条を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t70","type":"tf","q":"取締役会設置会社では、定款で定めれば、取締役会決議をもって、市場取引により自己株式を買い受けることができ、市場取引によりその保有する自己株式を売却することができる。","answer":"×","year":"令和4年","basis":"会社法199条～201条（自己株式の処分）","explanation":"結論：×。誤りは「取締役会設置会社では、定款で定めれば、取締役会決議をもって、市場取引により自己株式を買い受けることができ、市場取引によりその保有する自己株式を売却することができる」という結論部分である。正しくは、取締役会設置会社では、定款で定めれば、取締役会決議をもって、市場取引により自己株式を買い受けることができ、市場取引によりその保有する自己株式を売却することができない又は要件を満たす場合に限られる。会社法199条～201条（自己株式の処分）を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t71","type":"tf","q":"株式会社の保有する自己株式の資産性は否定され、自己株式の価額は貸借対照表の純資産の部に控除項目として計上される。","answer":"○","year":"令和4年","basis":"会社計算規則76条２項","explanation":"結論：〇。会社計算規則76条２項により、設問の内容でよい。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t72","type":"tf","q":"自己株式を貸借対照表の資産の部に計上できる。","answer":"×","year":"令和7年","basis":"会社計算規則76条２項","explanation":"結論：×。誤りは「自己株式を貸借対照表の資産の部に計上できる」という結論部分である。正しくは、自己株式を貸借対照表の資産の部に計上できない又は要件を満たす場合に限られる。会社計算規則76条２項を確認する。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t73","type":"tf","q":"A株式会社は、B株式会社の総株主の議決権の70％を保有し、B会社はC株式会社の総株主の議決権の60％を保有している。この場合、C会社は、原則としてA会社の株式及びB会社の株式を取得することはできない。","answer":"○","year":"令和4年","basis":"会社法104条～130条","explanation":"結論：〇。会社法104条～130条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t74","type":"tf","q":"株式会社は、譲渡制限株式の相続人に対して相続により取得した株式を会社に売り渡すよう請求できる旨を定款に定めることができるが、株式売渡請求をするには株主総会の特別決議を要し、その請求は会社が相続があったことを知った日から1年以内にしなければならない。","answer":"○","year":"令和4年","basis":"会社法174条・175条・176条","explanation":"結論：〇。会社法174条・175条・176条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t75","type":"tf","q":"共同相続株式について権利行使者を指定・通知しなければ権利行使できないため、権利行使者でない共同相続人には事情を問わず会社法上の訴えの原告適格がない。","answer":"×","year":"令和5年","basis":"会社法106条、民法252条、判例","explanation":"結論：×。誤りは「共同相続株式について権利行使者を指定・通知しなければ権利行使できないため、権利行使者でない共同相続人には事情を問わず会社法上の訴えの原告適格がない」という結論部分である。正しくは、共同相続株式について権利行使者を指定・通知しなければ権利行使できる場合があるため、権利行使者でない共同相続人には事情を問わず会社法上の訴えの原告適格がない。会社法106条、民法252条、判例を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t76","type":"tf","q":"共同相続株式の権利行使者指定には相続人全員の同意を要する。","answer":"×","year":"令和7年","basis":"会社法106条、民法252条、判例","explanation":"結論：×。誤りは「共同相続株式の権利行使者指定には相続人全員の同意を要する」という結論部分である。正しくは、共同相続株式の権利行使者指定には相続人全員の同意を常に要するわけではない。会社法106条、民法252条、判例を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t77","type":"tf","q":"利益供与に関与した他の取締役は、会社に対し供与利益額について無過失の支払責任を負う。","answer":"×","year":"令和5年","basis":"会社法120条１項・２項・３項","explanation":"結論：×。誤りは「利益供与に関与した他の取締役は、会社に対し供与利益額について無過失の支払責任を負う」という結論部分である。正しくは、利益供与に関与した他の取締役は、会社に対し供与利益額について無過失の支払責任を当然には負わない。会社法120条１項・２項・３項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t78","type":"tf","q":"利益供与に関与した他の取締役は無過失の支払責任を負う。","answer":"×","year":"令和7年","basis":"会社法120条１項・２項・３項","explanation":"結論：×。誤りは「利益供与に関与した他の取締役は無過失の支払責任を負う」という結論部分である。正しくは、利益供与に関与した他の取締役は無過失の支払責任を当然には負わない。会社法120条１項・２項・３項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t79","type":"tf","q":"株券を提示すれば、自らが株主であることを立証しなくても株主名簿の名義書換えを請求できる。","answer":"○","year":"令和5年","basis":"会社法130条１項・２項、133条","explanation":"結論：〇。会社法130条１項・２項、133条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t80","type":"tf","q":"吸収合併・新株予約権行使等の一定事由による新株発行に代え、会社保有の自己株式を移転できる。","answer":"○","year":"令和5年","basis":"会社法２条21号","explanation":"結論：〇。会社法２条21号により、設問の内容でよい。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t81","type":"tf","q":"A社がB社議決権30％を保有する場合、B社はA社株主総会で議決権を行使できない。","answer":"×","year":"令和7年","basis":"会社法308条１項、会社法施行規則67条１項","explanation":"結論：×。誤りは「A社がB社議決権30％を保有する場合、B社はA社株主総会で議決権を行使できない」という結論部分である。正しくは、A社がB社議決権30％を保有する場合、B社はA社株主総会で議決権を行使できる場合がある。会社法308条１項、会社法施行規則67条１項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t82","type":"tf","q":"親会社Aの株式を保有する子会社Bは、A社株主総会で議決権を行使できる。","answer":"×","year":"令和5年","basis":"会社法308条１項","explanation":"結論：×。誤りは「親会社Aの株式を保有する子会社Bは、A社株主総会で議決権を行使できる」という結論部分である。正しくは、親会社Aの株式を保有する子会社Bは、A社株主総会で議決権を行使できない。会社法308条１項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t83","type":"tf","q":"相続人に対する譲渡制限株式売渡請求には特別決議を要し、売渡人たる相続人は議決権を行使できない。","answer":"○","year":"令和5年","basis":"会社法174条・175条・176条","explanation":"結論：〇。会社法174条・175条・176条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t84","type":"tf","q":"相続人への売渡請求の特別決議で売渡人は議決権を行使できない。","answer":"○","year":"令和7年","basis":"会社法174条・175条・176条","explanation":"結論：〇。会社法174条・175条・176条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t85","type":"tf","q":"株主総会の議決権を一切認めない種類株式を発行することはできない。","answer":"×","year":"令和5年","basis":"会社法108条１項３号","explanation":"結論：×。誤りは「株主総会の議決権を一切認めない種類株式を発行することはできない d":"t102","type":"tf","q":"判例によれば、一部の株主に対する招集通知漏れを理由として株主総会決議取消しの訴えを提起できる株主は、招集通知を受けなかった株主に限られる。","answer":"×","year":"令和4年","basis":"会社法831条１項１号、判例","explanation":"結論：×。誤りは「判例によれば、一部の株主に対する招集通知漏れを理由として株主総会決議取消しの訴えを提起できる株主は、招集通知を受けなかった株主に限られる」という結論部分である。正しくは、判例によれば、一部の株主に対する招集通知漏れを理由として株主総会決議取消しの訴えを提起できない又は要件を満たす場合に限られる株主は、招集通知を受けなかった株主に限られる。会社法831条１項１号、判例を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t103","type":"tf","q":"招集通知漏れを理由に取消訴訟を提起できるのは通知を受けなかった株主に限る。","answer":"×","year":"令和7年","basis":"会社法831条１項１号、判例","explanation":"結論：×。誤りは「招集通知漏れを理由に取消訴訟を提起できるのは通知を受けなかった株主に限る」という結論部分である。正しくは、招集通知漏れを理由に取消訴訟を提起できない又は要件を満たす場合に限られるのは通知を受けなかった株主に限る。会社法831条１項１号、判例を確認する。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t104","type":"tf","q":"株主総会決議において定款所定の員数を超える取締役を選任した場合、株主は決議の日から3か月以内に決議無効確認の訴えを提起することができる。","answer":"×","year":"令和4年","basis":"会社法831条１項１号","explanation":"結論：×。誤りは「株主総会決議において定款所定の員数を超える取締役を選任した場合、株主は決議の日から3か月以内に決議無効確認の訴えを提起することができる」という結論部分である。正しくは、株主総会決議において定款所定の員数を超える取締役を選任した場合、株主は決議の日から3か月以内に決議無効確認の訴えを提起することができない又は要件を満たす場合に限られる。会社法831条１項１号を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t105","type":"tf","q":"取締役の解任は、正当な理由があれば株主総会の普通決議をもってすることができるが、正当な理由がなければ株主総会の特別決議を要する。","answer":"×","year":"令和4年","basis":"会社法339条１項・２項、341条","explanation":"結論：×。誤りは「取締役の解任は、正当な理由があれば株主総会の普通決議をもってすることができるが、正当な理由がなければ株主総会の特別決議を要する」という結論部分である。正しくは、取締役の解任は、正当な理由があれば株主総会の普通決議をもってすることができない又は要件を満たす場合に限られるが、正当な理由がなければ株主総会の特別決議を要する。会社法339条１項・２項、341条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t106","type":"tf","q":"株主総会と取締役会のいずれにおいても、株主又は取締役は代理人によって議決権を行使することができる。","answer":"×","year":"令和4年","basis":"会社法310条１項、369条２項・３項","explanation":"結論：×。誤りは「株主総会と取締役会のいずれにおいても、株主又は取締役は代理人によって議決権を行使することができる」という結論部分である。正しくは、株主総会と取締役会のいずれにおいても、株主又は取締役は代理人によって議決権を行使することができない。会社法310条１項、369条２項・３項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t107","type":"tf","q":"判例によれば、取締役会が設置されない会社の取締役が株主総会の承認を受けずに自己又は第三者のために会社の事業の部類に属する取引を行った場合、株主総会の承認を受けていないことにつき取引の相手方が悪意であれば、その取引は無効である。","answer":"×","year":"令和4年","basis":"会社法356条１項１号、365条１項、423条２項","explanation":"結論：×。誤りは「判例によれば、取締役会が設置されない会社の取締役が株主総会の承認を受けずに自己又は第三者のために会社の事業の部類に属する取引を行った場合、株主総会の承認を受けていないことにつき取引の相手方が...」という結論部分である。正しくは、判例によれば、取締役会が設置されない会社の取締役が株主総会の承認を受けずに自己又は第三者のために会社の事業の部類に属する取引を行った場合、株主総会の承認を受けていないことにつき取引の相手方が悪意であれば、その取引は当然に無効となるわけではない。会社法356条１項１号、365条１項、423条２項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t108","type":"tf","q":"取締役に対してストックオプションとして新株予約権を付与するには、取締役の報酬として株主総会決議を要する。","answer":"○","year":"令和4年","basis":"会社法361条１項３号・５号","explanation":"結論：〇。会社法361条１項３号・５号により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t109","type":"tf","q":"代理人を株主に限定する定款は有効だが、特段の事情で適用されない場合がある。","answer":"○","year":"令和7年","basis":"会社法310条１項、判例","explanation":"結論：〇。会社法310条１項、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t110","type":"tf","q":"議決権行使代理人を株主に限定する定款規定は無効である。","answer":"×","year":"令和5年","basis":"会社法310条１項、判例","explanation":"結論：×。誤りは「議決権行使代理人を株主に限定する定款規定は無効である」という結論部分である。正しくは、議決権行使代理人を株主に限定する定款規定は当然に無効となるわけではない。会社法310条１項、判例を確認する。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t111","type":"tf","q":"6か月前から議決権5％を有する株主Aの取締役解任議案が否決された場合、Aは30日以内に解任の訴えを提起できる。","answer":"○","year":"令和5年","basis":"会社法854条１項・２項","explanation":"結論：〇。会社法854条１項・２項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t112","type":"tf","q":"議決権5％を6か月保有する株主は、否決後30日以内に取締役解任の訴えを提起できる。","answer":"○","year":"令和7年","basis":"会社法854条１項","explanation":"結論：〇。会社法854条１項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t113","type":"tf","q":"株主総会は全員同意でも招集手続を省略できないが、取締役会は取締役・監査役全員同意で省略できる。","answer":"×","year":"令和5年","basis":"会社法299条１項、300条","explanation":"結論：×。誤りは「株主総会は全員同意でも招集手続を省略できないが、取締役会は取締役・監査役全員同意で省略できる」という結論部分である。正しくは、株主総会は全員同意でも招集手続を省略できる場合があるが、取締役会は取締役・監査役全員同意で省略できる。会社法299条１項、300条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t114","type":"tf","q":"招集通知漏れが著しい場合は決議不存在原因となり得る。","answer":"○","year":"令和6年","basis":"会社法830条１項、判例","explanation":"結論：〇。会社法830条１項、判例により、設問の内容でよい。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t115","type":"tf","q":"株主総会と取締役会の双方で特別利害関係者は議決権を行使できない。","answer":"×","year":"令和6年","basis":"会社法369条２項、831条１項３号","explanation":"結論：×。誤りは「株主総会と取締役会の双方で特別利害関係者は議決権を行使できない」という結論部分である。正しくは、株主総会と取締役会の双方で特別利害関係者は議決権を行使できる場合がある。会社法369条２項、831条１項３号を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t116","type":"tf","q":"少数株主権は複数株主が持株数等を合算して共同行使できる。","answer":"○","year":"令和7年","basis":"各少数株主権条文、判例","explanation":"結論：〇。各少数株主権条文、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t117","type":"tf","q":"決議無効確認判決確定後は第三者も効力を争えない。","answer":"○","year":"令和7年","basis":"会社法838条","explanation":"結論：〇。会社法838条により、設問の内容でよい。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t118","type":"tf","q":"株主総会では書面決議が認められるが、取締役会では認められない。","answer":"×","year":"令和7年","basis":"会社法319条１項、370条","explanation":"結論：×。誤りは「株主総会では書面決議が認められるが、取締役会では認められない」という結論部分である。正しくは、株主総会では書面決議が認められるが、取締役会では認められる場合がある。会社法319条１項、370条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t119","type":"tf","q":"業績連動報酬は具体的算定方法を定款又は株主総会決議で定める。","answer":"○","year":"令和7年","basis":"会社法361条１項２号","explanation":"結論：〇。会社法361条１項２号により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t120","type":"tf","q":"取締役会設置会社において、重要な財産の処分・譲受、多額の借財、支配人その他の重要な使用人の選任・解任、社債の募集などの重要な業務執行については、取締役の数が6人以上であって、取締役の1人以上が社外取締役である場合、あらかじめ選定した3人以上の特別取締役の決議をもって決定できる旨を定めることができる。","answer":"×","year":"令和4年","basis":"会社法373条１項・２項","explanation":"結論：×。誤りは「取締役会設置会社において、重要な財産の処分・譲受、多額の借財、支配人その他の重要な使用人の選任・解任、社債の募集などの重要な業務執行については、取締役の数が6人以上であって、取締役の1人以上...」という結論部分である。正しくは、取締役会設置会社において、重要な財産の処分・譲受、多額の借財、支配人その他の重要な使用人の選任・解任、社債の募集などの重要な業務執行については、取締役の数が6人以上であって、取締役の1人以上が社外取締役である場合、あらかじめ選定した3人以上の特別取締役の決議をもって決定できる旨を定めることができない又は要件を満たす場合に限られる。会社法373条１項・２項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t121","type":"tf","q":"取締役会設置会社が取締役Aの債務を保証する場合、その保証に関する重要な事実を開示した上で取締役会の承認を受けなければならず、その承認決議においてAは議決権を行使することができない。","answer":"○","year":"令和4年","basis":"会社法356条１項２号・３号、365条１項","explanation":"結論：〇。会社法356条１項２号・３号、365条１項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t122","type":"tf","q":"取締役会決議を経ず代表取締役が招集した株主総会の決議は不存在となる。","answer":"×","year":"令和5年","basis":"会社法295条、309条、831条","explanation":"結論：×。誤りは「取締役会決議を経ず代表取締役が招集した株主総会の決議は不存在となる」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法295条、309条、831条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t123","type":"tf","q":"内部統制システム整備事項は大会社では取締役会の専決事項だが、大会社でなければ取締役へ委任できる。","answer":"○","year":"令和5年","basis":"会社法362条４項６号・５項","explanation":"結論：〇。会社法362条４項６号・５項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t124","type":"tf","q":"大会社の内部統制システム決定を代表取締役に委任できる。","answer":"×","year":"令和7年","basis":"会社法362条４項６号・５項","explanation":"結論：×。誤りは「大会社の内部統制システム決定を代表取締役に委任できる」という結論部分である。正しくは、大会社の内部統制システム決定を代表取締役に委任できない又は要件を満たす場合に限られる。会社法362条４項６号・５項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t125","type":"tf","q":"代表取締役解職の取締役会決議で、対象代表取締役は議決権を行使できない。","answer":"○","year":"令和5年","basis":"会社法369条２項、判例","explanation":"結論：〇。会社法369条２項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t126","type":"tf","q":"代表取締役でない使用人Bに副社長名称を許した場合、相手方が善意無重過失なら会社は責任を負う。","answer":"×","year":"令和5年","basis":"会社法354条、判例","explanation":"結論：×。誤りは「代表取締役でない使用人Bに副社長名称を許した場合、相手方が善意無重過失なら会社は責任を負う」という結論部分である。正しくは、代表取締役でない使用人Bに副社長名称を許した場合、相手方が善意無重過失なら会社は責任を当然には負わない。会社法354条、判例を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t127","type":"tf","q":"無承認競業取引では、取締役又は第三者の利益額が会社損害額とみなされる。","answer":"○","year":"令和5年","basis":"会社法356条１項１号、365条１項、423条２項","explanation":"結論：〇。会社法356条１項１号、365条１項、423条２項により、設問の内容でよい。判断の肝は、競業取引と利益相反取引で承認・責任の規律が異なる点である。"},{"id":"t128","type":"tf","q":"無承認競業取引では得た利益額が会社損害額とみなされる。","answer":"○","year":"令和7年","basis":"会社法356条１項１号、365条１項、423条２項","explanation":"結論：〇。会社法356条１項１号、365条１項、423条２項により、設問の内容でよい。判断の肝は、競業取引と利益相反取引で承認・責任の規律が異なる点である。"},{"id":"t129","type":"tf","q":"利益相反取引に株主全員が同意している場合、取締役会承認を要しない。","answer":"○","year":"令和5年","basis":"会社法356条１項２号・３号、判例","explanation":"結論：〇。会社法356条１項２号・３号、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t130","type":"tf","q":"利益相反取引で土地を売ったA及び承認賛成取締役C・D・Eは、任務懈怠がなかったことを立証すれば免責される。","answer":"×","year":"令和5年","basis":"会社法423条３項、428条１項","explanation":"結論：×。誤りは「利益相反取引で土地を売ったA及び承認賛成取締役C・D・Eは、任務懈怠がなかったことを立証すれば免責される」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法423条３項、428条１項を確認する。判断の肝は、競業取引と利益相反取引で承認・責任の規律が異なる点である。"},{"id":"t131","type":"tf","q":"利益相反取引のA・C・D・Eは任務懈怠がないことを立証しない限り責任を免れない。","answer":"×","year":"令和7年","basis":"会社法423条３項、428条１項","explanation":"結論：×。誤りは「利益相反取引のA・C・D・Eは任務懈怠がないことを立証しない限り責任を免れない」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法423条３項、428条１項を確認する。判断の肝は、競業取引と利益相反取引で承認・責任の規律が異なる点である。"},{"id":"t132","type":"tf","q":"取締役報酬総額を株主総会で定め、配分を取締役会へ委任し、さらに代表取締役へ再委任できる。","answer":"○","year":"令和5年","basis":"会社法361条１項、判例","explanation":"結論：〇。会社法361条１項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t133","type":"tf","q":"取締役の監視義務は取締役会上程事項に限られ、上程外事項の監督懈怠について責任を負わない。","answer":"×","year":"令和5年","basis":"会社法362条２項２号、423条１項、判例","explanation":"結論：×。誤りは「取締役の監視義務は取締役会上程事項に限られ、上程外事項の監督懈怠について責任を負わない」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法362条２項２号、423条１項、判例を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t134","type":"tf","q":"監視義務は取締役会上程事項に限られる。","answer":"×","year":"令和7年","basis":"会社法362条２項２号、423条１項、判例","explanation":"結論：×。誤りは「監視義務は取締役会上程事項に限られる」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法362条２項２号、423条１項、判例を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t135","type":"tf","q":"表見的代表取締役との取引で相手方善意無重過失なら会社は責任を負う。","answer":"○","year":"令和6年","basis":"会社法354条、判例","explanation":"結論：〇。会社法354条、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t136","type":"tf","q":"競業・利益相反取引の取締役会承認は事後承認でもよい。","answer":"○","year":"令和6年","basis":"会社法356条１項２号・３号、365条１項","explanation":"結論：〇。会社法356条１項２号・３号、365条１項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t137","type":"tf","q":"自己のための利益相反取引で会社損害が生じた取締役は無過失でも責任を負う。","answer":"○","year":"令和6年","basis":"会社法356条１項２号・３号、365条１項","explanation":"結論：〇。会社法356条１項２号・３号、365条１項により、設問の内容でよい。判断の肝は、競業取引と利益相反取引で承認・責任の規律が異なる点である。"},{"id":"t138","type":"tf","q":"退職慰労金の決定を基準を示して取締役会に委ねることは許される。","answer":"○","year":"令和6年","basis":"会社法361条１項、判例","explanation":"結論：〇。会社法361条１項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t139","type":"tf","q":"取締役が自己のために会社と利益相反取引を行ったことにより会社に損害が生じた場合、その取締役は、任務懈怠につき帰責性がなくても、会社に対して損害賠償責任を負う。","answer":"○","year":"令和4年","basis":"会社法356条１項２号・３号、365条１項","explanation":"結論：〇。会社法356条１項２号・３号、365条１項により、設問の内容でよい。判断の肝は、競業取引と利益相反取引で承認・責任の規律が異なる点である。"},{"id":"t140","type":"tf","q":"株主が取締役の会社に対する損害賠償責任を追及する代表訴訟を提起する場合、その請求額に応じて納付すべき訴訟手数料は異なる。","answer":"×","year":"令和4年","basis":"会社法847条、民事訴訟費用等に関する法律４条２項","explanation":"結論：×。誤りは「株主が取締役の会社に対する損害賠償責任を追及する代表訴訟を提起する場合、その請求額に応じて納付すべき訴訟手数料は異なる」という結論部分である。正しくは、株主が取締役の会社に対する損害賠償責任を追及する代表訴訟を提起しない場合、その請求額に応じて納付すべき訴訟手数料は異なる。会社法847条、民事訴訟費用等に関する法律４条２項を確認する。判断の肝は、提訴請求、待機期間、持株要件の例外である。"},{"id":"t141","type":"tf","q":"取締役の責任を追及する株主代表訴訟において、会社が被告取締役に補助参加するには、監査役設置会社にあっては各監査役の同意を要する。","answer":"○","year":"令和4年","basis":"会社法849条１項・３項","explanation":"結論：〇。会社法849条１項・３項により、設問の内容でよい。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t142","type":"tf","q":"取締役が重過失による任務懈怠に基づき会社に対して損害賠償責任を負う場合、一定の要件の下で、株主総会の特別決議をもって一定の限度額までその責任を軽減することができる。","answer":"×","year":"令和4年","basis":"会社法425条１項（悪意・重過失がないことが要件）","explanation":"結論：×。誤りは「取締役が重過失による任務懈怠に基づき会社に対して損害賠償責任を負う場合、一定の要件の下で、株主総会の特別決議をもって一定の限度額までその責任を軽減することができる」という結論部分である。正しくは、取締役が重過失による任務懈怠に基づき会社に対して損害賠償責任を負う場合、一定の要件の下で、株主総会の特別決議をもって一定の限度額までその責任を軽減することができない又は要件を満たす場合に限られる。会社法425条１項（悪意・重過失がないことが要件）を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t143","type":"tf","q":"判例によれば、名目的な取締役であっても、代表取締役の業務執行全般につき監視義務を負い、これを悪意又は重過失により怠った場合、その任務懈怠と第三者の損害との間に相当因果関係がある限り、第三者に対する損害賠償責任を免れない。","answer":"○","year":"令和4年","basis":"会社法362条２項２号、423条１項、判例","explanation":"結論：〇。会社法362条２項２号、423条１項、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t144","type":"tf","q":"公開会社の株主代表訴訟は原則として提訴請求から60日待つが、回復不能損害のおそれがあれば直ちに提訴できる。","answer":"○","year":"令和5年","basis":"会社法847条１項～５項","explanation":"結論：〇。会社法847条１項～５項により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t145","type":"tf","q":"代表取締役の責任軽減における最低責任限度額は報酬4年分である。","answer":"×","year":"令和5年","basis":"会社法425条１項","explanation":"結論：×。誤りは「代表取締役の責任軽減における最低責任限度額は報酬4年分である」という結論部分である。正しくは、代表取締役の責任軽減における最低責任限度額は報酬4年分ではない。会社法425条１項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t146","type":"tf","q":"退任取締役が登記残存を承諾していた場合、第三者責任を負うことがある。","answer":"○","year":"令和5年","basis":"会社法908条２項類推、判例","explanation":"結論：〇。会社法908条２項類推、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t147","type":"tf","q":"監査役設置会社が取締役責任を訴訟追及する場合、監査役が代表する。","answer":"○","year":"令和6年","basis":"会社法386条１項","explanation":"結論：〇。会社法386条１項により、設問の内容でよい。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t148","type":"tf","q":"提訴請求後60日以内に会社が不提訴理由を通知すれば株主は代表訴訟を提起できない。","answer":"×","year":"令和6年","basis":"会社法847条１項～５項","explanation":"結論：×。誤りは「提訴請求後60日以内に会社が不提訴理由を通知すれば株主は代表訴訟を提起できない」という結論部分である。正しくは、提訴請求後60日以内に会社が不提訴理由を通知すれば株主は代表訴訟を提起できる場合がある。会社法847条１項～５項を確認する。判断の肝は、提訴請求、待機期間、持株要件の例外である。"},{"id":"t149","type":"tf","q":"意図的放漫経営で会社債権者に損害を与えた取締役は第三者責任を負う。","answer":"○","year":"令和6年","basis":"会社法429条１項、判例","explanation":"結論：〇。会社法429条１項、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t150","type":"tf","q":"取締役が会社との取引で負担した債務も代表訴訟で追及できる。","answer":"○","year":"令和7年","basis":"会社法847条１項、判例","explanation":"結論：〇。会社法847条１項、判例により、設問の内容でよい。判断の肝は、提訴請求、待機期間、持株要件の例外である。"},{"id":"t151","type":"tf","q":"責任軽減議案提出には監査役設置会社では各監査役の同意が必要。","answer":"○","year":"令和7年","basis":"会社法425条３項","explanation":"結論：〇。会社法425条３項により、設問の内容でよい。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t152","type":"tf","q":"計算書類虚偽記載について、取締役は悪意又は重過失の場合に限り第三者責任を負う。","answer":"×","year":"令和7年","basis":"会社法429条２項１号","explanation":"結論：×。誤りは「計算書類虚偽記載について、取締役は悪意又は重過失の場合に限り第三者責任を負う」という結論部分である。正しくは、計算書類虚偽記載について、取締役は悪意又は重過失の場合に限り第三者責任を当然には負わない。会社法429条２項１号を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t153","type":"tf","q":"一般社団法人の社員には、剰余金配当請求権と残余財産分配請求権のいずれも認められないのに対して、株式会社の株主には、剰余金配当請求権と余財産分配請求権のいずれか一方は強行法的に保障される。","answer":"○","year":"平成30年","basis":"一般法人法11条２項、153条３項２号、会社法105条２項","explanation":"結論：〇。一般法人法11条２項、153条３項２号、会社法105条２項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t154","type":"tf","q":"判例では、信用金庫・信用協同組合の商人性を否定している。","answer":"○","year":"","basis":"会社法５条、商法４条、判例","explanation":"結論：〇。会社法５条、商法４条、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t155","type":"tf","q":"合同会社における社員(株主)が負う責任の範囲は間接有限責任であるとされるため、社員(株主)が直接経営に携わることはない。","answer":"×","year":"","basis":"会社法104条～130条","explanation":"結論：×。誤りは「合同会社における社員(株主)が負う責任の範囲は間接有限責任であるとされるため、社員(株主)が直接経営に携わることはない」という結論部分である。正しくは、合同会社における社員(株主)が当然には負わない責任の範囲は間接有限責任であるとされるため、社員(株主)が直接経営に携わることはない。会社法104条～130条を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t156","type":"tf","q":"株式会社とは、不特定多数の者から出資を集めて大規模企業を営むことを可能にするための法的機構を備え、社員(株主)がその地位に基づいて直接経営に携わらない会社形態のことである。","answer":"○","year":"","basis":"会社法104条～130条","explanation":"結論：〇。会社法104条～130条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t157","type":"tf","q":"新会社法において、ある株式会社が別の株式会社の親会社となるためには、必ずその株式会社の総株主の議決権の過半数を保有しなければならないとされている。","answer":"×","year":"","basis":"会社法２条４号、会社法施行規則３条","explanation":"結論：×。誤りは「新会社法において、ある株式会社が別の株式会社の親会社となるためには、必ずその株式会社の総株主の議決権の過半数を保有しなければならないとされている」という結論部分である。正しくは、新会社法において、ある株式会社が別の株式会社の親会社となるためには、必ずその株式会社の総株主の議決権の過半数を保有しなければなる場合があるとされている。会社法２条４号、会社法施行規則３条を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t158","type":"tf","q":"すべての株式会社は定款により会計参与を設置できる。","answer":"○","year":"","basis":"会社法326条２項","explanation":"結論：〇。会社法326条２項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t159","type":"tf","q":"公開会社では、取締役の任期は２年とされており、短縮も伸張もできない。","answer":"×","year":"","basis":"会社法332条１項","explanation":"結論：×。誤りは「公開会社では、取締役の任期は２年とされており、短縮も伸張もできない」という結論部分である。正しくは、公開会社では、取締役の任期は２年とされており、短縮も伸張もできる場合がある。会社法332条１項を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t160","type":"tf","q":"公開会社(指名委員会等設置会社と監査等委員会設置会社を除く。)の取締役の任期は２年、監査役の任期は４年であり、いずれの任期も、定款又は株主総会決議をもって短縮することも伸長することもできない。","answer":"×","year":"令和1年","basis":"会社法332条、336条","explanation":"結論：×。誤りは「公開会社(指名委員会等設置会社と監査等委員会設置会社を除く。)の取締役の任期は２年、監査役の任期は４年であり、いずれの任期も、定款又は株主総会決議をもって短縮することも伸長することもできない」という結論部分である。正しくは、公開会社(指名委員会等設置会社と監査等委員会設置会社を除く。)の取締役の任期は２年、監査役の任期は４年であり、いずれの任期も、定款又は株主総会決議をもって短縮することも伸長することもできる場合がある。会社法332条、336条を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t161","type":"tf","q":"公開会社では、監査役の任期は４年とされており、短縮も伸張もできない。","answer":"○","year":"","basis":"会社法336条１項","explanation":"結論：〇。会社法336条１項により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t162","type":"tf","q":"公開会社と非公開会社とを問わず、定款をもって取締役の資格を株主に限定する旨の定めを置くことはできない。","answer":"×","year":"令和1年","basis":"会社法331条２項","explanation":"結論：×。誤りは「公開会社と非公開会社とを問わず、定款をもって取締役の資格を株主に限定する旨の定めを置くことはできない」という結論部分である。正しくは、公開会社と非公開会社とを問わず、定款をもって取締役の資格を株主に限定する旨の定めを置くことはできる場合がある。会社法331条２項を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t163","type":"tf","q":"非公開会社において監査役が設置される場合、定款をもって監査役の権限を会計監査に限定することができる。","answer":"○","year":"令和1年","basis":"会社法389条１項","explanation":"結論：〇。会社法389条１項により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t164","type":"tf","q":"非公開会社において監査役が設置される場合、定款をもって監査役の権限を業務監査と会計監査のいずれかに限定することができる。","answer":"×","year":"令和3年","basis":"会社法389条１項","explanation":"結論：×。誤りは「非公開会社において監査役が設置される場合、定款をもって監査役の権限を業務監査と会計監査のいずれかに限定することができる」という結論部分である。正しくは、非公開会社において監査役が設置される場合、定款をもって監査役の権限を業務監査と会計監査のいずれかに限定することができない又は要件を満たす場合に限られる。会社法389条１項を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t165","type":"tf","q":"非公開会社のうち、大会社に該当する企業は監査役および会計監査人を置かなければならない。","answer":"○","year":"","basis":"会社法328条２項、327条４項・５項","explanation":"結論：〇。会社法328条２項、327条４項・５項により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t166","type":"tf","q":"非公開会社において、定款上取締役を株主に限定することは可能であるが、取締役の任期は定款で伸長することはできない。","answer":"×","year":"","basis":"会社法332条、336条","explanation":"結論：×。誤りは「非公開会社において、定款上取締役を株主に限定することは可能であるが、取締役の任期は定款で伸長することはできない」という結論部分である。正しくは、非公開会社において、定款上取締役を株主に限定することは可能であるが、取締役の任期は定款で伸長することはできる場合がある。会社法332条、336条を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t167","type":"tf","q":"大会社でない非公開会社では、監査役を置かなくてもよいが、会計監査人を置く場合には監査役も置かなければならない。","answer":"○","year":"平成30年","basis":"会社法327条５項、328条、326条２項","explanation":"結論：〇。会社法327条５項、328条、326条２項により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t168","type":"tf","q":"非公開会社において、株主総会の権限に制限はない。","answer":"○","year":"","basis":"会社法295条、309条、831条","explanation":"結論：〇。会社法295条、309条、831条により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t169","type":"tf","q":"取締役会を設置する非公開会社では、監査役を置かなければならないが、会計参与を置けば、監査役を置かないとすることもできる。","answer":"○","year":"","basis":"会社法362条、369条","explanation":"結論：〇。会社法362条、369条により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t170","type":"tf","q":"株式会社において、監査役は、取締役および使用人等との兼任が禁止されている。","answer":"○","year":"","basis":"会社法335条２項","explanation":"結論：〇。会社法335条２項により、設問の内容でよい。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t171","type":"tf","q":"監査役会設置会社においても、指名委員会等設置会社においても、監査役または監査委員の各過半数は、それぞれ社外監査役または社外取締役でなければならない。","answer":"×","year":"平成29年","basis":"会社法335条３項、400条３項","explanation":"結論：×。誤りは「監査役会設置会社においても、指名委員会等設置会社においても、監査役または監査委員の各過半数は、それぞれ社外監査役または社外取締役でなければならない」という結論部分である。正しくは、監査役会設置会社においても、指名委員会等設置会社においても、監査役または監査委員の各過半数は、それぞれ社外監査役または社外取締役でなければなる場合がある。会社法335条３項、400条３項を確認する。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t172","type":"tf","q":"非公開会社のうち、大会社に該当する株式会社は監査役および会計監査人の設置が強制される。","answer":"○","year":"","basis":"会社法328条２項、327条４項・５項","explanation":"結論：〇。会社法328条２項、327条４項・５項により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t173","type":"tf","q":"大会社でない非公開会社(指名委員会等設置会社、監査等委員会設置会社を除く)では、監査役を置かなくてもよいが、会計監査人を置く場合には監査役も置かなければならない。","answer":"○","year":"","basis":"会社法327条５項、328条、326条２項","explanation":"結論：〇。会社法327条５項、328条、326条２項により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t174","type":"tf","q":"取締役会設置会社である非公開会社(監査等委員会設置会社及び指名委員会等設置会社を除く)では、監査役の設置が強制されるが、会計参与による代替が可能である。","answer":"○","year":"","basis":"会社法362条、369条","explanation":"結論：〇。会社法362条、369条により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t175","type":"tf","q":"指名委員会等設置会社では、執行と監督の分離を徹底するため、取締役が執行役を兼ねることはできない。","answer":"×","year":"","basis":"会社法402条６項（兼任可）、415条","explanation":"結論：×。誤りは「指名委員会等設置会社では、執行と監督の分離を徹底するため、取締役が執行役を兼ねることはできない」という結論部分である。正しくは、指名委員会等設置会社では、執行と監督の分離を徹底するため、取締役が執行役を兼ねることはできる場合がある。会社法402条６項（兼任可）、415条を確認する。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t176","type":"tf","q":"指名委員会等設置会社の取締役会は、法定の専決事項を除き、重要な業務執行であっても、その決定を執行役に委任することができるが、重要でない業務執行であっても、その決定を取締役に委任することはできない。","answer":"○","year":"平成29年","basis":"会社法399条の13第６項、416条４項","explanation":"結論：〇。会社法399条の13第６項、416条４項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t177","type":"tf","q":"大会社でない指名委員会等設置会社は、会計監査人を置かないことができる。","answer":"×","year":"平成29年","basis":"会社法327条５項","explanation":"結論：×。誤りは「大会社でない指名委員会等設置会社は、会計監査人を置かないことができる」という結論部分である。正しくは、大会社でない指名委員会等設置会社は、会計監査人を置かないことができない又は要件を満たす場合に限られる。会社法327条５項を確認する。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t178","type":"tf","q":"指名委員会等設置会社の取締役は、執行役を兼ねることはできるが、使用人を兼ねることはできない。","answer":"○","year":"令和1年","basis":"会社法402条６項、415条","explanation":"結論：〇。会社法402条６項、415条により、設問の内容でよい。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t179","type":"tf","q":"指名委員会等設置会社の取締役会は、法定の専決事項を除き、重要な業務執行であっても、その決定を執行役に委任することができるが、監査等委員会設置会社では、取締役の過半数が社外取締役である場合又は定款で定めた場合に限り、法定の専決事項を除き、重要な業務執行の決定を取締役に委任することができる。","answer":"○","year":"令和1年","basis":"会社法399条の13第６項、416条４項","explanation":"結論：〇。会社法399条の13第６項、416条４項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t180","type":"tf","q":"取締役会設置会社(指名委員会等設置会社と監査等委員会設置会社を除く。)では、重要な業務執行の決定を取締役に委任することはできないが、監査等委員会設置会社では、取締役の過半数が社外取締役である場合又は定款で定めた場合に限り、一定の事項を除く重要な業務執行の決定を取締役に委任することができる。","answer":"○","year":"令和3年","basis":"会社法399条の13第６項、416条４項","explanation":"結論：〇。会社法399条の13第６項、416条４項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t181","type":"tf","q":"指名委員会等設置会社と監査等委員会設置会社では、監査役を置くことはできない。","answer":"○","year":"平成29年","basis":"会社法327条４項","explanation":"結論：〇。会社法327条４項により、設問の内容でよい。判断の肝は、各機関設計で設置義務・権限が異なる点である。"},{"id":"t182","type":"tf","q":"株式会社の資本金額は、原則として設立または新株発行に際して株主が実際に出資した財産の総額であるが、300万円以上であることを要する。","answer":"×","year":"平成29年、令和3年","basis":"会社法445条１項・２項","explanation":"結論：×。誤りは「株式会社の資本金額は、原則として設立または新株発行に際して株主が実際に出資した財産の総額であるが、300万円以上であることを要する」という結論部分である。正しくは、株式会社の資本金額は、原則として設立または新株発行に際して株主が実際に出資した財産の総額であるが、300万円以上であることを常に要するわけではない。会社法445条１項・２項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t183","type":"tf","q":"株式会社では、貸借対照表・損益計算書など会社の財産及び損益の状況を示す計算書類の作成が義務づけられ、会社債権者はこれらの計算書類を閲覧することができる。","answer":"○","year":"平成30年","basis":"会社法442条３項","explanation":"結論：〇。会社法442条３項により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t184","type":"tf","q":"会社法上の訴えについて、提訴期間や提訴権者は限定されており、無効判決については遡及効が否定されている。","answer":"○","year":"","basis":"会社法838条・839条","explanation":"結論：〇。会社法838条・839条により、設問の内容でよい。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t185","type":"tf","q":"合同会社と有限責任事業組合のいずれも、税制上のパススルー(構成員課税)が認められる。","answer":"×","year":"令和3年","basis":"法人税法２条、有限責任事業組合契約法（税法上の取扱い）","explanation":"結論：×。誤りは「合同会社と有限責任事業組合のいずれも、税制上のパススルー(構成員課税)が認められる」という結論部分である。正しくは、合同会社と有限責任事業組合のいずれも、税制上のパススルー(構成員課税)が認められない又は要件を満たす場合に限られる。法人税法２条、有限責任事業組合契約法（税法上の取扱い）を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t186","type":"tf","q":"株式会社では、株主はその地位に基づいて業務執行権を有することはないのに対して、持分会社では、定款に別段の定めがない限り、社員はその地位に基づいて業務執行権を有する。","answer":"○","year":"平成29年","basis":"会社法590条１項","explanation":"結論：〇。会社法590条１項により、設問の内容でよい。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t187","type":"tf","q":"合同会社における社員が負う責任は間接有限責任であるとされ、直接経営に携わることはない。","answer":"×","year":"","basis":"会社法575条以下","explanation":"結論：×。誤りは「合同会社における社員が負う責任は間接有限責任であるとされ、直接経営に携わることはない」という結論部分である。正しくは、合同会社における社員が当然には負わない責任は間接有限責任であるとされ、直接経営に携わることはない。会社法575条以下を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t188","type":"tf","q":"合名会社の社員が会社債権者から会社債務につき弁済責任を追及された場合、会社が会社債権者に対して弁済を拒絶しうる抗弁事由を有していたとしても、社員は弁済責任の履行を拒むことはできない。","answer":"×","year":"平成30年","basis":"会社法575条以下","explanation":"結論：×。誤りは「合名会社の社員が会社債権者から会社債務につき弁済責任を追及された場合、会社が会社債権者に対して弁済を拒絶しうる抗弁事由を有していたとしても、社員は弁済責任の履行を拒むことはできない」という結論部分である。正しくは、合名会社の社員が会社債権者から会社債務につき弁済責任を追及された場合、会社が会社債権者に対して弁済を拒絶しうる抗弁事由を有していたとしても、社員は弁済責任の履行を拒むことはできる場合がある。会社法575条以下を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t189","type":"tf","q":"持分会社では、会社の存立に関わる基本的重要事項(定款変更・解散等)については、社員(業務執行社員)の過半数の同意によって決定する。","answer":"×","year":"","basis":"会社法637条、641条","explanation":"結論：×。誤りは「持分会社では、会社の存立に関わる基本的重要事項(定款変更・解散等)については、社員(業務執行社員)の過半数の同意によって決定する」という結論部分である。正しくは、持分会社では、会社の存立に関わる基本的重要事項(定款変更・解散等)については、社員(業務執行社員)の過半数の同意によって決定しない。会社法637条、641条を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t190","type":"tf","q":"持分会社の社員は、他の社員の意思いかんにかかわらず自ら退社することができるが、理由のいかんを問わず他の社員をその意思に反して退社させることはできない。","answer":"×","year":"令和1年","basis":"会社法606条・607条、859条","explanation":"結論：×。誤りは「持分会社の社員は、他の社員の意思いかんにかかわらず自ら退社することができるが、理由のいかんを問わず他の社員をその意思に反して退社させることはできない」という結論部分である。正しくは、持分会社の社員は、他の社員の意思いかんにかかわらず自ら退社することができるが、理由のいかんを問わず他の社員をその意思に反して退社させることはできる場合がある。会社法606条・607条、859条を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t191","type":"tf","q":"会社と一般社団法人はいずれも、その設立(法人格の付与)について準則主義がとられている。","answer":"○","year":"令和1年","basis":"会社法49条・579条、一般法人法22条","explanation":"結論：〇。会社法49条・579条、一般法人法22条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t192","type":"tf","q":"定款の作成によって法人格を取得し、会社として成立する。","answer":"×","year":"","basis":"会社法49条、579条","explanation":"結論：×。誤りは「定款の作成によって法人格を取得し、会社として成立する」という結論部分である。正しくは、定款の作成によって法人格を取得し、会社として成立しない。会社法49条、579条を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t193","type":"tf","q":"合同会社の設立に際する出資については、定款上で債権的に確保されれば足り、設立段階で出資の履行を強制する必要はない。","answer":"×","year":"","basis":"会社法578条","explanation":"結論：×。誤りは「合同会社の設立に際する出資については、定款上で債権的に確保されれば足り、設立段階で出資の履行を強制する必要はない」という結論部分である。正しくは、合同会社の設立に際する出資については、定款上で債権的に確保されれば足り、設立段階で出資の履行を強制する必要がある。会社法578条を確認する。判断の肝は、社員の責任、業務執行、退社・持分譲渡の規律が会社類型で異なる点である。"},{"id":"t194","type":"tf","q":"株式会社で発起設立を行う場合、創立総会を開かなければならない。","answer":"×","year":"","basis":"会社法65条１項","explanation":"結論：×。誤りは「株式会社で発起設立を行う場合、創立総会を開かなければならない」という結論部分である。正しくは、株式会社で発起設立を行う場合、創立総会を開かなければなる場合がある。会社法65条１項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t195","type":"tf","q":"発起設立と募集設立とを問わず、出資の履行が完了した後、創立総会を招集することを要する。","answer":"×","year":"令和3年","basis":"会社法65条１項","explanation":"結論：×。誤りは「発起設立と募集設立とを問わず、出資の履行が完了した後、創立総会を招集することを要する」という結論部分である。正しくは、発起設立と募集設立とを問わず、出資の履行が完了した後、創立総会を招集することを常に要するわけではない。会社法65条１項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t196","type":"tf","q":"数人の相続人が株式を共同相続した場合、権利行使者を指定して株式会社に通知しなければ、株主としての権利を行使することはできないが、会社が同意すれば、相続人全員が株主としての権利を共同行使することができる。","answer":"○","year":"平成29年、令和3年","basis":"会社法106条ただし書","explanation":"結論：〇。会社法106条ただし書により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t197","type":"tf","q":"数人の相続人が株式を共同相続した場合、権利行使者を指定して株式会社に通知しなければ、株主としての権利を行使することはできないため、権利行使者ではない共同相続人には、事情の如何を問わず、会社法上の訴えの原告適格は認められない。","answer":"×","year":"平成30年、令和5年","basis":"会社法106条、民法252条、判例","explanation":"結論：×。誤りは「数人の相続人が株式を共同相続した場合、権利行使者を指定して株式会社に通知しなければ、株主としての権利を行使することはできないため、権利行使者ではない共同相続人には、事情の如何を問わず、会社法...」という結論部分である。正しくは、数人の相続人が株式を共同相続した場合、権利行使者を指定して株式会社に通知しなければ、株主としての権利を行使することはできる場合があるため、権利行使者ではない共同相続人には、事情の如何を問わず、会社法上の訴えの原告適格は認められない。会社法106条、民法252条、判例を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t198","type":"tf","q":"判例によれば、会社が共有者たる共同相続人の１人による権利行使を認めることができるかについて、特段の事情があるときは、例外的に共有者の一部につき会社法上の訴えの原告適格が認められるとした。","answer":"○","year":"","basis":"会社法106条、民法252条、判例","explanation":"結論：〇。会社法106条、民法252条、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t199","type":"tf","q":"剰余金配当決議によって配当金額が確定しても、株主は株式と切り離して剰余金配当請求権を譲渡することはできない。","answer":"×","year":"令和1年","basis":"会社法454条・457条、民法466条","explanation":"結論：×。誤りは「剰余金配当決議によって配当金額が確定しても、株主は株式と切り離して剰余金配当請求権を譲渡することはできない」という結論部分である。正しくは、剰余金配当決議によって配当金額が確定しても、株主は株式と切り離して剰余金配当請求権を譲渡することはできる場合がある。会社法454条・457条、民法466条を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t200","type":"tf","q":"自益権とは会社の経営に関与する権利であり、共益権とは、会社から経済的利益を受ける権利である。","answer":"×","year":"","basis":"会社法105条１項、学説","explanation":"結論：×。誤りは「自益権とは会社の経営に関与する権利であり、共益権とは、会社から経済的利益を受ける権利である」という結論部分である。正しくは、自益権とは会社の経営に関与する権利であり、共益権とは、会社から経済的利益を受ける権利ではない。会社法105条１項、学説を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t201","type":"tf","q":"判例によれば、株式の共有者が権利行使者を定めるには、共有者全員の同意を要する。","answer":"×","year":"令和1年","basis":"会社法106条、民法252条、判例","explanation":"結論：×。誤りは「判例によれば、株式の共有者が権利行使者を定めるには、共有者全員の同意を要する」という結論部分である。正しくは、判例によれば、株式の共有者が権利行使者を定めるには、共有者全員の同意を常に要するわけではない。会社法106条、民法252条、判例を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t202","type":"tf","q":"所有権における収益権能に相当するものが自益権、使用・処分の権能に相当するものが共益権である。","answer":"○","year":"","basis":"会社法105条１項、学説","explanation":"結論：〇。会社法105条１項、学説により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t203","type":"tf","q":"株主権は所有権が団体法的に変容したものであり、物権でも債権でもない特殊な財産権である。","answer":"○","year":"","basis":"会社法105条１項、学説","explanation":"結論：〇。会社法105条１項、学説により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t204","type":"tf","q":"少数株主権は、数人の株主の有する議決権数または持株数の合計がその要件を満たす場合には、その数人の株主が共同して行使することもできる。","answer":"○","year":"令和3年、平成29年","basis":"会社法104条～130条","explanation":"結論：〇。会社法104条～130条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t205","type":"tf","q":"少数株主権の行使としてなされる訴えにおいて、原告株主は訴訟提起時に所定の議決権保有比率又は持株比率を維持しておけばよい。","answer":"×","year":"","basis":"各訴権条文、判例（提訴後の持株要件）","explanation":"結論：×。誤りは「少数株主権の行使としてなされる訴えにおいて、原告株主は訴訟提起時に所定の議決権保有比率又は持株比率を維持しておけばよい」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。各訴権条文、判例（提訴後の持株要件）を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t206","type":"tf","q":"少数株主権の行使としてなされる訴えにおいて、新株発行などにより株主自ら意思によらず持株比率が低下した場合では、特段の事情の事情がない限り、原告適格を失うことはない。","answer":"×","year":"","basis":"各訴権条文、判例（提訴後の持株要件）","explanation":"結論：×。誤りは「少数株主権の行使としてなされる訴えにおいて、新株発行などにより株主自ら意思によらず持株比率が低下した場合では、特段の事情の事情がない限り、原告適格を失うことはない」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。各訴権条文、判例（提訴後の持株要件）を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t207","type":"tf","q":"株主の代表訴訟提起権・総会招集請求権など一定の権利を行使するためには、６ヶ月前から引き続き株式を保有していることが要求されるが、非公開会社ではこのような株式保有期間の制限は課されない。","answer":"○","year":"平成30年","basis":"会社法297条・847条","explanation":"結論：〇。会社法297条・847条により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t208","type":"tf","q":"株式会社は、定款をもって、一定数の株式を一単元の株式とする旨を定めることができ、この場合、一単元の株式につき一個の議決権が認められ、単元未満株式には議決権をはじめとする一切の共益権が認められない。","answer":"×","year":"令和1年","basis":"会社法189条１項・２項","explanation":"結論：×。誤りは「株式会社は、定款をもって、一定数の株式を一単元の株式とする旨を定めることができ、この場合、一単元の株式につき一個の議決権が認められ、単元未満株式には議決権をはじめとする一切の共益権が認められ...」という結論部分である。正しくは、株式会社は、定款をもって、一定数の株式を一単元の株式とする旨を定めることができ、この場合、一単元の株式につき一個の議決権が認められ、単元未満株式には議決権をはじめとする一切の共益権が認められる場合がある。会社法189条１項・２項を確認する。判断の肝は、議決権はないが、他の権利が一律に否定されるわけではない点である。"},{"id":"t209","type":"tf","q":"単元未満株式であっても、議決権は認められる。","answer":"×","year":"","basis":"会社法189条１項・２項","explanation":"結論：×。誤りは「単元未満株式であっても、議決権は認められる」という結論部分である。正しくは、単元未満株式であっても、議決権は認められない又は要件を満たす場合に限られる。会社法189条１項・２項を確認する。判断の肝は、議決権はないが、他の権利が一律に否定されるわけではない点である。"},{"id":"t210","type":"tf","q":"単元未満株主は、定款の定めがなくても、その有する単元未満株式を買い取るよう会社に請求することができるほか、定款の定めがあれば、その有する単元未満株式の数と併せて一単元の株式数となる数の株式を売り渡すよう会社に請求することができる。","answer":"○","year":"令和3年","basis":"会社法104条～130条","explanation":"結論：〇。会社法104条～130条により、設問の内容でよい。判断の肝は、議決権はないが、他の権利が一律に否定されるわけではない点である。"},{"id":"t211","type":"tf","q":"単元未満株主が、その有する単元未満株式の数と併せて一単元の株式数となる数の数式を売り渡すよう会社に請求するためには、定款の定めが必要となる。","answer":"○","year":"平成29年","basis":"会社法104条～130条","explanation":"結論：〇。会社法104条～130条により、設問の内容でよい。判断の肝は、議決権はないが、他の権利が一律に否定されるわけではない点である。"},{"id":"t212","type":"tf","q":"公開会社と非公開会社とを問わず、株主の議決権を１人につき１個とする旨の定款の定めを置くことはできない。","answer":"×","year":"平成29年、令和3年","basis":"会社法104条～130条","explanation":"結論：×。誤りは「公開会社と非公開会社とを問わず、株主の議決権を１人につき１個とする旨の定款の定めを置くことはできない」という結論部分である。正しくは、公開会社と非公開会社とを問わず、株主の議決権を１人につき１個とする旨の定款の定めを置くことはできる場合がある。会社法104条～130条を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t213","type":"tf","q":"会社法 108 条１項各号に定める種類株式のうち、複数の種類の株式を組み合わせて発行することは禁止されている。","answer":"×","year":"","basis":"会社法108条１項","explanation":"結論：×。誤りは「会社法 108 条１項各号に定める種類株式のうち、複数の種類の株式を組み合わせて発行することは禁止されている」という結論部分である。正しくは、会社法 108 条１項各号に定める種類株式のうち、複数の種類の株式を組み合わせて発行することは禁止されているとは限らない。会社法108条１項を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t214","type":"tf","q":"A 株式会社は、総会屋たる株主 B が株主総会における発言を控えてその議事進行に協力してくれた謝礼として、A 社の計算において、B の妻 C に対して金銭を支払った。この場合、C は受け取った金銭をA 社に返還しなければならない。","answer":"○","year":"平成29年、平成30年","basis":"会社法120条１項・２項・３項","explanation":"結論：〇。会社法120条１項・２項・３項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t215","type":"tf","q":"判例によれば、株主の取扱いが持株数に比例していない株主優待制度は、株主平等の原則に違反し無効である。","answer":"×","year":"令和1年","basis":"会社法109条１項、判例","explanation":"結論：×。誤りは「判例によれば、株主の取扱いが持株数に比例していない株主優待制度は、株主平等の原則に違反し無効である」という結論部分である。正しくは、判例によれば、株主の取扱いが持株数に比例していない株主優待制度は、株主平等の原則に違反し当然に無効となるわけではない。会社法109条１項、判例を確認する。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t216","type":"tf","q":"株式会社は、株式振替制度利用会社に限り、株券を発行しなくてもよい。","answer":"×","year":"平成30年","basis":"会社法214条・215条","explanation":"結論：×。誤りは「株式会社は、株式振替制度利用会社に限り、株券を発行しなくてもよい」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法214条・215条を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t217","type":"tf","q":"株券は定款に定めがある場合に限り発行することができ、株券を発行する旨の定款の定めがある場合、公開会社では株式成立後遅滞なく株券を発行しなければならないが、非公開会社では株主からの請求があるまでは株券を発行しなくてもよい。","answer":"○","year":"令和1年","basis":"会社法214条・215条","explanation":"結論：〇。会社法214条・215条により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t218","type":"tf","q":"振替株式に係る株主名簿の名義書換は、振替機関から会社に対し総株主通知がされた場合には行われるが、振替機関から会社に対し個別株主通知がされた場合には行われない。","answer":"○","year":"令和1年","basis":"会社法130条１項・２項、133条","explanation":"結論：〇。会社法130条１項・２項、133条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t219","type":"tf","q":"株主が会社に対して個別的に監督是正権を行使する場合、振替機関からの個別株主通知が必要である。","answer":"○","year":"","basis":"社債株式等振替法151条・154条","explanation":"結論：〇。社債株式等振替法151条・154条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t220","type":"tf","q":"株券発行前の株式譲渡の制限は譲渡当事者間及び対会社関係において有効な絶対効を持つ。","answer":"×","year":"","basis":"会社法128条２項、判例","explanation":"結論：×。誤りは「株券発行前の株式譲渡の制限は譲渡当事者間及び対会社関係において有効な絶対効を持つ」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法128条２項、判例を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t221","type":"tf","q":"株券発行前の株式譲渡の原則的効力と株式会社の承認を欠く譲渡制限株式の譲渡の原則的効力(判例の立場による)は、同じである","answer":"○","year":"平成29年","basis":"会社法128条２項、判例","explanation":"結論：〇。会社法128条２項、判例により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t222","type":"tf","q":"株式会社が市場における取引により自己株式を有償取得するには、定款に別段の定めのない限り、株主総会の普通決議を持って足りるが、特定の株主から相対取引で自己株式を有償取得するには、株主総会の特別決議を要し、その際その特定の株主は議決権を行使することはできない。","answer":"○","year":"平成29年、令和3年","basis":"会社法156条１項、160条１項・４項、309条２項２号","explanation":"結論：〇。会社法156条１項、160条１項・４項、309条２項２号により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t223","type":"tf","q":"自己株式を、1譲渡制限株式の譲渡不承認を条件とする買取請求に応じて取得する場合、2全部取得条項付種類株式を取得する場合、3譲渡制限株式の相続人等に対する株式売渡請求に基づいて取得する場合は、特別決議が必要である。","answer":"○","year":"","basis":"会社法140条２項、171条１項、175条１項","explanation":"結論：〇。会社法140条２項、171条１項、175条１項により、設問の内容でよい。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t224","type":"tf","q":"自己株式の取得によって株主に対して交付する金銭等の帳簿価額が分配可能額を超えた場合は、譲渡人に過失責任、取締役等は立証責任の転換された無過失責任が課される。","answer":"×","year":"","basis":"会社法462条１項","explanation":"結論：×。誤りは「自己株式の取得によって株主に対して交付する金銭等の帳簿価額が分配可能額を超えた場合は、譲渡人に過失責任、取締役等は立証責任の転換された無過失責任が課される」という結論部分である。正しくは、自己株式の取得によって株主に対して交付しない金銭等の帳簿価額が分配可能額を超えた場合は、譲渡人に過失責任、取締役等は立証責任の転換された無過失責任が課される。会社法462条１項を確認する。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t225","type":"tf","q":"取得事由のいかんを問わず、株式会社が自己株式を有償取得する場合、その対価の総額は剰余金の額から一定の項目を控除して算出された分配可能額を限度とする。","answer":"×","year":"令和1年","basis":"会社法461条１項（適用除外あり）","explanation":"結論：×。誤りは「取得事由のいかんを問わず、株式会社が自己株式を有償取得する場合、その対価の総額は剰余金の額から一定の項目を控除して算出された分配可能額を限度とする」という結論部分である。正しくは、取得事由のいかんを問わず、株式会社が自己株式を有償取得する場合、その対価の総額は剰余金の額から一定の項目を控除して算出された分配可能額を限度としない。会社法461条１項（適用除外あり）を確認する。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t226","type":"tf","q":"会社が株主との合意により自己株式を有償取得するには、原則として株主総会の決議を要するが、取締役会設置会社にあっては、市場取引又は公開買付の方法による自己株式の取得について取締役会決議をもってなしうる旨を定款で定めることができる。","answer":"○","year":"令和1年","basis":"会社法165条２項、199条以下","explanation":"結論：〇。会社法165条２項、199条以下により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t227","type":"tf","q":"自己株式の処分は株式譲渡であり、株券の交付が効力要件となる。","answer":"×","year":"","basis":"会社法199条以下","explanation":"結論：×。誤りは「自己株式の処分は株式譲渡であり、株券の交付が効力要件となる」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法199条以下を確認する。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t228","type":"tf","q":"自己株式上の共益権は原則としてすべて停止し、また自己株式は、取締役会の決議をもって消却できる。","answer":"○","year":"","basis":"会社法308条２項、453条","explanation":"結論：〇。会社法308条２項、453条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t229","type":"tf","q":"公開会社及び非公開会社では、原則として取締役会の決議をもって自己株式を処分(売却)することができる。","answer":"×","year":"","basis":"会社法295条、309条、831条","explanation":"結論：×。誤りは「公開会社及び非公開会社では、原則として取締役会の決議をもって自己株式を処分(売却)することができる」という結論部分である。正しくは、公開会社及び非公開会社では、原則として取締役会の決議をもって自己株式を処分(売却)することができない又は要件を満たす場合に限られる。会社法295条、309条、831条を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t230","type":"tf","q":"吸収合併・新株予約権の行使など一定の事由に基づき新株を発行する場合、新株発行に代えて会社の保有する自己株式を新株主に移転することができる。","answer":"○","year":"令和5年","basis":"会社法２条21号","explanation":"結論：〇。会社法２条21号により、設問の内容でよい。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t231","type":"tf","q":"株式会社は、その保有する自己株式及び親会社の株式について、剰余金を配当することはできない。","answer":"×","year":"平成30年","basis":"会社法453条、454条３項","explanation":"結論：×。誤りは「株式会社は、その保有する自己株式及び親会社の株式について、剰余金を配当することはできない」という結論部分である。正しくは、株式会社は、その保有する自己株式及び親会社の株式について、剰余金を配当することはできる場合がある。会社法453条、454条３項を確認する。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t232","type":"tf","q":"親子会社は、総株主の議決権の過半数保有のみが判断基準となる。","answer":"×","year":"","basis":"会社法２条３号・４号、会社法施行規則３条","explanation":"結論：×。誤りは「親子会社は、総株主の議決権の過半数保有のみが判断基準となる」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法２条３号・４号、会社法施行規則３条を確認する。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t233","type":"tf","q":"A 株式会社は、B 株式会社の総株主の議決権の 60%を保有している。B 会社が自己株式及び A 会社の株式を適法に保有している場合、B 会社は、自己株式については相当の時期に処分することを要しないが、A 会社の株式については相当の時期に処分することを要する。","answer":"○","year":"令和1年","basis":"会社法104条～130条","explanation":"結論：〇。会社法104条～130条により、設問の内容でよい。判断の肝は、取得・処分・消却で適用条文が異なる点である。"},{"id":"t234","type":"tf","q":"取締役会設置会社である A 株式会社(以下 A 社という。)は、B 株式会社(以下 B 社という。)の総株主の議決権の 60%を保有している。この場合、B 社は原則として A 社の株式を取得することはできないが、B 社が例外的に適法に A 社株式を保有している場合、A 社は取締役会決議をもってその株式を買い受けることができる。","answer":"○","year":"平成29年","basis":"会社法295条、309条、831条","explanation":"結論：〇。会社法295条、309条、831条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t235","type":"tf","q":"株式譲渡の承認機関は原則的に、取締役会設置会社では取締役会、それ以外では株主総会である。","answer":"○","year":"","basis":"会社法139条１項","explanation":"結論：〇。会社法139条１項により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t236","type":"tf","q":"株式会社は、その発行する株式の取得に承認を要する場合を定款によって限定することが可能である。","answer":"○","year":"","basis":"会社法104条～130条","explanation":"結論：〇。会社法104条～130条により、設問の内容でよい。判断の肝は、原則・例外と、主体・決議機関・要件を取り違えない点である。"},{"id":"t237","type":"tf","q":"株式会社がその発行する株式の取得を不承認とした場合に、当該譲渡制限株式を買い取る必要があり、その場合、株主総会の特別決議を要し、財源規制にも服する。","answer":"○","year":"","basis":"会社法140条１項・２項、461条１項１号","explanation":"結論：〇。会社法140条１項・２項、461条１項１号により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t238","type":"tf","q":"譲渡による株式の取得につき会社の承認を要する旨の定款規定のある取締役会設置会社では、その承認機関は取締役会であり、定款をもって株主総会を承認機関とすることはできない。","answer":"×","year":"令和1年","basis":"会社法139条１項","explanation":"結論：×。誤りは「譲渡による株式の取得につき会社の承認を要する旨の定款規定のある取締役会設置会社では、その承認機関は取締役会であり、定款をもって株主総会を承認機関とすることはできない」という結論部分である。正しくは、譲渡による株式の取得につき会社の承認を要する旨の定款規定のある取締役会設置会社では、その承認機関は取締役会であり、定款をもって株主総会を承認機関とすることはできる場合がある。会社法139条１項を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t239","type":"tf","q":"判例によれば、従業員株主を他の株主よりも先に入場させて、株主席の前方へ着席させた措置につき適切ではなく、同じ株主総会に出席する株主に対しては、合理的理由のない限り同一の取扱いをすべきとされている。","answer":"○","year":"","basis":"会社法109条１項、判例","explanation":"結論：〇。会社法109条１項、判例により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t240","type":"tf","q":"非公開会社では、株主総会の招集通知の期間を法定期間よりも短縮することはできるが、招集通知を省略して株主総会を開催することはできない。","answer":"×","year":"令和3年","basis":"会社法295条、309条、831条","explanation":"結論：×。誤りは「非公開会社では、株主総会の招集通知の期間を法定期間よりも短縮することはできるが、招集通知を省略して株主総会を開催することはできない」という結論部分である。正しくは、非公開会社では、株主総会の招集通知の期間を法定期間よりも短縮することはできるが、招集通知を省略して株主総会を開催することはできる場合がある。会社法295条、309条、831条を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t241","type":"tf","q":"招集通知は、非公開会社では会日の１週間前に招集通知を発すればよく、取締役会が設置されない会社では、定款をもって招集通知期間を無制限に短縮することができる。","answer":"○","year":"","basis":"会社法362条、369条","explanation":"結論：〇。会社法362条、369条により、設問の内容でよい。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t242","type":"tf","q":"株主全員の同意があっても招集手続を省略することはできない。","answer":"×","year":"","basis":"会社法299条１項、300条","explanation":"結論：×。誤りは「株主全員の同意があっても招集手続を省略することはでき :"tf","q":"取締役等の役員の選任決議は株主総会の普通決議事項であるから、その定足数を定款をもって緩和または排除することもできる。","answer":"×","year":"","basis":"会社法309条１項・２項、341条","explanation":"結論：×。誤りは「取締役等の役員の選任決議は株主総会の普通決議事項であるから、その定足数を定款をもって緩和または排除することもできる」という結論部分である。正しくは、取締役等の役員の選任決議は株主総会の普通決議事項であるから、その定足数を定款をもって緩和または排除することもできない又は要件を満たす場合に限られる。会社法309条１項・２項、341条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t251","type":"tf","q":"取締役等の役員の損害賠償責任は、株主総会を開催せずとも総株主の同意を得ることをもって免除することができる。","answer":"○","year":"","basis":"会社法424条","explanation":"結論：〇。会社法424条により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t252","type":"tf","q":"株式会社の定款を変更するには株主総会の特別決議を要するが、譲渡による株式の取得につき会社の承認を要する旨の規定を新設するための定款変更には株主総会の特殊の決議を要る。","answer":"○","year":"令和3年","basis":"会社法309条３項１号","explanation":"結論：〇。会社法309条３項１号により、設問の内容でよい。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id":"t253","type":"tf","q":"公開会社においては役員の職務執行に関して不正の行為または法令・定款に違反する重大な事実があるにもかかわらず株主総会で解任決議が否決されたときは、３ヶ月前から引き続き総株主の議決権または発行済株式総数の 3%以上を有する株主は、30 日以内に訴えをもってその役員の解任を請求することができる。","answer":"×","year":"","basis":"会社法339条１項、341条","explanation":"結論：×。誤りは「公開会社においては役員の職務執行に関して不正の行為または法令・定款に違反する重大な事実があるにもかかわらず株主総会で解任決議が否決されたときは、３ヶ月前から引き続き総株主の議決権または発行済...」という結論部分である。正しくは、公開会社においては役員の職務執行に関して不正の行為または法令・定款に違反する重大な事実があるにもかかわらず株主総会で解任決議が否決されたときは、３ヶ月前から引き続き総株主の議決権または発行済株式総数の 3%以上を有する株主は、30 日以内に訴えをもってその役員の解任を請求することができない又は要件を満たす場合に限られる。会社法339条１項、341条を確認する。判断の肝は、公開会社・非公開会社で機関設計や要件が異なる点である。"},{"id":"t254","type":"tf","q":"議案が否決された場合であっても、決議取消の対象となる。","answer":"×","year":"","basis":"会社法831条１項、判例","explanation":"結論：×。誤りは「議案が否決された場合であっても、決議取消の対象となる」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法831条１項、判例を確認する。判断の肝は、取消し・無効・不存在で原因と出訴期間が異なる点である。"},{"id":"t255","type":"tf","q":"判例では、株主総会の招集通知漏れがあった場合における決議取消訴訟の訴えの主張権者は、当該招集通知漏れのあった株主に限られるとされている。","answer":"×","year":"","basis":"会社法295条、309条、831条","explanation":"結論：×。誤りは「判例では、株主総会の招集通知漏れがあった場合における決議取消訴訟の訴えの主張権者は、当該招集通知漏れのあった株主に限られるとされている」という結論部分である。正しくは、問題文の結論はそのままでは認められず、条文所定の要件・例外に従って判断する。会社法295条、309条、831条を確認する。判断の肝は、株主総会と取締役会で決議要件・権限が異なる点である。"},{"id
